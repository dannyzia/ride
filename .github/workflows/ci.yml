# CI — Ride monorepo (Expo app + utils-server).
#
# Purpose:     Hosted gate on every push/PR: lint → typecheck (both packages) →
#               vacuous-assertion gate → full jest suite. Complements the local
#               pre-commit/pre-push hooks (scripts/git-hooks/*).
# Owner:       Coding model (test lane)
# Status:      ACTIVE
# Related (concrete paths):
#   - scripts/check-vacuous-assertions.js — vacuous gate CLI (also inside test:all)
#   - tests/meta/vacuous-assertion-gate.test.ts — in-suite meta gate
#   - package.json — scripts: lint / test:all / check:vacuous
# Last verified: 2026-09-09 (run #2 fix) — dropped the separate utils-server
#   install (run #1 failed: ^-ranges resolved drizzle-orm 0.45.2 there, and
#   root tsc type-checks utils-server sources via root test imports).
#   Sequence re-proven locally post-npm-ci: 1976/1976, tsc 0/0, lint 0 errors.
# How to update: keep step order aligned with the house validation order
#   (lint → typecheck → test); do not add deploy steps here.

name: CI

on:
  push:
    branches: [main, develop, implementation]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Root workspace (Expo app, API routes, tests). `npm ci` requires the
      # committed package-lock.json — keeps CI reproducible.
      - name: Install root dependencies
        run: npm ci

      # utils-server resolves its runtime deps from the ROOT node_modules —
      # exactly like local dev, where utils-server/node_modules does not exist
      # (every local gate pass runs that way). Installing utils-server deps
      # separately would resolve its ^-ranges to newer majors (drizzle-orm
      # ^0.42.0 -> 0.45.2) and root tsc — which pulls utils-server sources in
      # via root test imports — would then type-check them against drifted
      # typings. Run #1 failed exactly that way; this step must stay absent
      # until utils-server gets its own committed lockfile (a schema/dep
      # decision for Zia).

      - name: Lint
        run: npm run lint

      - name: Typecheck (root)
        run: npx tsc --noEmit

      - name: Typecheck (utils-server)
        run: npx tsc --noEmit
        working-directory: utils-server

      # test:all = check:vacuous (vacuous-assertion gate) && jest --ci.
      # The vacuous gate fails the run if any placeholder assertion
      # (expect(true).toBe(true), expect(N).toBeDefined(), …) exists in a
      # test file — see scripts/vacuous-assertion-scanner.js for the rule set.
      - name: Vacuous-assertion gate + full test suite
        run: npm run test:all
