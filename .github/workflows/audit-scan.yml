# Scheduled dependency audit scan (npm-audit-triage suppression policy, 2026-09-09).
#
# Purpose:     Weekly hosted sweep of npm advisories across all severity levels,
#              independent of the push-triggered CI gate (which blocks only on
#              critical). Produces a standing record of the advisory landscape so
#              drift between SDK upgrades is visible. ALWAYS-GREEN by design —
#              findings are reported, not failed; new criticals are caught by the
#              blocking CI step on the next push.
# Owner:       Coding model (test lane); dispositions in
#              .kilo/plans/findings/2026-09-09-npm-audit-triage.md
# Status:      ACTIVE
# Related (concrete paths):
#   - .github/workflows/ci.yml — push-triggered gate incl. the critical-blocking
#     npm audit step
#   - .kilo/plans/findings/2026-09-09-npm-audit-triage.md — per-finding
#     dispositions and the suppression policy this workflow implements
# How to update: keep it always-green (audit output is informational); adjust the
#   cron only if the weekly cadence changes.

name: Scheduled audit scan

on:
  schedule:
    # Every Monday 03:07 UTC (Off-peak GitHub Actions slot).
    - cron: "7 3 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: npm audit (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci

      # Informational: full-severity listing so the log carries the complete
      # advisory landscape. Never fails the run (|| true) — dispositions are
      # owned by the findings file, and criticals are enforced by CI's
      # blocking audit step, not here.
      - name: Full-severity audit listing
        run: npm audit --json || true

      - name: Audit summary
        run: npm audit || true
