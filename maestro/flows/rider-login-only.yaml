---
appId: com.ride.bd
name: Rider Login (no clearState)
tags: [rider-login]
---
# Gate 1 REWIRE PASS 2 — text taps replaced with the testIDs verified in
# maestro/tools/testid-map.json (app/(auth)/phone-entry.tsx, app/(auth)/login.tsx):
# "Login" -> phone-entry.handle-login, role chip -> phone-entry.set-role,
# password -> login.set-password. Ad-hoc no-clearState variant; the maintained
# path is auth/02-rider-login.yaml via shared/auth/_login-rider.yaml.
# B-1: both trailing steps asserted the dead "Search destination" string (home.search_destination
# is "Where to?"); they would have burned 30s then failed. Now the el-2 testID.
- tapOn:
    id: "phone-entry.set-phone"
- eraseText
- inputText: "1613249520"
- tapOn:
    id: "phone-entry.set-role"
- tapOn:
    id: "phone-entry.handle-login"
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 15000
- tapOn:
    id: "login.set-password"
- eraseText
- inputText: "test1234"
- tapOn:
    id: "login.handle-login"
- extendedWaitUntil:
    visible:
      id: "customer.home.el-2"
    timeout: 30000
- assertVisible:
    id: "customer.home.el-2"
