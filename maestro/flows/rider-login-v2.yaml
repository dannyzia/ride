---
appId: com.ride.bd
---
# Gate 1 REWIRE PASS 2 — text taps replaced with the testIDs verified in
# maestro/tools/testid-map.json (app/(auth)/phone-entry.tsx, app/(auth)/login.tsx).
# Same covered path as rider-login-only.yaml; kept as a second regression probe.
# B-1: scrollUntil keyed on the dead "Search destination" string (home.search_destination is
# "Where to?"). scrollTimes: 0 means this never scrolled anyway — it was a pure wait wearing
# a scrollUntil costume. Now the el-2 testID.
- tapOn:
    id: "phone-entry.set-phone"
- eraseText
- inputText: "1613249520"
- tapOn:
    id: "phone-entry.set-role"
- tapOn:
    id: "phone-entry.handle-login"
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 15000
- tapOn:
    id: "login.set-password"
- eraseText
- inputText: "test1234"
- tapOn:
    id: "login.handle-login"
- wait: 10000
- scrollUntil:
    visible:
      id: "customer.home.el-2"
    timeout: 30000
    scrollTimes: 0
