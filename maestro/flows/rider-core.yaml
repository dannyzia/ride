# Device: emulator-5554 (Rider).
# Run: maestro test maestro/flows/rider-core.yaml   (only emulator-5554 connected)
# Preconditions: rider account +8801613249520 is logged in and on Home.
# COORDINATION: run driver-core.yaml on emulator-5556 at the same time. The driver must
# Accept the offer, slide Arrival, type the Ride Pin (read from THIS rider screen), Start,
# and slide Drop-off. The rider flow below mostly WAITS for those driver-driven states.
#
# Gate 1 REWIRE PASS 2 — LABEL DRIFT CORRECTION + testID conversion (booking prefix uses
# the same live-sheet mapping as rider-trigger-ride.yaml). Rating block: the old taps on
# the "☆" glyph (fragile across filled/outline icon fonts) and "Submit Rating" are now
# customer.rate-driver.set-rating (index = STARS-1) and customer.rate-driver.handle-submit
# (rate-driver/index.tsx L303/L393 — the screen IS still routed, from user-arrived,
# ride-tracking and activity-completed). The trailing "Back to Home" tap was driver-side
# copy on the shared finish surface; the rider simply lands back on Home, so the flow now
# asserts that directly via customer.home.el-2.
appId: com.ride.bd
name: "Part 4 - Rider Core Loop (request + track + complete + rate)"
tags:
  - rider
  - core
---
- launchApp:
    appId: com.ride.bd
- extendedWaitUntil:
    visible:
      id: "customer.home.el-2"
    timeout: 20000
- tapOn:
    id: "customer.home.el-2"
- extendedWaitUntil:
    visible:
      id: "customer.autocomplete.set-query"
    timeout: 15000
- tapOn:
    id: "customer.autocomplete.set-query"
- inputText: "Savar"
- extendedWaitUntil:
    visible: ".*Savar.*"
    timeout: 20000
- tapOn:
    id: "customer.autocomplete.handle-place-select"
    text: ".*Savar.*"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "customer.home.handle-next"
- extendedWaitUntil:
    visible:
      id: "customer.home.set-selected-vehicle-type"
    timeout: 20000
- swipe:
    direction: UP
    duration: 300
- tapOn:
    id: "customer.home.set-selected-vehicle-type"
    text: ".*Bike Plus.*"
- tapOn:
    id: "customer.home.handle-call-for-ride"
- extendedWaitUntil:
    visible:
      id: "customer.finding-driver.handle-cancel"
    timeout: 30000
# ---- driver must Accept the offer on emulator-5556 ----
- extendedWaitUntil:
    visible: ".*Ride Pin.*"
    timeout: 120000                            # matched; PIN card shown
# ---- driver slides Arrival, then types the PIN shown above, then taps Start ----
- extendedWaitUntil:
    visible: ".*Ride in progress.*"
    timeout: 240000                            # in_progress banner
# ---- driver slides Drop-off ----
- extendedWaitUntil:
    visible: ".*Ride Complete.*"
    timeout: 300000
- assertVisible: ".*Total Fare.*"
# ---- optional rating screen (may or may not appear) ----
- runFlow:
    when:
      visible: ".*Rate.*Driver.*"
    commands:
      - tapOn: ".*Rate.*Driver.*"
      - extendedWaitUntil:
          visible:
            id: "customer.rate-driver.set-rating"
          timeout: 15000
      - tapOn:
          id: "customer.rate-driver.set-rating"
          index: 4                            # tap 5th star to set 5 stars
      - waitForAnimationToEnd:
          timeout: 1000
      - tapOn:
          id: "customer.rate-driver.handle-submit"
      - extendedWaitUntil:
          visible:
            id: "customer.home.el-2"
          timeout: 20000
- extendedWaitUntil:
    visible:
      id: "customer.home.el-2"
    timeout: 30000