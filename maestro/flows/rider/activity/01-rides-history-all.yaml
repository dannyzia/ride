# rider/activity/01-rides-history-all — Activity tab lists ride history (all statuses).
# Feature: R-HOME-03 / history (§4). READ-ONLY render surface; fixtures ride-01…06
# require Gate 2 seeding — assertions here are render-level only.
# Class: AUTOMATABLE (render) with fixture-dependent detail deferred.
appId: com.ride.bd
name: "Rider Activity - Rides History"
tags: [rider, activity]
---
- runFlow:
    env:
      PHONE: "8801613249520"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../../../shared/auth/_login-rider.yaml
- tapOn: ".*Activity.*|.*Rides.*"
- extendedWaitUntil:
    visible: ".*Completed.*|.*Cancelled.*|.*canceled.*|.*No rides.*|.*history.*"
    timeout: 20000
