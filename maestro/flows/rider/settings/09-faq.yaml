# rider/settings/09-faq — FAQ screen renders content (READ-ONLY render assertion).
# Feature: R-SETT support/FAQ (§4, LOW risk).
# Gate 1 REWIRE PASS 2 — the ".*FAQ.*|.*Help.*" copy selector is now
# customer.profile.push-faq (the FAQ SettingsRow, added in this pass), and the
# screen ground is customer.settings.faq.el-1 (the header back button, so the
# assertion is "the FAQ screen is mounted" rather than a copy match).
# Class: READ-ONLY (render assert).
appId: com.ride.bd
name: "Rider Settings - FAQ"
tags: [rider, settings]
---
- runFlow:
    env:
      PHONE: "8801613249520"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../../../shared/auth/_login-rider.yaml
- runFlow: ../../../shared/util/_open-profile-tab.yaml
- tapOn:
    id: "customer.profile.push-faq"
- extendedWaitUntil:
    visible:
      id: "customer.settings.faq.el-1"
    timeout: 20000
- assertVisible:
    id: "customer.settings.faq.el-1"