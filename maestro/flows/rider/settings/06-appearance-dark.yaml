# rider/settings/06-appearance-dark — toggle appearance to dark and assert dark renders.
# Feature: R-SETT appearance (§4). Selector source: settings.appearance.toggle_theme=
# "Appearance" (en/common.json §settings); NativeWind dark: variants per AGENTS.md
# (no ThemeProvider). Class: AUTOMATABLE.
appId: com.ride.bd
name: "Rider Settings - Appearance Dark"
tags: [rider, settings, appearance]
---
- runFlow:
    env:
      PHONE: "8801613249520"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../../../shared/auth/_login-rider.yaml
- runFlow: ../../../shared/util/_open-settings-hub.yaml
- tapOn: ".*Appearance.*"
- tapOn: ".*Dark.*"
- extendedWaitUntil:
    visible: ".*Appearance.*"
    timeout: 10000
