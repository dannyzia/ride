# rider/settings/07-loyalty-points — loyalty screen renders points balance (GROWTH BC-15).
# Redemption mechanics are backend-gated; render assertion is the safe floor.
#
# Gate 1 REWIRE PASS 2 — the app-level navigation gap is now CLOSED.
# This flow used to deep-link straight to the settings hub because there was no
# loyalty row on the profile AND nothing in the rider tree routed to the hub.
# `customer.profile.push-settings-hub` now exists (profile/index.tsx, Preferences
# section), so the journey is driven in-app: Profile -> Settings -> Loyalty.
# The deep link is gone; the row IDs below all resolve against the map.
# Class: AUTOMATABLE (render).
appId: com.ride.bd
name: "Rider Settings - Loyalty Points"
tags: [rider, settings, growth]
---
- runFlow:
    env:
      PHONE: "8801613249520"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../../../shared/auth/_login-rider.yaml
- runFlow: ../shared/util/_open-settings-hub.yaml
# _open-settings-hub already lands on the hub (taps customer.profile.push-settings-hub
# and grounds on customer.settings.el-1), so select the Loyalty row from here.
- tapOn:
    id: "customer.settings.el-1"
    text: ".*Loyalty.*"
- extendedWaitUntil:
    visible:
      id: "customer.settings.loyalty.el-1"
    timeout: 20000
- assertVisible:
    id: "customer.settings.loyalty.el-1"