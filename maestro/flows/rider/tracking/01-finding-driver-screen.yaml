# rider/tracking/01-finding-driver-screen — request submitted → finding-driver surface
# renders with cancel affordance; no driver seeded so "no drivers" path may appear.
# Feature: R-HOME-06 / tracking (§4). utils-server REQUIRED for live dispatch
# (INSTANCE_COUNT=1); without it the finding state persists — which this flow tolerates
# (assertion is on the finding UI, not on a match).
# Class: AUTOMATABLE.
appId: com.ride.bd
name: "Rider Tracking - Finding Driver Screen"
tags: [rider, tracking, smoke]
---
- runFlow: ../../../shared/location/_set-gps-banani.yaml
- runFlow:
    env:
      PHONE: "8801613249520"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../../../shared/auth/_login-rider.yaml
- runFlow:
    env:
      DEST_NAME: "Gulshan"
    commands:
      - runFlow: ../../../shared/booking/_select-destination.yaml
- runFlow:
    env:
      VEHICLE_TYPE: "Bike Basic"
    commands:
      - runFlow: ../../../shared/booking/_select-vehicle.yaml
- runFlow: ../../../shared/booking/_confirm-and-request.yaml
- extendedWaitUntil:
    visible: ".*Cancel.*"
    timeout: 30000
