# rider/booking/02-all-vehicle-types — all 9 vehicle tiers render on the fare screen
# and each tier card is selectable.
# Feature: R-BOOK-04 (§4). Gate 1 REWIRE: tier asserts use id+text pairs on
# customer.find-ride.set-selected-vehicle-type (tier card testID + tier label) —
# exact-card identity, not just any matching text on screen. Tier labels per
# i18n §find_ride.vehicle_* ("Bike Basic",
# "Bike Standard", "Bike Plus", "CNG", "Car Compact", "Car Economy", "Car Comfort",
# "Car Premium", "Car XL" — verified in en/common.json; car_compact sits between
# cng and car_economy per AGENTS.md § Vehicle Types).
# Class: AUTOMATABLE.
appId: com.ride.bd
name: "Rider Booking - All Vehicle Types"
tags: [rider, booking]
---
- runFlow: ../../../shared/location/_set-gps-banani.yaml
- runFlow:
    env:
      PHONE: "8801613249520"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../../../shared/auth/_login-rider.yaml
- runFlow:
    env:
      DEST_NAME: "Gulshan"
    commands:
      - runFlow: ../../../shared/booking/_select-destination.yaml
- extendedWaitUntil:
    visible: ".*Choose a ride.*|.*FARES.*"
    timeout: 30000
- assertVisible:
    id: "customer.find-ride.set-selected-vehicle-type"
    text: ".*Bike Basic.*"
- assertVisible:
    id: "customer.find-ride.set-selected-vehicle-type"
    text: ".*Bike Standard.*"
- assertVisible:
    id: "customer.find-ride.set-selected-vehicle-type"
    text: ".*Bike Plus.*"
- assertVisible:
    id: "customer.find-ride.set-selected-vehicle-type"
    text: ".*CNG.*"
- assertVisible:
    id: "customer.find-ride.set-selected-vehicle-type"
    text: ".*Car Compact.*"
- assertVisible:
    id: "customer.find-ride.set-selected-vehicle-type"
    text: ".*Car Economy.*"
- assertVisible:
    id: "customer.find-ride.set-selected-vehicle-type"
    text: ".*Car Comfort.*"
- assertVisible:
    id: "customer.find-ride.set-selected-vehicle-type"
    text: ".*Car Premium.*"
- assertVisible:
    id: "customer.find-ride.set-selected-vehicle-type"
    text: ".*Car XL.*"
- runFlow:
    env:
      VEHICLE_TYPE: "Car Comfort"
    commands:
      - runFlow: ../../../shared/booking/_select-vehicle.yaml
