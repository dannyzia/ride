# rider/booking/09-multi-stop-ride — add two stops; multi-leg fare shows on confirm.
# Feature: R-BOOK multi-stop (§4). Consumes _add-stop twice. Fixture stops are
# Dhaka-local (Banani corridor per §3.2). Class: AUTOMATABLE.
appId: com.ride.bd
name: "Rider Booking - Multi-Stop Ride"
tags: [rider, booking]
---
- runFlow: ../../../shared/location/_set-gps-banani.yaml
- runFlow:
    env:
      PHONE: "8801613249520"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../../../shared/auth/_login-rider.yaml
- runFlow:
    env:
      DEST_NAME: "Gulshan"
    commands:
      - runFlow: ../../../shared/booking/_select-destination.yaml
- runFlow:
    env:
      STOP_NAME: "Mohakhali"
    commands:
      - runFlow: ../../../shared/booking/_add-stop.yaml
- runFlow:
    env:
      STOP_NAME: "Banani"
    commands:
      - runFlow: ../../../shared/booking/_add-stop.yaml
- extendedWaitUntil:
    visible: ".*Stop 1.*|.*Stop 2.*|.*Confirm ride.*"
    timeout: 20000
