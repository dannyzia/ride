# rider/booking/05-scheduled-ride — pre-book a ride from the live booking sheet:
# tap "Schedule for later", submit the schedule screen's default time, verify the
# confirmation screen.
# Feature: R-BOOK scheduled (§4, BC-13).
# B-3 RESOLVED 2026-10-04 — DECISION: BUILD (the feature is server-complete and a
# full schedule screen already exists; only the entry point was missing).
#   1. Server: POST /api/ride/schedule — 30min–7d lead, overlap 409, ≤3/hour,
#      status 'scheduled'; scheduler promotes scheduled → finding
#      (utils-server/scheduler.ts); covered by tests/api/ride/schedule.test.ts.
#   2. app/(main)/(customer)/schedule-ride/ is the scheduling screen; it reads
#      pickup/destination from useCustomer() and vehicle from useRiderStore() —
#      the same stores the home sheet writes — so the booking-sheet selection
#      carries over with no extra params.
#   3. Entry point rebuilt: customer.home.push-schedule-ride on the FARES step
#      (app/(main)/(customer)/(tabs)/home/index.tsx), replacing the toggle that
#      lived in the deleted confirm-ride/. ScheduleRideSheet remains the date/time
#      control on the schedule screen.
#   4. The schedule screen defaults scheduled_at to now+1h rounded up to the next
#      half-hour — inside the server window by construction — so this flow accepts
#      the default instead of driving the date/time pickers.
# Class: AUTOMATABLE. NOT device-verified (device day ENV-blocked).
appId: com.ride.bd
name: "Rider Booking - Scheduled Ride"
tags: [rider, booking, scheduling]
---
- runFlow: ../../../shared/location/_set-gps-banani.yaml
- runFlow:
    env:
      PHONE: "8801613249520"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../../../shared/auth/_login-rider.yaml
- runFlow:
    env:
      DEST_NAME: "Gulshan"
    commands:
      - runFlow: ../../../shared/booking/_select-destination.yaml
- runFlow:
    env:
      VEHICLE_TYPE: "Bike Basic"
    commands:
      - runFlow: ../../../shared/booking/_select-vehicle.yaml
- scrollUntilVisible:
    element:
      id: "customer.home.push-schedule-ride"
    direction: DOWN
- tapOn:
    id: "customer.home.push-schedule-ride"
- extendedWaitUntil:
    visible:
      id: "customer.schedule-ride.handle-schedule"
    timeout: 20000
- tapOn:
    id: "customer.schedule-ride.handle-schedule"
- extendedWaitUntil:
    visible:
      id: "customer.ride-scheduled.set-theme"
    timeout: 20000
