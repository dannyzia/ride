# rider/booking/05-scheduled-ride — toggle Schedule for later, set T+15min, submit,
# entry appears under Scheduled.
# Feature: R-BOOK scheduled (§4, BC-13). Gate 1 REWIRE (semantic IDs via
# testid-map.json): schedule toggle = customer.confirm-ride.set-schedule-later
# (confirm-ride/index.tsx L656); submit = customer.schedule-ride.handle-schedule
# (schedule-ride/index.tsx L295). Date/time pickers are OS surfaces — text asserts
# retained. NOTE: reminder timing needs Gate 5 override — not asserted here.
# Class: AUTOMATABLE.
appId: com.ride.bd
name: "Rider Booking - Scheduled Ride"
tags: [rider, booking, scheduling]
---
- runFlow: ../../../shared/location/_set-gps-banani.yaml
- runFlow:
    env:
      PHONE: "8801613249520"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../../../shared/auth/_login-rider.yaml
- runFlow:
    env:
      DEST_NAME: "Gulshan"
    commands:
      - runFlow: ../../../shared/booking/_select-destination.yaml
- runFlow:
    env:
      VEHICLE_TYPE: "Bike Basic"
    commands:
      - runFlow: ../../../shared/booking/_select-vehicle.yaml
- extendedWaitUntil:
    visible: ".*Confirm your ride.*"
    timeout: 20000
- tapOn:
    id: "customer.confirm-ride.set-schedule-later"
- extendedWaitUntil:
    visible: ".*Schedule ride.*|.*date.*|.*time.*"
    timeout: 15000
- tapOn:
    id: "customer.schedule-ride.handle-schedule"
- extendedWaitUntil:
    visible: ".*Scheduled.*|.*schedule.*"
    timeout: 20000
