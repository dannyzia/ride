# marketplace/v4-food/01-food-to-bridge-to-courier — Food order end-to-end:
# food order placed in customer UI (the `deliveries` leg is created in the
# PLACEMENT tx — S4/§6.1, idempotent on order_id) → shop marks ready
# (COUNTERPART, pure transition) → dispatch chain offers the leg (the shop's
# prep start armed it) → agent accepts THE offer (COUNTERPART) →
# courier/leg flow reflected to customer.
#
# ✅ S6 REWIRE: this flow previously answered the RETIRED RFQ delivery_requests
# row (LATEST_DELIVERY_REQUEST). Order-derived legs now dispatch SEQUENTIALLY
# through the single-offer chain (§6.1), so the courier step is the dispatched
# offer on the `deliveries` leg: the shop preps (which ARMS the search, R-A1)
# and the agent answers THE live offer. The in-app Delivery Man journey — offer
# card, pickup, proof, delivered, earnings — is delivery/01-dispatched-offer-to-delivered;
# this flow keeps the API-only counterpart view of the same chain for the
# two-sided matrix.
#
# COUNTERPART-API calls:
#   1. _counterpart-shop-ready            → POST /api/shop/orders/{id}/mark-ready (pure transition)
#   2. _counterpart-delivery-agent-respond → POST /api/delivery/offers/{leg_id}/respond (§6.1 step 4)
# Gate 1 REWIRE: home chip ("Food"), add-to-cart, checkout, order submit = semantic
# IDs (same derivation as v3-shops/01; food rides the shops screens). Class:
# AUTOMATABLE + COUNTERPART-API. BLOCKED until roster fixtures land.
appId: com.ride.bd
name: "V4 Food - Bridge to Courier"
tags: [marketplace, v4-food, counterpart-api]
---
- runFlow:
    env:
      PHONE: "8801613249520"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../../shared/auth/_login-rider.yaml
- tapOn:
    id: "customer.home.set-selected-category"
    text: ".*Food.*|.*Shop.*"
- tapOn:
    text: ".*"
    index: 0
- tapOn:
    id: "customer.shops.shop-detail.id.add-to-cart"
- tapOn:
    id: "customer.shops.shop-detail.id.push-order-create"
- tapOn:
    id: "customer.shops.order-create.id.handle-submit"
- extendedWaitUntil:
    visible: ".*pending.*|.*preparing.*|.*order.*"
    timeout: 30000
# ── Counterpart side (API): shop marks ready → bridge creates delivery ────────
- runFlow:
    env:
      SHOP_PHONE: "8801700000201"
      SHOP_PASSWORD: "test1234"
      ORDER_ID: "LATEST_FOOD_ORDER"
    commands:
      - runFlow: ../../shared/marketplace/_counterpart-shop-ready.yaml
# ── Counterpart side (API): the agent accepts THE dispatched offer (§6.1) ─────
- runFlow:
    env:
      COURIER_PHONE: "8801700000301"
      COURIER_PASSWORD: "test1234"
      LEG_ID: "LATEST_DELIVERY_LEG"
      DECISION: "accept"
    commands:
      - runFlow: ../../shared/delivery/_counterpart-delivery-agent-respond.yaml
# ── Customer side (UI): order/delivery state reflects the courier ─────────────
- extendedWaitUntil:
    visible: ".*on the way.*|.*picked.*|.*courier.*|.*delivering.*"
    timeout: 60000
