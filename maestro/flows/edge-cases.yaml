# Device: emulator-5554 (Rider).
# Run: maestro test maestro/flows/edge-cases.yaml   (only emulator-5554 connected)
# Preconditions: rider account +8801613249520 is logged in and on Home.
# Active case: live-flow cancellation from the finding-driver screen.
# Gate 1 REWIRE PASS 2 — LABEL DRIFT CORRECTION + testID conversion (same mapping as
# rider-trigger-ride.yaml: the old copy selectors belonged to the retired find-ride/
# confirm-ride booking screens; the live sheet lives in (tabs)/home/index.tsx).
# Cancellation itself is now customer.finding-driver.handle-cancel
# (finding-driver/index.tsx L471, onPress={handleCancel}); the source comment calls it
# "Cancel Booking — always visible", so it is a reliable presence proxy for that screen.
# EXCLUDED cases (verified absent in code as of 2026-07):
#   - Wallet Top-Up: screens exist but are NOT reachable from the tab bar (deep-link only).
#   - Driver Min-Rate slider: components/MinRateSlider.tsx is imported by ZERO screens; no such UI.
#   - SOS: components/SOSButton.tsx opens the SYSTEM dialer (tel:); no "Send SOS"/"SOS Sent" text; breaks automation.
#   - Forced Update: gated by system_config min_app_version; system-level, out of scope here.
appId: com.ride.bd
name: "Part 5 - Rider Cancellation (other planned cases excluded - see notes)"
tags:
  - rider
  - edge
  - cancel
---
- launchApp:
    appId: com.ride.bd
- extendedWaitUntil:
    visible:
      id: "customer.home.el-2"
    timeout: 20000
- tapOn:
    id: "customer.home.el-2"
- extendedWaitUntil:
    visible:
      id: "customer.autocomplete.set-query"
    timeout: 15000
- tapOn:
    id: "customer.autocomplete.set-query"
- inputText: "Savar"
- extendedWaitUntil:
    visible: ".*Savar.*"
    timeout: 20000
- tapOn:
    id: "customer.autocomplete.handle-place-select"
    text: ".*Savar.*"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "customer.home.handle-next"
- extendedWaitUntil:
    visible:
      id: "customer.home.set-selected-vehicle-type"
    timeout: 20000
- swipe:
    direction: UP
    duration: 300
- tapOn:
    id: "customer.home.set-selected-vehicle-type"
    text: ".*Bike Plus.*"
- tapOn:
    id: "customer.home.handle-call-for-ride"
# --- cancel the in-flight request ---
- extendedWaitUntil:
    visible:
      id: "customer.finding-driver.handle-cancel"
    timeout: 30000
- tapOn:
    id: "customer.finding-driver.handle-cancel"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "customer.finding-driver.handle-cancel"
- extendedWaitUntil:
    visible:
      id: "customer.home.el-2"
    timeout: 15000