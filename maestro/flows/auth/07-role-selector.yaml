# auth/07-role-selector — role chip toggles between Rider and Driver at login.
# Feature: R-AUTH-01 (§4). Chips are display-labeled TouchableOpacity elements
# WITHOUT testIDs in the codemod output (G-02 remainder: e2e copy strings, not
# handler-derived) — text taps retained by design, NOT an oversight.
# Class: AUTOMATABLE.
appId: com.ride.bd
name: "Auth - Role Selector"
tags: [auth]
---
- launchApp:
    appId: com.ride.bd
    clearState: true
- extendedWaitUntil:
    visible: "Log In"
    timeout: 20000
- tapOn: "Driver"
- tapOn: "Rider"
- assertVisible: ".*Enter your phone number.*"
- assertVisible: "Log In"
