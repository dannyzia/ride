# auth/08-logout — signed-in rider signs out and returns to the auth surface.
# Feature: R-HOME-05 (§4). Consumes _logout shared subflow (Gate 1 REWIRE: tab via
# customer._layout.on-press, sign-out via customer.profile.confirm-sign-out, confirm
# via the OS Alert.alert TEXT — profile/index.tsx:120; the separate
# settings/logout-confirmation route/id is NOT this path). Fixtures: Rider A.
# Class: AUTOMATABLE.
appId: com.ride.bd
name: "Auth - Logout"
tags: [auth]
---
- runFlow:
    env:
      PHONE: "8801613249520"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../shared/auth/_login-rider.yaml
- runFlow: ../shared/auth/_logout.yaml
# GROUND FIX: was ".*Log In.*|.*Get Started.*", an either/or alternation that
# passed on EITHER branch and so never pinned the auth surface; its "Log In"
# branch had also been rescued only by the orphaned auth.login value. The
# _logout subflow now grounds on phone-entry's own testID, and this assertion
# reuses that same ground rather than re-testing loose copy.
- assertVisible:
    id: "phone-entry.set-phone"
