# auth/06-otp-wrong-code — wrong OTP shows an error and allows retry.
# Feature: R-AUTH-03 negative (§4 N column). Gate 1 REWIRE: phone field, login CTA
# and OTP steps use semantic IDs (login.set-phone, login.handle-login, then
# ../shared/auth/_otp-enter.yaml → otp-verify.set-otp / otp-verify.handle-verify-otp
# per flow-testid-map.json). Error assertion is TEXT (error banner has no testID).
# Fixture: OTP bypass code is 123456 in dev; 000000 must be rejected by the API.
# Class: AUTOMATABLE (negative — asserts failure path).
appId: com.ride.bd
name: "Auth - OTP Wrong Code"
tags: [auth, negative]
---
- launchApp:
    appId: com.ride.bd
    clearState: true
- extendedWaitUntil:
    visible: ".*Enter your phone number.*"
    timeout: 20000
- tapOn:
    id: "login.set-phone"
- inputText: "8801613249520"
- tapOn:
    id: "login.handle-login"
- extendedWaitUntil:
    visible: "Enter 6-digit OTP"
    timeout: 20000
- runFlow:
    env:
      OTP_CODE: "000000"
    commands:
      - runFlow: ../shared/auth/_otp-enter.yaml
- extendedWaitUntil:
    visible: ".*Invalid OTP.*|.*invalid.*|.*wrong.*"
    timeout: 20000
- assertVisible: "Enter 6-digit OTP"
