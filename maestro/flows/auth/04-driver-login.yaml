# auth/04-driver-login — driver logs in and lands on driver home with balance surfaces.
# Feature: D-AUTH login (§4). Fixtures: Driver B +8801700000001 / test1234 (§13 roster).
# Class: AUTOMATABLE.
appId: com.ride.bd
name: "Auth - Driver Login"
tags: [auth, smoke]
---
- runFlow: ../shared/location/_set-gps-banani.yaml
- runFlow:
    env:
      PHONE: "8801700000001"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../shared/auth/_login-driver.yaml
- runFlow: ../shared/util/_dismiss-dialogs.yaml
- assertVisible: ".*Calls Remaining.*|.*Connected.*|.*Go Online.*"
