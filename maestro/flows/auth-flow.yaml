# Part 1 - Auth (existing account, password login)
# PARAMETERIZED: works for rider OR driver depending on --env values.
#   ${PHONE}  = phone digits WITHOUT +880 prefix
#   ${EXPECT} = home-screen marker to assert success
#
# Rider:  maestro test --device emulator-5554 -e PHONE=1613249520 -e EXPECT="Search destination..." maestro/flows/auth-flow.yaml
# Driver: maestro test --device emulator-5556 -e PHONE=1700000001 -e EXPECT="Calls Remaining"        maestro/flows/auth-flow.yaml
#
# Existing accounts use PASSWORD login (test1234). OTP 123456 is only for new-account registration.
# Precondition: emulators running; .env.local has DEV_OTP_BYPASS=true (only matters for the commented registration path).

appId: com.ride.bd
name: "Part 1 - Auth (existing account, password login)"
tags:
  - auth
  - rider
  - driver
---
- clearState: com.ride.bd
- launchApp:
    appId: com.ride.bd
- extendedWaitUntil:
    visible: "Enter your phone number to continue"
    timeout: 20000
- tapOn: "1XXXXXXXXX"
- inputText: "${PHONE}"
- tapOn: "Login"
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 15000
- tapOn: "Password"
- inputText: "test1234"
- tapOn: "Login"
- extendedWaitUntil:
    visible: "${EXPECT}"
    timeout: 30000
- assertVisible: "${EXPECT}"

