# driver/rides/09-complete-ride — drop-off slide → completed modal with Total Fare.
# Feature: D-RIDE completion (§4 P0 CRITICAL §16). Gate 1 REWIRE: login/PIN steps run
# semantic IDs via subflows (_login-driver; _enter-pin → rider.enter-otp.handle-verify).
# Slide + completed-modal steps stay TEXT (device-proven contract; modal surface has
# no testID — G-02 remainder, see _complete-ride-driver header). Class: AUTOMATABLE
# (paired-run).
appId: com.ride.bd
name: "Driver Rides - Complete Ride"
tags: [driver, in-ride, smoke]
---
- runFlow:
    env:
      PHONE: "8801700000001"
      PASSWORD: "test1234"
    commands:
      - runFlow: ../../../shared/auth/_login-driver.yaml
- runFlow: ../../../shared/driver/_go-online.yaml
- runFlow: ../../../shared/driver/_accept-ride.yaml
- runFlow: ../../../shared/driver/_slide-arrive.yaml
- runFlow:
    env:
      PIN: "0000"
    commands:
      - runFlow: ../../../shared/driver/_enter-pin.yaml
- runFlow: ../../../shared/driver/_complete-ride-driver.yaml
