# _apply-promo — Apply-promos sheet → enter PROMO_CODE → apply.
# §9 Booking Subflows. Selector source: app/(main)/(customer)/apply-promos/index.tsx;
# i18n apply_promos section (en/common.json). Class: AUTOMATABLE.
appId: com.ride.bd
---
- tapOn: ".*Available discounts.*|.*Promo.*|.*promos.*"
- extendedWaitUntil:
    visible: ".*Promo.*|.*promo.*"
    timeout: 15000
- tapOn:
    textField: ".*code.*|.*CODE.*"
    optional: true
- inputText: ${PROMO_CODE}
- tapOn: ".*Apply.*"
- extendedWaitUntil:
    visible: ".*${PROMO_CODE}.*|.*off.*"
    timeout: 15000
