# _apply-promo — fare sheet → select an available discount chip.
# §9 Booking Subflows. Gate 1 REWIRE PASS 2 — SHEET REPLACED.
# The old subflow drove customer.apply-promos.set-promo-code / handle-apply, but
# app/(main)/(customer)/apply-promos/ is unreachable: nothing in the tree routes
# to it (same dead-screen class as find-ride/ and confirm-ride/ — see
# _select-vehicle.yaml for the proof pattern). The live fare sheet has no promo-code
# entry at all; discounts are pre-fetched and offered as inline chips on the home
# sheet, customer.home.set-selected-promo (home/index.tsx L1247,
# onPress={() => setSelectedPromo(isSelected ? null : d)}).
# ${PROMO_CODE} is now matched against the chip's rendered description — callers
# must pass a description (or a regex fragment of one), not a raw code.
# Redeeming by typed code is NOT testable until the apply-promos route is wired up;
# logged to maestro/COVERAGE-MANIFEST.md as a coverage gap, not a selector gap.
# Class: AUTOMATABLE (chip select); typed-code redemption is GAP-BLOCKED.
appId: com.ride.bd
---
- extendedWaitUntil:
    visible:
      id: "customer.home.set-selected-promo"
    timeout: 20000
- tapOn:
    id: "customer.home.set-selected-promo"
    text: ".*${PROMO_CODE}.*"
- waitForAnimationToEnd:
    timeout: 2000