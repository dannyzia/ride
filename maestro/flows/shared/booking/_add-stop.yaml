# _add-stop — multi-stop input: tap "+ Add stop" → autocomplete → select STOP_NAME.
# §9 Booking Subflows. Gate 1 REWIRE (semantic IDs via testid-map.json): add-stop
# button = customer.home.set-stops-2 (app/(main)/(customer)/(tabs)/home/index.tsx
# L867, "rider_home.add_stop_button"); stop entry reuses the same autocomplete
# surface (type=stop mode) → customer.autocomplete.set-query input + text-filtered
# customer.autocomplete.handle-place-select result row.
# STALE-FLOW AUDIT 2026-10-04: the open-wait's alternatives included "Enter or choose
# a location" (ORPHANED find_ride.enter_or_choose_location) and a "search_stop"
# fragment; both are unrenderable now that find-ride/ is deleted (G-02b). Repointed
# to the query input's own testID — the element this subflow taps next.
# Class: AUTOMATABLE.
appId: com.ride.bd
---
- tapOn:
    id: "customer.home.set-stops-2"
- extendedWaitUntil:
    visible:
      id: "customer.autocomplete.set-query"
    timeout: 15000
- tapOn:
    id: "customer.autocomplete.set-query"
- inputText: ${STOP_NAME}
- extendedWaitUntil:
    visible: ".*${STOP_NAME}.*"
    timeout: 20000
- tapOn:
    id: "customer.autocomplete.handle-place-select"
    text: ".*${STOP_NAME}.*"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
