# _select-destination — home search pill → autocomplete → type DEST_NAME → select result.
# §9 Booking Subflows. Gate 1 REWIRE (semantic IDs via maestro/tools/testid-map.json):
# home "Where to?" pill = customer.home.el-2 (app/(main)/(customer)/(tabs)/home/
# index.tsx L882 → router.push autocomplete); query input = customer.autocomplete.
# set-query (autocomplete/index.tsx L207, autoFocus TextInput shared by from/stop/to
# modes); result row = customer.autocomplete.handle-place-select (L239, FlatList row)
# filtered by ${DEST_NAME} text + index 0.
# STALE-FLOW AUDIT 2026-10-04: the open-wait's second alternative, "Enter or choose
# a location", is the value of ORPHANED find_ride.enter_or_choose_location and
# renders nowhere (find-ride/ deleted, G-02b). Repointed to the query input's own
# testID — the very element this subflow taps next, so it is provably present.
# OPEN THE BOOKING SURFACE FIRST (2026-11-11, device-measured): the rider lands on the
# SERVICES HUB, not on a booking form — `customer.home.el-2` (the "Where to?" row) lives
# in /(main)/(customer)/(tabs)/home, which only renders once a service tile has pushed it
# with a `service` param (services-hub.tsx:77). Tapping el-2 straight from the hub
# reported "Element not found". When el-2 is not already on screen, tap the hub's first
# service tile (services-hub.tsx:153 — one shared testID, so index 0 = Bike) and the
# booking surface opens; the conditional is a no-op for flows that arrive with it open.
appId: com.node.bd
---
- runFlow:
    when:
      notVisible:
        id: "customer.home.el-2"
    commands:
      - tapOn:
          id: "customer.services-hub.handle-select"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: "customer.home.el-2"
- extendedWaitUntil:
    visible:
      id: "customer.autocomplete.set-query"
    timeout: 15000
- tapOn:
    id: "customer.autocomplete.set-query"
- inputText: ${DEST_NAME}
- extendedWaitUntil:
    visible: ".*${DEST_NAME}.*"
    timeout: 20000
- tapOn:
    id: "customer.autocomplete.handle-place-select"
    text: ".*${DEST_NAME}.*"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
# ADVANCE TO THE FARE SHEET (2026-11-11, device-measured). Picking a place only
# writes dropoff coords and triggers fetchEstimates — it does NOT move the
# booking sheet off LOCATIONS. `bookingStep` reaches "FARES" in exactly three
# places in (tabs)/home/index.tsx: handleNext (L772), the rebook path (L347) and
# the FARES back button (L1168), and the sheet's snap index is
# `bookingStep === "LOCATIONS" ? 0 : 1` (L1538) — so every fare-tier assert in
# the suite (customer.home.set-selected-vehicle-type) was invisible after this
# subflow, with a 200 estimate already in hand. Tap the LOCATIONS step's own
# Next control (customer.home.handle-next, L1152, disabled until hasRoute).
# Conditional so flows that arrive already on FARES are untouched.
- runFlow:
    when:
      notVisible:
        id: "customer.home.set-selected-vehicle-type"
    commands:
      - scrollUntilVisible:
          element:
            id: "customer.home.handle-next"
          direction: DOWN
      - tapOn:
          id: "customer.home.handle-next"
      - waitForAnimationToEnd:
          timeout: 3000
