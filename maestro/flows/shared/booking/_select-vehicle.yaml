# _select-vehicle — tap the vehicle card for VEHICLE_TYPE on the fare screen.
# §9 Booking Subflows. Selector source: find_ride.vehicle_* labels ("Bike Basic" …
# "Car XL", en/common.json §find_ride — verified against screen source), rendered
# on app/(main)/(customer)/find-ride/index.tsx fare cards.
# Mission fare assertions (৳441/৳535/৳589) are asserted in journey flows, NOT here:
# pricing is DB-driven (manifest G-01) — flows probe /api/pricing first.
# Class: AUTOMATABLE.
appId: com.ride.bd
---
- extendedWaitUntil:
    visible: ".*Choose a ride.*|.*FARES.*"
    timeout: 20000
- tapOn:
    text: ".*${VEHICLE_TYPE}.*"
- waitForAnimationToEnd:
    timeout: 2000
