# _seed-completed-ride — POST /api/test/seed-ride?status=completed for the given pair.
# §9. MANIFEST: BLOCKED-GATE (Gate 2 endpoint absent; verified 2026-09-27).
# Class: COUNTERPART-API (once live).
# Block scalar (>-): the raw curl line contains `Content-Type: application/json`,
# whose colon-space made this sequence entry unparseable as a plain scalar.
appId: com.ride.bd
---
- runScript:
    when:
      true
    commands:
      - >-
        curl -s -X POST "${API_BASE}/api/test/seed-ride?status=completed"
        -H "Content-Type: application/json"
        -H "Authorization: Bearer ${API_TOKEN}"
        -d '{"riderId":"${RIDER_ID}","driverId":"${DRIVER_ID}"}'