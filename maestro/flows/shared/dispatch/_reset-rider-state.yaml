# _reset-rider-state — POST /api/test/reset-rider → idle state (module teardown).
# §9. MANIFEST: BLOCKED-GATE (Gate 2 absent). Class: COUNTERPART-API (once live).
# The call runs through the GraalJS helper (maestro/utils/js/counterpart-api.js):
# a Maestro step cannot shell out, so the counterpart construct is JS, not curl
# (2026-10-15), and the block-scalar workaround the curl form needed is gone with it.
appId: com.ride.bd
---
- runScript:
    file: ../../../utils/js/counterpart-api.js
    env:
      apiBase: "${API_BASE}"
      method: "POST"
      path: "/api/test/reset-rider"
      body: '{"riderId":"${RIDER_ID}"}'
      token: "${API_TOKEN}"
      label: "reset-rider-state"