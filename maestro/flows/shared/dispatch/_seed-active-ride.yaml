# _seed-active-ride — POST /api/test/seed-ride?status={STATE} for the given rider+driver.
# §9. MANIFEST: BLOCKED-GATE (Gate 2 endpoint absent; verified 2026-09-27).
# STATE ∈ {matched, arrived, in_progress}. Class: COUNTERPART-API (once live).
# Runs through the GraalJS helper (maestro/utils/js/counterpart-api.js) — a Maestro
# step cannot shell out, so the counterpart construct is JS, not curl (2026-10-15).
appId: com.ride.bd
---
- runScript:
    file: ../../../utils/js/counterpart-api.js
    env:
      apiBase: "${API_BASE}"
      method: "POST"
      path: "/api/test/seed-ride?status=${STATE}"
      body: '{"riderId":"${RIDER_ID}","driverId":"${DRIVER_ID}"}'
      token: "${API_TOKEN}"
      label: "seed-active-ride"