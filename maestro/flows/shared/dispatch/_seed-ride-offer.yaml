# _seed-ride-offer — POST /api/test/inject-offer → WS ride:offer fires to the driver.
# §9 Dispatch and State Seeding Subflows. MANIFEST: BLOCKED-GATE — the endpoint
# (Gate 3 / Gap 3) does NOT exist on disk (verified 2026-09-27: app/api/test/ absent).
# Authored-but-unrun per mission ruling; fix F-3 in COVERAGE-MANIFEST.md §8.
# Class: COUNTERPART-API (state seeding via real HTTP API once it exists).
appId: com.ride.bd
---
# Runs through the GraalJS helper (maestro/utils/js/counterpart-api.js) — a Maestro
# step cannot shell out, so the counterpart construct is JS, not curl (2026-10-15).
- runScript:
    file: ../../../utils/js/counterpart-api.js
    env:
      apiBase: "${API_BASE}"
      method: "POST"
      path: "/api/test/inject-offer"
      body: '{"driverId":"${DRIVER_ID}","riderId":"${RIDER_ID}"}'
      label: "seed-ride-offer"
