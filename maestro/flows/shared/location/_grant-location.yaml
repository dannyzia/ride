# _grant-location — grant location permission to the app (ADB, no UI dependency).
# §9 Location Subflows. PACKAGE_ID comes from env (default com.ride.bd).
# Class: AUTOMATABLE. Runs on host via Maestro's runScript? No — Maestro has no
# direct adb; use `launchApp` with permissions already granted by
# maestro/utils/adb-grant-permissions.sh (§15 Permission Boot Configuration).
# This subflow therefore asserts the permission CTA is absent and, if present,
# taps Allow (covers first-run devices).
appId: com.ride.bd
---
- runFlow:
    when:
      visible: ".*Allow.*|.*While using the app.*"
    commands:
      - tapOn: ".*While using the app.*|.*Allow.*"
- runFlow:
    when:
      visible: ".*Enable location.*|.*Allow location.*"
    commands:
      - tapOn: ".*Allow.*"
