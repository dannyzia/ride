# _counterpart-shop-quote — COUNTERPART ACTION: shop member answers an RFQ with a
# quote while the CUSTOMER side runs in the UI (V3 Shops).
# Counterpart call: POST ${API_BASE}/api/shop/orders/${ORDER_ID}/quote
#   Auth: real shop-member token (SHOP_PHONE/SHOP_PASSWORD from the seeded roster;
#   requireShopMember §E.2 enforces shops.status==='active').
# Contract: §C.1; RFQ state machine §B.6.
# Class: COUNTERPART-API.
appId: com.ride.bd
---
- runScript:
    file: ../../../utils/js/counterpart-login.js
    env:
      phone: "${SHOP_PHONE}"
      password: "${SHOP_PASSWORD}"
      supabaseUrl: "${SUPABASE_URL}"
      supabaseAnonKey: "${SUPABASE_ANON_KEY}"
      label: "shop-login"
- runScript:
    file: ../../../utils/js/counterpart-api.js
    env:
      apiBase: "${API_BASE}"
      method: "POST"
      path: "/api/shop/orders/${ORDER_ID}/quote"
      body: '{"amount_bdt":${QUOTE_AMOUNT_BDT}}'
      label: "shop-quote"
