# _counterpart-shop-ready — COUNTERPART ACTION: shop marks a food order ready.
# Counterpart call: POST ${API_BASE}/api/shop/orders/${ORDER_ID}/mark-ready
#   Auth: real shop-member token. S4/§6.1 REWORK: the delivery leg is created
#   in the ORDER PLACEMENT tx (lib/shopDeliveryBridge.ts → `deliveries`,
#   idempotent on order_id) — mark-ready is a PURE status transition, no
#   delivery_requests row is created here anymore.
# Contract: §6.1 step 1 (placement) + mark-ready transition. Class: COUNTERPART-API.
appId: com.ride.bd
---
- runScript:
    file: ../../../utils/js/counterpart-login.js
    env:
      phone: "${SHOP_PHONE}"
      password: "${SHOP_PASSWORD}"
      supabaseUrl: "${SUPABASE_URL}"
      supabaseAnonKey: "${SUPABASE_ANON_KEY}"
      label: "shop-login"
- runScript:
    file: ../../../utils/js/counterpart-api.js
    env:
      apiBase: "${API_BASE}"
      method: "POST"
      path: "/api/shop/orders/${ORDER_ID}/mark-ready"
      body: '{}'
      label: "shop-mark-ready"
