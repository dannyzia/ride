# _open-settings-hub — land on the rider settings HUB.
# Opens the Profile tab, then taps customer.profile.push-settings-hub (the
# "Settings" row added to the profile's Preferences section) and waits for the
# hub to render. The hub carries customer.settings.el-1 per row and is the only
# place several screens live (loyalty, ride pass, top-up, linked accounts, data
# controls) — before that row existed nothing in the rider tree routed here and
# QA had to deep-link, which is how rider/settings/07-loyalty-points.yaml used
# to reach loyalty.
# For the profile tab itself (tap a customer.profile.* row), use
# _open-profile-tab.yaml instead — that is what most callers want.
# Class: AUTOMATABLE.
appId: com.ride.bd
---
- tapOn:
    id: "customer._layout.on-press"
    text: ".*Profile.*|.*Account.*"
- extendedWaitUntil:
    visible:
      id: "customer.profile.el-1"
    timeout: 15000
- tapOn:
    id: "customer.profile.push-settings-hub"
- extendedWaitUntil:
    visible:
      id: "customer.settings.el-1"
    timeout: 20000