# _dismiss-dialogs — conditionally dismiss OS permission/update dialogs (safety net).
# §9 Utility Subflows. Non-failing by construction (all `when` + optional).
# Class: AUTOMATABLE.
appId: com.ride.bd
---
- runFlow:
    when:
      visible: ".*Allow.*|.*While using the app.*"
    commands:
      - tapOn: ".*While using the app.*|.*Allow.*"
- runFlow:
    when:
      visible: ".*Update.*|.*New version.*"
    commands:
      - tapOn:
          text: ".*Later.*|.*Not now.*|.*Dismiss.*"
          optional: true
- runFlow:
    when:
      visible: ".*notification.*|.*Notifications.*"
    commands:
      - tapOn:
          text: ".*Allow.*"
          optional: true
