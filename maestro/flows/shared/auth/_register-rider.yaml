# _register-rider — full new-rider registration: phone-entry → OTP → register (name+password).
# §9 Authentication Subflows. Selector source: app/(auth)/phone-entry.tsx, otp-verify.tsx,
# register.tsx; i18n auth.send_otp="Send OTP", auth.verify_otp="Verify OTP",
# auth.register="Create Account". Fixtures: fresh rider phone (Rider B roster),
# OTP bypass 123456. Class: AUTOMATABLE.
appId: com.ride.bd
---
- launchApp:
    appId: com.ride.bd
    clearState: true
- extendedWaitUntil:
    visible: ".*Enter your phone number.*"
    timeout: 20000
- tapOn:
    textField: "1XXXXXXXXX"
- inputText: ${PHONE}
- tapOn: "Send OTP"
- extendedWaitUntil:
    visible: "Enter 6-digit OTP"
    timeout: 20000
- tapOn:
    textField: "Enter 6-digit OTP"
- inputText: ${OTP_CODE}
- tapOn: "Verify OTP"
- extendedWaitUntil:
    visible: ".*Create Account.*|.*Name.*"
    timeout: 20000
- tapOn:
    textField: ".*Name.*"
    optional: true
- inputText: ${NAME}
- tapOn:
    textField: ".*Password.*"
    optional: true
- inputText: ${PASSWORD}
- tapOn: "Create Account"
- extendedWaitUntil:
    visible: ".*Search destination.*|.*Home.*"
    timeout: 30000
