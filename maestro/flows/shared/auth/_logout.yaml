# _logout — Profile tab → Sign Out → OS confirm alert → assert auth surface.
# §9 Authentication Subflows. Gate 1 REWIRE (semantic IDs via testid-map.json):
# tab = customer._layout.on-press (customer (tabs)/_layout.tsx L55, wrapper
# TouchableWithoutFeedback) filtered by the "Profile" tab label; sign-out button =
# customer.profile.confirm-sign-out (profile/index.tsx L321). The confirm is an OS
# Alert.alert (profile/index.tsx L120) — OS dialogs expose NO testIDs, so the
# destructive-confirm tap stays TEXT by design (logout-confirmation screen IDs are
# a different route, settings/logout-confirmation, NOT used here). Class: AUTOMATABLE.
appId: com.ride.bd
---
- tapOn:
    id: "customer._layout.on-press"
    text: ".*Profile.*|.*More.*"
- extendedWaitUntil:
    visible: ".*Sign Out.*|.*sign_out.*"
    timeout: 15000
- tapOn:
    id: "customer.profile.confirm-sign-out"
# OS Alert.alert destructive button — text only (no testID space)
- tapOn:
    text: ".*Sign Out.*|.*Log out.*"
# GROUND FIX: the final wait asserted ".*Log In.*|.*Get Started.*". That
# alternation passed on EITHER branch, so it never pinned the screen it landed
# on, and its "Log In" branch was rescued for a while only by the orphaned
# auth.login value. Sign-out returns to /(auth)/phone-entry (app/_layout.tsx:150
# redirects every unauthenticated session there), and phone-entry renders
# "Get Started" and "Log In" from auth.get_started / auth.login. The screen's
# own testID is the deterministic ground: it is present only on phone-entry, so
# this cannot pass on the wrong screen the way an either/or alternation can.
- extendedWaitUntil:
    visible:
      id: "phone-entry.set-phone"
    timeout: 20000
