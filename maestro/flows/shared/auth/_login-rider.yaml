# _login-rider — shared auth subflow: phone → password login → rider home.
# §9 Authentication Subflows of plans/maestro-architecture.md. Zero hardcoded creds:
# PHONE/PASSWORD come from the caller's env block (see maestro/config/test-accounts.yaml).
# Gate 1 REWIRE PASS 2 (semantic IDs, verified against source in
# maestro/tools/testid-map.json):
#   app/(auth)/phone-entry.tsx  phone-entry.set-phone / phone-entry.set-role
#                               (Rider chip) / phone-entry.handle-login
#   app/(auth)/login.tsx        login.set-phone / login.set-password / login.handle-login
# SCREEN-AFFINITY FIX: this subflow previously used the login.* ids from the moment
# the app opened. app/_layout.tsx:150 redirects every unauthenticated launch to
# /(auth)/phone-entry, so those taps targeted elements that did not exist yet and the
# leading `visible: "Log In"` guard could never match (phone-entry renders "Login",
# not "Log In"). Now it drives phone-entry explicitly, then the password screen.
# GROUND FIX (B-1): the post-login wait asserted ".*Search destination.*", a string that
# exists nowhere in the app — home.search_destination is "Where to?" (en/common.json:176).
# Now keyed on that row's testID. It is the right ground because every booking flow taps
# it as its very next step (_select-destination.yaml:11), so it is provably rendered at
# this point, whereas the old text matched nothing and burned the full 30s timeout.
# 29 flows depend on this subflow, so the defect was one of the most expensive in the suite.
# Class: AUTOMATABLE (real login through live Supabase auth + app API).
appId: com.ride.bd
---
- launchApp:
    appId: com.ride.bd
    clearState: true
- extendedWaitUntil:
    visible: "Enter your phone number to continue"
    timeout: 20000
- tapOn:
    id: "phone-entry.set-phone"
- eraseText
- inputText: ${PHONE}
- tapOn:
    id: "phone-entry.set-role"
- tapOn:
    id: "phone-entry.handle-login"
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 15000
- tapOn:
    id: "login.set-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "login.handle-login"
- extendedWaitUntil:
    visible:
      id: "customer.home.el-2"
    timeout: 30000