# _login-rider — shared auth subflow: phone → password login → rider home.
# §9 Authentication Subflows of plans/maestro-architecture.md. Zero hardcoded creds:
# PHONE/PASSWORD come from the caller's env block (see maestro/config/test-accounts.yaml).
# Gate 1 REWIRE (semantic IDs, generated by maestro/tools/add-testids.cjs and
# mapped in maestro/tools/testid-map.json — app/(auth)/login.tsx):
#   login.set-phone / login.set-password / login.handle-login / login.push-auth
# The role chip ("Rider") has no testID yet (G-02 remainder, manifest §7) — text
# selector retained for that one tap.
# Class: AUTOMATABLE (real login through live Supabase auth + app API).
appId: com.ride.bd
---
- launchApp:
    appId: com.ride.bd
    clearState: true
- extendedWaitUntil:
    visible: "Log In"
    timeout: 20000
- tapOn:
    id: "login.set-phone"
- eraseText
- inputText: ${PHONE}
- tapOn:
    text: "Rider"
    optional: true
- tapOn:
    id: "login.handle-login"
- extendedWaitUntil:
    visible: "Password"
    timeout: 10000
- tapOn:
    id: "login.set-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "login.handle-login"
- extendedWaitUntil:
    visible: ".*Search destination.*"
    timeout: 30000
