# _register-credentials — the ROLE-AGNOSTIC middle of a gated-role registration.
#
# Entered AFTER phone-entry's Register button (so otp-verify has the phone + the
# chosen role in its route params — phone-entry.tsx:104 pushes
# `/(auth)/otp-verify?phone=…&role=…`). It proves phone ownership (OTP) and
# collects name + password on register.tsx; register.tsx's handleRegister then
# routes to the ROLE's wizard (register.tsx:53-58 ROLE_WIZARD: shop_owner /
# fleet_owner / delivery_man). It deliberately does NOT know which role it is:
# the role already rides the route params, so one subflow serves all three
# wizards and there is no per-role id to parameterise — which matters because
# this repo has no precedent for env substitution inside an `id:` selector
# (only inside `text:`), and an unverifiable selector is worse than repetition.
#
# Callers: auth/10-register-shop-owner, auth/11-register-fleet-owner,
# auth/12-register-delivery-man. Each supplies OTP_CODE / NAME / PASSWORD and
# then asserts its OWN wizard landed.
#
# Fixtures: a FRESH phone (a used one is rejected at phone-entry with "An
# account with this phone already exists. Please login."), OTP bypass 123456
# (TEST-SETUP.md). Class: AUTOMATABLE.
appId: com.ride.bd
---
- extendedWaitUntil:
    visible: "Enter 6-digit OTP"
    timeout: 20000
- tapOn:
    id: "otp-verify.set-otp"
- inputText: ${OTP_CODE}
- tapOn:
    id: "otp-verify.handle-verify-otp"
- extendedWaitUntil:
    visible: "Complete Registration"
    timeout: 20000
- tapOn:
    id: "register.set-name"
- inputText: ${NAME}
- tapOn:
    id: "register.set-password"
- inputText: ${PASSWORD}
# register.tsx:44 hard-fails on a mismatch, so confirm must be typed — the
# omission that once made rider registration unable to complete (see
# _register-rider.yaml's header, defect 2).
- tapOn:
    id: "register.set-confirm-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "register.handle-register"
