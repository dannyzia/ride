# _enter-pin — type PIN digits → Start Ride.
# §9. Gate 1 REWIRE (semantic IDs, app/(main)/(rider)/enter-otp/ via
# maestro/tools/testid-map.json): rider.enter-otp.handle-verify is the Start Ride
# button; the PIN field itself has no testID yet (G-02 remainder) — text match on
# the "Ride Pin" input retained.
# PIN is passed from the caller (read from the rider device screen — dual-device
# coordination is manual per §11 architecture decision). Class: AUTOMATABLE.
appId: com.ride.bd
---
- extendedWaitUntil:
    visible: "Ride Pin"
    timeout: 30000
- tapOn:
    textField: ".*Ride Pin.*|.*digit.*"
- inputText: ${PIN}
- tapOn:
    id: "rider.enter-otp.handle-verify"
