# _seed-active-subscription — POST /api/test/seed-subscription for the given driver.
# §9. MANIFEST: BLOCKED-GATE (Gate 2 endpoint absent; verified 2026-09-27).
# Class: COUNTERPART-API (once live).
# Runs through the GraalJS helper (maestro/utils/js/counterpart-api.js) — a Maestro
# step cannot shell out, so the counterpart construct is JS, not curl (2026-10-15).
appId: com.ride.bd
---
- runScript:
    file: ../../../utils/js/counterpart-api.js
    env:
      apiBase: "${API_BASE}"
      method: "POST"
      path: "/api/test/seed-subscription"
      body: '{"driverId":"${DRIVER_ID}","packageId":"${PACKAGE_ID}"}'
      token: "${API_TOKEN}"
      label: "seed-active-subscription"