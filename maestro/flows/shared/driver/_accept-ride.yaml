# _accept-ride — tap Accept on the offer sheet → assert find-customer surface.
# §9. Selectors VERIFIED against device-proven maestro/flows/driver-core.yaml:
# "New Ride Offer" sheet → "Accept" → "Slide to Confirm Arrival" (find-customer).
# Class: AUTOMATABLE.
appId: com.ride.bd
---
- extendedWaitUntil:
    visible: "New Ride Offer"
    timeout: 60000
- tapOn: "Accept"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Slide to Confirm Arrival"
    timeout: 30000
