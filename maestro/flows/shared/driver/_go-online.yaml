# _go-online — toggle driver online → assert Go Offline / Connected badge.
# §9 Driver Operation Subflows. Gate 1 REWIRE PASS 2: the toggle is addressed by
# testID (verified in maestro/tools/testid-map.json) — rider.d.toggle-online is the
# offline-state onPress={toggleOnline} control (d/(tabs)/index.tsx:1001) and
# rider.d.toggle-online-2 is its online-state counterpart (:1163). The OS
# "While using the app" tap stays TEXT (G-02 remainder, OS dialog).
# Class: AUTOMATABLE.
appId: com.ride.bd
---
- extendedWaitUntil:
    visible: ".*Go Online.*|.*Go Offline.*"
    timeout: 20000
- runFlow:
    when:
      visible: "Go Online"
    commands:
      - tapOn:
          id: "rider.d.toggle-online"
      - runFlow:
          when:
            visible: "While using the app"
          commands:
            - tapOn: "While using the app"
      - waitForAnimationToEnd:
          timeout: 4000
- extendedWaitUntil:
    visible: "Go Offline"
    timeout: 15000
