# _go-offline — toggle driver offline → assert Offline/Go Online badge.
# §9. Gate 1 REWIRE PASS 2: the inverse control is rider.d.toggle-online-2
# (d/(tabs)/index.tsx:1163, accessibilityLabel driver_home.go_offline). The
# online-state counterpart is rider.d.toggle-online (see _go-online.yaml).
# Class: AUTOMATABLE.
appId: com.ride.bd
---
- extendedWaitUntil:
    visible: "Go Offline"
    timeout: 15000
- tapOn:
    id: "rider.d.toggle-online-2"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Go Online"
    timeout: 15000
