# _complete-ride-driver — slide drop-off → assert completed modal with fare.
# §9. Selectors VERIFIED in driver-core.yaml: "Slide to Confirm Drop-off" →
# "Ride Completed ✅" modal → "Total Fare" → "Browse Home". Gate 1 NOTE: "Browse
# Home" is a distinct button from "Back to Home" (rider.finish-ride.handle-go-home,
# i18n finish_ride.back_to_home) — the device-proven text contract stays; the
# completion modal surface itself has no testID (G-02 remainder). Class: AUTOMATABLE.
appId: com.ride.bd
---
- extendedWaitUntil:
    visible: "Slide to Confirm Drop-off"
    timeout: 120000
- swipe:
    start: "10%, 93%"
    end: "92%, 93%"
    duration: 2000
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Ride Completed ✅"
    timeout: 30000
- assertVisible: "Total Fare"
- tapOn: "Browse Home"
