# _complete-ride-driver — slide drop-off → assert completed modal with fare.
# §9. Selectors VERIFIED in driver-core.yaml: "Slide to Confirm Drop-off" →
# "Ride Completed ✅" modal → "Total Fare" → go home.
# B-5 (2026-10-03): the old `tapOn: "Browse Home"` was DEAD. That literal appears
# in no locale value and no app source — i18n finish_ride has only
# back_to_home = "Back to Home". An earlier note here claimed "Browse Home" was a
# distinct, device-proven button; it is not in the codebase at all, so no amount
# of device time would have surfaced it. Now a testID
# (rider.finish-ride.handle-go-home, finish-ride/index.tsx:609).
# The completion modal itself still has no testID (G-02 remainder) — the two
# visible asserts above remain text-based for that reason.
# Class: AUTOMATABLE.
appId: com.ride.bd
---
- extendedWaitUntil:
    visible: "Slide to Confirm Drop-off"
    timeout: 120000
- swipe:
    start: "10%, 93%"
    end: "92%, 93%"
    duration: 2000
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Ride Completed ✅"
    timeout: 30000
- assertVisible: "Total Fare"
- tapOn:
    id: "rider.finish-ride.handle-go-home"
