# _rate-rider — driver post-ride rating screen → tap STARS → submit.
# §9. Selector source: app/(main)/(rider)/rate-rider/ (i18n rate_rider section).
# Class: AUTOMATABLE.
appId: com.ride.bd
---
- extendedWaitUntil:
    visible: ".*Rate.*|.*star.*|.*rating.*"
    timeout: 30000
- tapOn:
    text: "★"
    index: 3
- tapOn: ".*Submit.*|.*Done.*|.*Skip.*"
- waitForAnimationToEnd:
    timeout: 3000
