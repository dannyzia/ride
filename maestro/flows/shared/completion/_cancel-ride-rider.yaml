# _cancel-ride-rider — finding-driver → cancel-reason screen → reason → confirm.
# §9 Completion and Trust Subflows. Gate 1 REWIRE PASS 2 — the ".*Cancel.*" entry
# tap is now customer.finding-driver.handle-cancel (finding-driver/index.tsx L471,
# onPress={handleCancel}; the source comment marks it "Cancel Booking — always
# visible", so it is a dependable ground). Downstream IDs were already rewired:
# customer.cancel-reason.set-note (L142) and customer.cancel-reason.confirm-cancel
# (L149). Reason rows are a mapped list with no per-row testID — the index tap
# stays (G-02 remainder). Class: AUTOMATABLE.
appId: com.ride.bd
---
- tapOn:
    id: "customer.finding-driver.handle-cancel"
- extendedWaitUntil:
    visible:
      id: "customer.cancel-reason.confirm-cancel"
    timeout: 15000
- tapOn:
    text: ".*"
    index: ${REASON_INDEX}
- tapOn:
    id: "customer.cancel-reason.confirm-cancel"
- extendedWaitUntil:
    visible: ".*cancelled.*|.*canceled.*|.*Home.*"
    timeout: 20000