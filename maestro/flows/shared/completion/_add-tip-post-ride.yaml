# _add-tip-post-ride — tip screen → select AMOUNT chip → submit.
# §9 Completion and Trust Subflows. Gate 1 REWIRE (semantic IDs via testid-map.json,
# app/(main)/(customer)/add-tip/index.tsx): amount chip = customer.add-tip.
# set-tip-amount (L108, preset chips incl. ৳ amounts — text filter picks AMOUNT,
# 0 renders as add_tip.no_tip); submit = customer.add-tip.handle-add-tip (L135,
# label t('ride.add_tip')). Class: AUTOMATABLE.
appId: com.ride.bd
---
- extendedWaitUntil:
    visible: ".*Tip.*|.*tip.*"
    timeout: 20000
- tapOn:
    id: "customer.add-tip.set-tip-amount"
    text: ".*${AMOUNT}.*"
- tapOn:
    id: "customer.add-tip.handle-add-tip"
- waitForAnimationToEnd:
    timeout: 3000
