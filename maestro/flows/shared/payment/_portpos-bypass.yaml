# _portpos-bypass — POST /api/test/payment-bypass { paymentRef, purpose } → poll activation.
# §9 Payment Subflows. MANIFEST: BLOCKED-GATE — TEST_PAYMENT_BYPASS shim (Gate 4 / Gap 4)
# does NOT exist (verified 2026-09-27: zero references repo-wide); the bypass endpoint
# (Gate 2 family) is also absent. Authored-but-unrun; fix F-4 in COVERAGE-MANIFEST.md §8.
# Class: BLOCKED (payments sandbox).
appId: com.ride.bd
---
# Runs through the GraalJS helper (maestro/utils/js/counterpart-api.js) — a Maestro
# step cannot shell out, so the counterpart construct is JS, not curl (2026-10-15).
- runScript:
    file: ../../../utils/js/counterpart-api.js
    env:
      apiBase: "${API_BASE}"
      method: "POST"
      path: "/api/test/payment-bypass"
      body: '{"paymentRef":"${PAYMENT_REF}","purpose":"${PURPOSE}"}'
      label: "portpos-bypass"
