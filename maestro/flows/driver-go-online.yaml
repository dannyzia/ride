# Device: emulator-5556 (Driver). Assumes driver already logged in
#   (run: maestro test --device emulator-5556 -e PHONE=1700000001 -e EXPECT="Calls Remaining" maestro/flows/auth-flow.yaml first).
# Does NOT clearState (keeps the session + any granted location permission).
# The native location "While using the app" dialog only appears the FIRST time; this flow
# taps it only if visible so reruns do not fail when permission is already granted.

appId: com.ride.bd
name: "Driver - Go Online"
tags:
  - driver
---
- launchApp:
    appId: com.ride.bd
# Gate 1 REWIRE PASS 2: the go-online control is rider.d.toggle-online
# (d/(tabs)/index.tsx:1001, accessibilityLabel driver_home.go_online_label, the
# onPress={toggleOnline} TouchableOpacity). The "While using the app" tap stays
# TEXT by design — it is the OS location-permission dialog, not app UI.
- assertVisible: "Go Online"
- tapOn:
    id: "rider.d.toggle-online"
- runFlow:
    when:
      visible: "While using the app"
    commands:
      # G-02 remainder: OS permission dialog exposes no testID.
      - tapOn: "While using the app"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: "Go Offline"
    timeout: 10000
- assertVisible: "Go Offline"
- assertVisible:
    text: "Connected"
    optional: true
