      - id: F5-04
        task: "Build driver incentive dashboard screen"
        files_to_create:
          - "app/(main)/(rider)/incentives.tsx"
        ui_requirements:
          - "Active incentives with circular progress rings (SVG animated arcs)."
          - "Progress text: X / Y [metric]."
          - "Reward label: +Z bonus calls."
          - "Completed section with ✅ badge."
          - "Summary card: total bonus calls earned."
        verification:
          - type: file_exists
            path: "app/(main)/(rider)/incentives.tsx"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [F5-03]
        priority: high

      - id: F5-05
        task: "Add incentive progress update to ride completion flow"
        files_to_modify:
          - "app/api/ride/[id]/complete.ts"
        changes:
          - "After ride completion, update driver_incentives.current_progress for active incentives with target_metric='completed_rides'."
          - "If progress >= target_value: set completed_at=now(), INSERT credit_vouchers row for reward_calls, set reward_voucher_id."
          - "Wrap in same Drizzle transaction as ride completion."
        verification:
          - type: contains
            file: "app/api/ride/[id]/complete.ts"
            patterns:
              - "driver_incentives"
              - "completed_rides"
              - "credit_vouchers"
              - "reward_voucher_id"
        depends_on: [F5-01]
        priority: high

      - id: F5-06
        task: "Add scheduler job for online_hours and acceptance_rate incentive metrics"
        files_to_modify:
          - "utils-server/scheduler.ts"
        changes:
          - "Add periodic job (every 5 min) to update driver_incentives progress for online_hours and acceptance_rate metrics."
          - "On completion: INSERT credit_vouchers row with source='incentive_reward', source_ref_id=driver_incentives.id, set reward_voucher_id."
          - |
            Online hours aggregation query:
              SELECT driver_id, SUM(EXTRACT(EPOCH FROM (COALESCE(went_offline_at, now()) - went_online_at))) / 3600 AS online_hours
              FROM driver_online_sessions
              WHERE went_online_at >= :incentive_starts_at
                AND went_online_at < COALESCE(went_offline_at, now())
              GROUP BY driver_id
          - |
            Acceptance rate query:
              SELECT driver_id,
                COUNT(*) FILTER (WHERE outcome = 'accepted')::numeric / NULLIF(COUNT(*) FILTER (WHERE outcome IN ('accepted','rejected','expired')), 0) AS acceptance_rate
              FROM dispatch_offers
              WHERE sent_at >= :incentive_starts_at
              GROUP BY driver_id
        verification:
          - type: contains
            file: "utils-server/scheduler.ts"
            patterns:
              - "online_hours"
              - "acceptance_rate"
              - "driver_incentives"
        depends_on: [F5-01]
        priority: medium

      - id: F5-07
        task: "Create admin incentive CRUD endpoints"
        files_to_create:
          - "app/api/admin/incentive.ts"
          - "app/api/admin/incentives.ts"
          - "app/api/admin/incentive/[id].ts"
        implementation_rules:
          - "POST /api/admin/incentive — create with Zod validation."
          - "PATCH /api/admin/incentive/:id — update including is_active toggle."
