              - "Slider"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P9-DMR-01, P9-DMR-02]
        priority: medium

      - id: P9-PC-01
        task: "Create platform_config table migration and seed rows"
        files_to_modify:
          - "src/db/schema.ts"
        table_name: "platform_config"
        columns:
          - "key varchar(100) NOT NULL PRIMARY KEY"
          - "value text NOT NULL"
          - "updated_at timestamptz NOT NULL DEFAULT now()"
        seed_rows:
          - key: "driver_min_ratio"
            value: "0.70"
            description: "Lower bound for driver min_per_km_bdt slider (70% of system rate)"
          - key: "driver_max_ratio"
            value: "1.50"
            description: "Upper bound for slider (150% of system rate)"
          - key: "brta_max_base_bdt"
            value: "8500"
            description: "BRTA ceiling for base fare in paisa (=\u09f385)"
          - key: "brta_max_per_km_bdt"
            value: "3400"
            description: "BRTA ceiling for per-km rate in paisa (=\u09f334/km)"
          - key: "brta_max_wait_per_2min_bdt"
            value: "850"
            description: "BRTA ceiling for wait charge per 2 min in paisa (=\u09f38.50/2min)"
        notes:
          - "This is a separate table from system_config. system_config = operational toggles. platform_config = pricing policy."
          - "Seed rows must be inserted in the migration file, not as application-level upserts."
          - "Add index on key column (already PK, no extra index needed)."
        verification:
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "platform_config"
              - "driver_min_ratio"
              - "driver_max_ratio"
              - "brta_max_base_bdt"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P2-01]
        priority: critical

      - id: P9-PC-02
        task: "Create GET+PATCH /api/admin/config — platform_config admin endpoint (single file)"
        files_to_create:
          - "app/api/admin/config+api.ts"
        implementation_rules:
          - "Single file with named exports: GET (returns all platform_config rows) and PATCH (updates keys)."
          - "Both require admin role via requireRole(req, 'admin')."
          - "GET: returns { config: [{ key, value, updated_at }] }."
          - "PATCH body: { updates: Array<{ key: string, value: string }> }."
          - "Allowed keys (ALLOWED_KEYS Set): 'driver_min_ratio', 'driver_max_ratio', 'brta_max_base_bdt', 'brta_max_per_km_bdt', 'brta_max_wait_per_2min_bdt'."
          - "Unknown key → 400. Non-numeric value → 400. Ratio outside 0.10–5.00 → 400."
          - "On success: UPDATE platform_config SET value, updated_at = now() for each key. Return updated config array."
          - "Changes take effect immediately for all future GET /api/driver/slider-config calls."
          - "See also: 20-DEVELOPER-CHANGE-LIST.md Phase 7 — app/api/admin/config+api.ts for complete implementation."
        verification:
          - type: file_exists
            path: "app/api/admin/config+api.ts"
          - type: contains
            file: "app/api/admin/config+api.ts"
            patterns:
              - "platform_config"
              - "ALLOWED_KEYS"
              - "requireRole.*admin\\|admin.*role"
              - "driver_min_ratio"
              - "driver_max_ratio"
              - "brta_max_per_km_bdt"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P9-PC-01, P9-01]
        priority: high

      - id: P9-PC-03
        task: "Update GET /api/driver/slider-config endpoint to read from platform_config"
        files_to_create:
          - "app/api/driver/slider-config+api.ts"
        implementation_rules:
          - "Method: GET. Auth: required (driver role)."
          - "Read driver's vehicle_type from drivers table."
          - "Query pricing WHERE vehicle_type = driver.vehicle_type AND is_active = true to get system_per_km_bdt."
          - "Read driver_min_ratio and driver_max_ratio from platform_config table."
          - "Compute lower_bound = floor(system_per_km_bdt * min_ratio), upper_bound = ceil(system_per_km_bdt * max_ratio)."
          - "Return 200: { vehicle_type, system_per_km_bdt, min_ratio, max_ratio, lower_bound, upper_bound }."
          - "This replaces the old static 70%/150% hardcoded bounds."
        verification:
          - type: file_exists
            path: "app/api/driver/slider-config+api.ts"
          - type: contains
            file: "app/api/driver/slider-config+api.ts"
            patterns:
              - "platform_config"
              - "driver_min_ratio"
              - "lower_bound"
              - "upper_bound"
              - "system_per_km_bdt"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P9-PC-01, P9-DMR-01]
        priority: high

      - id: P9-PC-04
        task: "Enforce minimum_fare_bdt hard floor in lib/fareCalc.ts and pricing migration"
        files_to_modify:
          - "lib/fareCalc.ts"
          - "src/db/schema.ts"
        implementation_rules:
          - "Add minimum_fare_bdt integer NOT NULL column to pricing table in schema.ts (already done in 20-DEVELOPER-CHANGE-LIST.md Phase 2 schema if following that file)."
          - "Seed initial values in migration (see 21-MIGRATION-SQL.md M-03 and M-04 for SQL and 05-DATA-MODEL.md pricing seed table for values)."
          - "calculateFare() formula: distanceCharge=round(per_km*km), waitCharge=max(0,wait-free)*per_min, total=base+dist+wait, final=max(total, minimum_fare_bdt)."
          - "The FareBreakdown interface: { base_fare_bdt, distance_charge_bdt, wait_charge_bdt, total_bdt (= final after floor), minimum_fare_bdt, distance_km }."
          - "total_bdt is the amount to charge the rider — it IS the post-floor value. There is no separate 'final_fare_bdt' field."
          - "Add unit tests: bike_basic 1km → total_bdt=6000 (floor); bike_basic 10km → total_bdt=11000 (above floor)."
          - "See 20-DEVELOPER-CHANGE-LIST.md Phase 6 — lib/fareCalc.ts for the complete implementation."
          - "See 22-TEST-TEMPLATES.md lib/__tests__/fareCalc.test.ts for test coverage."
        verification:
          - type: contains
            file: "lib/fareCalc.ts"
            patterns:
              - "minimum_fare_bdt"
              - "Math.max.*minimum_fare\\|minimum_fare.*Math.max"
              - "total_bdt"
              - "calculateFare"
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "minimum_fare_bdt"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-03, P2-11]
        priority: critical

      - id: P9-DMR-04
        task: "Add min_per_km_bdt dispatch filter to utils-server"
        files_to_modify:
          - "utils-server/dispatch.ts"
        implementation_rules:
          - "During dispatch, when selecting candidate drivers for a ride, filter out drivers whose min_per_km_bdt > ride's per_km_bdt rate."
          - "Read driver.min_per_km_bdt from connectedDrivers map (sent during auth:hello or location:update)."
          - "If driver has no min_per_km_bdt set (NULL), always include in dispatch candidates."
          - "Log filtered-out count at debug level for monitoring."
        verification:
          - type: contains
            file: "utils-server/dispatch.ts"
            patterns:
              - "min_per_km_bdt"
          - type: command
            run: "cd utils-server && npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-01]
        priority: high

      # --- Alternatives Flow Tasks ---

      - id: P9-ALT-01
        task: "Create GET /api/ride/:id/alternatives endpoint"
        files_to_create:
          - "app/api/ride/[id]/alternatives+api.ts"
        implementation_rules:
          - "Method: GET. Auth: required (rider role). Route param: id (ride_id)."
          - "Verify ride belongs to the authenticated rider (rides.user_id = requester). Return 404 if not."
          - "Verify ride.status IN ('pending', 'no_drivers'). Return 409 if not."
          - "Lookup ride's pickup lat/lng. Call getH3Ring(lat, lng, ring=1) for cells."
          - "For each vehicle_type in VEHICLE_TYPE_VALUES except ride.vehicle_type: call getDriversInCells(cells, vt)."
          - "For types with at least 1 available driver: fetch active pricing row and call calculateFare(pricing, ride.distance_km, 0)."
          - "Return all types with alternatives (not just cheaper ones — rider may want premium too)."
          - "Return 200: { ride_id, requested_vehicle_type, alternatives: Array<{ vehicle_type, fare_breakdown, available_drivers }> }."
        verification:
          - type: file_exists
            path: "app/api/ride/[id]/alternatives+api.ts"
          - type: contains
            file: "app/api/ride/[id]/alternatives+api.ts"
            patterns:
              - "alternatives"
              - "vehicle_type"
              - "fare_breakdown"
              - "calculateFare"
              - "getH3Ring\\|getDriversInCells"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-10, P6-01]
        priority: high

      - id: P9-ALT-02
        task: "Add no_drivers response schema and allow_downgrade flag to ride request"
        files_to_modify:
          - "app/api/ride/request+api.ts"
        implementation_rules:
          - "Add optional Zod field: allow_downgrade: boolean (default false)."
          - "If ride dispatch returns no_drivers after all batches AND allow_downgrade=true: trigger WebSocket ride:alternatives event to rider."
          - "Return 202 { ride_id, status: 'no_drivers', alternatives_available: boolean } instead of immediately expiring the ride."
          - "Ride stays in 'pending' status for an additional 30s to allow rider to pick an alternative."
        verification:
          - type: contains
            file: "app/api/ride/request+api.ts"
            patterns:
              - "allow_downgrade"
              - "no_drivers"
              - "alternatives_available"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P9-ALT-01, P6-10]
        priority: high

      - id: P9-ALT-03
        task: "Add WebSocket ride:alternatives event to utils-server"
        files_to_modify:
          - "utils-server/types.ts"
          - "utils-server/dispatch.ts"
        implementation_rules:
          - "Add to OutboundMessage union: { type: 'ride:alternatives', ride_id: string, alternatives: Array<{ vehicle_type, fare_breakdown }> }."
          - "Emit ride:alternatives to rider when all dispatch batches exhausted and allow_downgrade=true on the ride."
          - "Rider can respond with ride:accept-alternative { ride_id, vehicle_type } to re-request with the chosen type."
        verification:
          - type: contains
            file: "utils-server/types.ts"
            patterns:
              - "ride:alternatives"
          - type: contains
            file: "utils-server/dispatch.ts"
            patterns:
              - "ride:alternatives"
          - type: command
            run: "cd utils-server && npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-04, P9-ALT-01]
        priority: high

      - id: P9-ALT-04
        task: "Create AlternativesSheet UI component for rider"
        files_to_create:
          - "components/AlternativesSheet.tsx"
        ui_requirements:
          - "Bottom sheet rendered when ride:alternatives WebSocket event received."
          - "Title: 'No drivers found for your vehicle type. Try an alternative?'"
          - "List alternative vehicle types with fare estimates (total_bdt/100 ৳)."
          - "Each row: vehicle type name, fare, estimated wait, 'Select' button."
          - "On select: send ride:accept-alternative via WebSocket. Close sheet. Return to searching state."
          - "'Cancel Ride' button at bottom: calls POST /api/ride/cancel."
        verification:
          - type: file_exists
            path: "components/AlternativesSheet.tsx"
          - type: contains
            file: "components/AlternativesSheet.tsx"
            patterns:
              - "ride:alternatives"
              - "accept-alternative"
              - "vehicle_type"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P9-ALT-03]
        priority: high

      # --- Admin Vehicle Downgrade Tasks ---

      - id: P9-VDG-01
        task: "Admin vehicle type downgrade with reason"
        files_to_create:
          - "app/api/admin/driver/downgrade+api.ts"
        implementation_rules:
          - "Method: POST. Auth: required (admin role)."
          - "Zod body: { driver_id: uuid, new_vehicle_type: vehicleTypeEnum, reason: string(10-500) }."
          - "Validate new_vehicle_type is a valid downgrade (must be lower tier than current)."
          - "Downgrade order: car_xl > car_premium > car_comfort > car_economy > cng > bike_plus > bike_standard > bike_basic."
          - "INSERT into vehicle_type_changes table: { driver_id, old_vehicle_type: current, new_vehicle_type, change_reason: 'admin_downgrade', reason_text: body.reason, changed_by: admin_user_id, status: 'approved', effective_at: now() }."
          - "UPDATE drivers.vehicle_type and vehicles.vehicle_type to new_vehicle_type immediately (admin downgrades are immediate)."
          - "Notify driver via FCM push or WebSocket (admin:vehicle-downgrade event)."
        verification:
          - type: file_exists
            path: "app/api/admin/driver/downgrade+api.ts"
          - type: contains
            file: "app/api/admin/driver/downgrade+api.ts"
            patterns:
              - "downgrade"
              - "vehicle_type_changes"
              - "reason"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P9-01]
        priority: high

      - id: P9-VDG-02
        task: "Driver vehicle type change request with 7-day cooling-off"
        files_to_create:
          - "app/api/driver/vehicle-type-change+api.ts"
        implementation_rules:
          - "Method: POST. Auth: required (driver role)."
          - "Zod body: { requested_vehicle_type: vehicleTypeEnum }."
          - "Check eligibility via checkDriverEligibility() from lib/vehicleTypes.ts."
          - "INSERT into vehicle_type_changes: { driver_id, old_vehicle_type: current, new_vehicle_type: requested, change_reason: 'driver_request', reason_text: 'Driver-initiated request', changed_by: NULL, status: 'pending' }."
          - "Admin reviews in verification queue. On approval: scheduler sets status='cooling_off', effective_at=now()+7days. After 7 days: scheduler sets status='approved', updates drivers.vehicle_type and vehicles.vehicle_type."
          - "Return 201: { request_id, status: 'pending', message: 'Under admin review. Change takes effect 7 days after approval.' }."
        verification:
          - type: file_exists
            path: "app/api/driver/vehicle-type-change+api.ts"
          - type: contains
            file: "app/api/driver/vehicle-type-change+api.ts"
            patterns:
              - "cooling_off"
              - "vehicle_type_changes"
              - "'pending'\\|status.*pending"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P9-VDG-01]
        priority: medium

  # ============================================================
  # PHASE 10: In-App Chat (react-native-gifted-chat)
  # ============================================================
  - id: 10
    name: "In-App Chat (MVP)"
    blocking: false
    description: >
      Implement rider-driver in-app messaging using react-native-gifted-chat for UI.
      Transport uses the existing WebSocket connection. Messages persisted to chat_messages table.
      Chat available during matched/driver_arriving/in_progress ride states.
    items:
      - id: P10-01
        task: "Install react-native-gifted-chat dependency"
        command: "npm install react-native-gifted-chat"
        verification:
          - type: json_field_check
            file: package.json
            fields_exist:
              - "dependencies.react-native-gifted-chat"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
            description: "TypeScript compiles after adding gifted-chat."
        depends_on: [P1-03]
        priority: high

      - id: P10-02
        task: "Create app/api/ride/[id]/messages+api.ts — GET chat history"
        files_to_create:
          - "app/api/ride/[id]/messages+api.ts"
        implementation_rules:
          - "Auth: Supabase JWT. Only rider or matched driver of this ride."
          - "Query chat_messages WHERE ride_id = :id ORDER BY created_at ASC LIMIT 50."
          - "Support `before` query param for pagination (load earlier messages)."
          - "Return { messages: [...], has_more: boolean }."
          - "Return 403 if user is not a participant."
        verification:
          - type: file_exists
            path: "app/api/ride/[id]/messages+api.ts"
          - type: contains
            file: "app/api/ride/[id]/messages+api.ts"
            patterns:
              - "chat_messages"
              - "ride_id"
              - "created_at"
              - "has_more"
          - type: typescript_compiles
            file: "app/api/ride/[id]/messages+api.ts"
        depends_on: [P2-07g, P4-08]
        priority: high

      - id: P10-03
        task: "Create app/api/ride/[id]/message+api.ts — POST send message"
        files_to_create:
          - "app/api/ride/[id]/message+api.ts"
        implementation_rules:
          - "Auth: Supabase JWT. Only rider or matched driver of this ride."
          - "Validate: rides.status IN ('matched', 'driver_arriving', 'in_progress'). If not, 403 chat_closed."
          - "Validate: content length 1-1000 chars."
          - "INSERT chat_messages {ride_id, sender_id, content}."
          - "Emit chat:message WebSocket event to the OTHER participant via utils-server internal endpoint."
          - "Return 201 with created message."
        verification:
          - type: file_exists
            path: "app/api/ride/[id]/message+api.ts"
          - type: contains
            file: "app/api/ride/[id]/message+api.ts"
            patterns:
              - "chat_messages"
              - "chat_closed"
              - "content"
              - "sender_id"
          - type: anti_pattern_check
            file: "app/api/ride/[id]/message+api.ts"
            forbidden: "console.log"
        depends_on: [P10-02, P6-01]
        priority: high

      - id: P10-04
        task: "Add chat:message and chat:typing WebSocket handlers to utils-server"
        files_to_modify:
          - "utils-server/dispatch.ts"
        implementation_rules:
          - "Handle chat:message relay: when POST /api/ride/:id/message writes to DB, emit chat:message to the other participant's WebSocket connection."
          - "Handle chat:typing relay: forward typing indicator to the other participant."
          - "Look up ride participants (rider_id, driver_id) to determine recipient."
          - "No message persistence in utils-server — that happens in the Expo API route."
        verification:
          - type: contains
            file: "utils-server/dispatch.ts"
            patterns:
              - "chat:message"
              - "chat:typing"
        depends_on: [P6-01, P10-03]
        priority: high

      - id: P10-05
        task: "Create store/useChatStore.ts — Chat Zustand store"
        files_to_create:
          - "store/useChatStore.ts"
        required_exports:
          - "useChatStore"
        implementation_rules:
          - "State: messages array, loading, error, hasMore, rideId."
          - "Actions: loadMessages(rideId, before?), sendMessage(content), onNewMessage(message), clearChat()."
          - "onNewMessage: append to messages, called by WebSocket chat:message listener."
        verification:
          - type: file_exists
            path: "store/useChatStore.ts"
          - type: contains
            file: "store/useChatStore.ts"
            patterns:
              - "useChatStore"
              - "messages"
              - "loadMessages"
              - "sendMessage"
          - type: typescript_compiles
            file: "store/useChatStore.ts"
        depends_on: [P1-03, P10-02]
        priority: high

      - id: P10-06
        task: "Create components/ChatScreen.tsx — GiftedChat wrapper"
        files_to_create:
          - "components/ChatScreen.tsx"
        ui_requirements:
          - "Render GiftedChat component with messages from useChatStore."
          - "Header: back button, 'Chat with [Name]', phone icon (native dialer fallback via GET /api/ride/:id/contact)."
          - "On send: call useChatStore.sendMessage()."
          - "Load earlier: pagination via before cursor."
          - "Avatar: sender profile image or initial letter fallback."
          - "Input bar hidden when ride status not in matched/driver_arriving/in_progress. Show 'This ride has ended.' banner."
          - "States: loading (skeleton), empty ('Start the conversation'), error (retry)."
          - "Real-time: append messages on WebSocket chat:message event."
        verification:
          - type: file_exists
            path: "components/ChatScreen.tsx"
          - type: contains
            file: "components/ChatScreen.tsx"
            patterns:
              - "GiftedChat"
              - "useChatStore"
              - "loadMessages"
              - "sendMessage"
          - type: anti_pattern_check
            file: "components/ChatScreen.tsx"
            forbidden: "console.log"
          - type: typescript_compiles
            file: "components/ChatScreen.tsx"
        depends_on: [P10-01, P10-05]
        priority: high

      - id: P10-07
        task: "Add chat routes to rider and driver screens"
        files_create:
          - "app/(main)/(customer)/chat.tsx"
          - "app/(main)/(rider)/chat.tsx"
        implementation_rules:
          - "Each file is a thin wrapper that renders ChatScreen component."
          - "Pass rideId from route params."
          - "Navigation from matched-ride screen via 'Chat' button."
        verification:
          - type: file_exists
            paths:
              - "app/(main)/(customer)/chat.tsx"
              - "app/(main)/(rider)/chat.tsx"
          - type: contains
            file: "app/(main)/(customer)/chat.tsx"
            patterns:
              - "ChatScreen"
          - type: contains
            file: "app/(main)/(rider)/chat.tsx"
            patterns:
              - "ChatScreen"
        depends_on: [P10-06]
        priority: high

      - id: P10-08
        task: "Add admin chat export endpoint"
        files_to_create:
          - "app/api/admin/ride/[id]/chat+api.ts"
        implementation_rules:
          - "Auth: Supabase JWT + users.role = 'admin'."
          - "Return full chat history (no pagination limit) with participant details."
          - "Used for dispute resolution."
        verification:
          - type: file_exists
            path: "app/api/admin/ride/[id]/chat+api.ts"
          - type: contains
            file: "app/api/admin/ride/[id]/chat+api.ts"
            patterns:
              - "chat_messages"
              - "admin"
        depends_on: [P9-01, P10-02]
        priority: medium

      - id: P10-09
        task: "End-to-end chat test"
        manual_test_steps:
          - step: "Match a ride between rider and driver"
            expected: "Ride status = matched"
          - step: "Rider opens chat, sends 'Hello'"
            expected: "Message appears in rider chat. Driver receives chat:message via WebSocket."
          - step: "Driver opens chat, sees 'Hello', replies 'On my way'"
            expected: "Message appears in driver chat. Rider receives chat:message via WebSocket."
          - step: "Complete the ride"
            expected: "Chat becomes read-only. Input bar hidden. 'This ride has ended.' banner shown."
          - step: "Admin opens GET /api/admin/ride/:id/chat"
            expected: "Full message history with participant details returned."
        verification:
          - type: manual_check
            description: "All 5 chat test steps pass."
        depends_on: [P10-07, P10-08]
        priority: high

