  # FEATURE 5: Driver Incentive Dashboard
  # Recommended order: 3rd (depends on credit_vouchers which already exist)
  # ==========================================================================
  - id: F5
    name: "Driver Incentives"
    blocking: false
    description: >
      Drivers earn bonus call credits for meeting activity targets. Admin defines
      incentive campaigns. System awards bonus via credit_vouchers on completion.
      Includes incentive_definitions and driver_incentives tables, driver-facing
      dashboard with progress rings, and admin CRUD.
    items:
      - id: F5-01
        task: "Add incentive_definitions and driver_incentives tables to Drizzle schema"
        files_to_modify:
          - "src/db/schema.ts"
        verification:
          - type: contains
