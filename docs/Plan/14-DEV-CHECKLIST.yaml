      - id: P2-07e
        task: "Add dispatch_offers table"
        files_to_modify: ["src/db/schema.ts"]
        table_name: "dispatch_offers"
        columns:
          [
            "id: uuid PK",
            "ride_id: uuid FK",
            "driver_id: uuid FK",
            "batch_index: smallint",
            "sent_at: timestamptz",
            "fetch_confirmed_at: timestamptz NULL",
            "responded_at: timestamptz NULL",
            "outcome: offerOutcomeEnum NOT NULL DEFAULT 'delivered'",
            "created_at: timestamptz NOT NULL DEFAULT now()  -- required per data model hard rules"
          ]
        verification:
