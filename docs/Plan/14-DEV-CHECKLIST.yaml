      - id: P2-11
        task: "Add pricing table — per-vehicle-type fare rates per zone"
        files_to_modify:
          - "src/db/schema.ts"
        table_name: "pricing"
        columns:
          - "id: uuid PK DEFAULT gen_random_uuid()"
          - "zone_id: uuid NOT NULL FK → zones.id"
          - "vehicle_type: vehicleTypeEnum NOT NULL"
          - "base_fare_bdt: integer NOT NULL  -- in paisa"
          - "per_km_bdt: integer NOT NULL  -- in paisa per km"
          - "intercity_per_km_bdt: integer NOT NULL DEFAULT 0  -- in paisa per km outside origin city; 0 means no surcharge"
          - "per_min_bdt: integer NOT NULL  -- in paisa per minute of billable ride time (unified timer: post-60s-free-wait OR ride start, whichever first)"
          - "floor_length_km: numeric(10,2) NOT NULL  -- min km for floor fare; floor = base + round(per_km × floor_length_km) + (floor_min × per_min_bdt)"
          - "floor_min: integer NOT NULL  -- min minutes for floor fare (same formula)"
          - "is_active: boolean NOT NULL DEFAULT true"
          - "brta_fare_ceiling_bdt: integer NULL  -- BRTA govt fare ceiling in paisa; system warns (does NOT block) if fare exceeds"
          - "created_at: timestamptz NOT NULL DEFAULT now()"
          - "updated_at: timestamptz NOT NULL DEFAULT now()"
        verification:
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "pricing.*pgTable"
              - "zone_id"
              - "base_fare_bdt"
              - "per_km_bdt"
              - "intercity_per_km_bdt"
              - "per_min_bdt"
              - "floor_length_km"
