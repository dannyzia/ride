  clerk_sweep: "grep -rn '@clerk/' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
  stripe_sweep: "grep -rn 'stripe' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
  secret_sweep: "grep -rn 'SUPABASE_SERVICE_ROLE_KEY\\|bkash.*secret\\|nagad.*key\\|portpos.*key' . --include='*.ts' --exclude-dir=node_modules"
  console_sweep: "grep -rn 'console\\.log' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
  # New invariant sweeps (Phase 7+)
  float_fare_sweep: "grep -rn 'paisaToTaka\\|/ 100\\|\\/ 100' lib/fareCalc.ts | grep -v 'paisaToTaka'  # paisaToTaka must be the only /100 in fareCalc"
