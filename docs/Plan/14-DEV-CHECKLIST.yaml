        priority: high

      # --- Admin Vehicle Downgrade Tasks ---

      - id: P9-VDG-01
        task: "Admin vehicle type downgrade with reason"
        files_to_create:
          - "app/api/admin/driver/downgrade+api.ts"
        implementation_rules:
          - "Method: POST. Auth: required (admin role)."
          - "Zod body: { driver_id: uuid, new_vehicle_type: vehicleTypeEnum, reason: string(10-500) }."
          - "Validate new_vehicle_type is a valid downgrade (must be lower tier than current)."
          - "Downgrade order: car_xl > car_premium > car_comfort > car_economy > cng > bike_plus > bike_standard > bike_basic."
          - "INSERT into vehicle_type_changes table: { driver_id, old_vehicle_type: current, new_vehicle_type, change_reason: 'admin_downgrade', reason_text: body.reason, changed_by: admin_user_id, status: 'approved', effective_at: now() }."
          - "UPDATE drivers.vehicle_type and vehicles.vehicle_type to new_vehicle_type immediately (admin downgrades are immediate)."
          - "Notify driver via FCM push or WebSocket (admin:vehicle-downgrade event)."
