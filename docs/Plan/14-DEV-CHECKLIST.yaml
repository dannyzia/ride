        depends_on: [P2-01, P2-05]
        priority: critical

      - id: P2-07
        task: "Add call_ledger table — append-only, with unique constraint preventing double deduction"
        files_to_modify:
          - "src/db/schema.ts"
        table_name: "call_ledger"
        columns:
          - "id: uuid PK DEFAULT gen_random_uuid()"
          - "subscription_id: uuid NOT NULL FK → subscriptions.id"
          - "driver_id: uuid NOT NULL FK → drivers.id  -- denormalised for query speed"
          - "ride_id: uuid NULL FK → rides.id  -- NULL for non-ride events (initial_load, credit, expiry_writeoff)"
          - "event_type: callEventTypeEnum NOT NULL"
          - "delta: integer NOT NULL  -- negative=deduction, positive=refund/credit"
          - "balance_after: integer NOT NULL  -- snapshot of calls_remaining after event"
          - "reason: varchar(255) NOT NULL  -- app_fetch | no_interaction_refund | pro_rata_credit | initial_load"
          - "created_at: timestamptz NOT NULL DEFAULT now()  -- NO updated_at: append-only"
        unique_constraints:
          - columns: ["ride_id", "driver_id"]
            partial: "WHERE event_type = 'deduction'"
            description: "Prevents double deduction for same ride+driver. CRITICAL."
        verification:
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "call_ledger.*pgTable"
              - "callEventTypeEnum"
              - "balance_after"
              - "ride_id.*driver_id.*unique\\|uniqueIndex.*ride_id.*driver_id"
          - type: anti_pattern_check
            file: "src/db/schema.ts"
            forbidden: "call_ledger.*updated_at"
            description: "Ledger is append-only — no updated_at column"
        depends_on: [P2-01, P2-06]
        priority: critical

      - id: P2-07a
        task: "Add owner_consents table"
        files_to_modify: ["src/db/schema.ts"]
