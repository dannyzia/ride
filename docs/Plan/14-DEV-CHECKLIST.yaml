        files_to_create:
          - "app/(main)/(rider)/onboarding/documents.tsx"
        ui_requirements:
          - "Only accessible if status === 'pending' or 'temporary'."
          - "Step 1 (Vehicle Registration): Image pickers for Vehicle Registration document + vehicle photo. Also support Legacy Screenshot upload."
          - "Step 2 (Driver Registration): Image pickers for Driving License, National ID, and driver photo."
          - "Upload: upload to Supabase Storage: `documents/{driver_id}/{type}_{timestamp}.jpg`."
          - "Submit Steps 1-2: POST /api/driver/documents. Server-side worker handles legacy screenshot validation (OCR/resolution)."
