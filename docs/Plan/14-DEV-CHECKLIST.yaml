        implementation_rules:
          - "Add optional Zod field: allow_downgrade: boolean (default false)."
          - "If ride dispatch returns no_drivers after all batches AND allow_downgrade=true: trigger WebSocket ride:alternatives event to rider."
          - "Return 202 { ride_id, status: 'no_drivers', alternatives_available: boolean } instead of immediately expiring the ride."
          - "Ride stays in 'pending' status for an additional 30s to allow rider to pick an alternative."
        verification:
          - type: contains
