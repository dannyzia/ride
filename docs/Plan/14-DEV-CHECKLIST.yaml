      # --- Driver Minimum Rate Tasks ---

      - id: P9-DMR-01
        task: "Create PATCH /api/driver/me endpoint for driver profile updates including minimum rate"
        files_to_create:
          - "app/api/driver/me+api.ts"
        implementation_rules:
          - "Method: PATCH. Auth: required (driver role)."
          - "Zod body: { name?: string(2-100), min_per_km_bdt?: integer }."
          - "min_per_km_bdt is stored in integer paisa. 0 = clear the minimum (sets DB NULL)."
          - "Validation: Fetch active pricing row for driver's vehicle_type. Read driver_min_ratio and driver_max_ratio from platform_config. Compute lowerBound = floor(per_km_bdt * min_ratio), upperBound = ceil(per_km_bdt * max_ratio)."
          - "If min_per_km_bdt is not 0 AND (< lowerBound OR > upperBound): return 422 with { error, system_rate_bdt, lower_bound, upper_bound }."
          - "Use lib/validateMinPerKm.ts pure function for the bounds check logic (keeps handler thin and testable)."
          - "NULL resets to system rate (no minimum). 0 in the request body maps to NULL in the DB."
          - "Return 200: { min_per_km_bdt, system_rate_bdt, percent_of_system }. See 20-DEVELOPER-CHANGE-LIST.md Phase 7 for full implementation."
        verification:
          - type: file_exists
            path: "app/api/driver/me+api.ts"
          - type: contains
            file: "app/api/driver/me+api.ts"
            patterns:
              - "PATCH"
              - "min_per_km_bdt"
              - "platform_config"
              - "verifySupabaseToken"
              - "lower_bound\\|upper_bound\\|validateMinPerKm"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P4-01, P9-PC-01]
        priority: high

      - id: P9-DMR-02
        task: "Create GET /api/driver/pricing-reference endpoint"
        files_to_create:
          - "app/api/driver/pricing-reference+api.ts"
        implementation_rules:
          - "Method: GET. Auth: required (driver role)."
          - "Query pricing table for the driver's vehicle type and zone."
          - "Return 200: { per_km_bdt: integer, min_per_km_floor_bdt: integer, min_per_km_ceiling_bdt: integer }."
          - "min_per_km_floor_bdt = 70% of per_km_bdt (rounded). min_per_km_ceiling_bdt = 150% of per_km_bdt (rounded)."
          - "These are the same bounds enforced by PATCH /api/driver/me and the PRD (AC-15)."
        verification:
          - type: file_exists
            path: "app/api/driver/pricing-reference+api.ts"
          - type: contains
            file: "app/api/driver/pricing-reference+api.ts"
            patterns:
