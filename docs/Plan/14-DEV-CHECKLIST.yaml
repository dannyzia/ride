  # ==========================================================================
  # FEATURE 15: Admin Dashboard Consolidation
  # Builds the full web-only admin panel: missing API endpoints + all UI screens.
  # Consolidates existing admin bits (P9-*, F4-07/10, F5-07/08, F6-09/11,
  # F10-04, F12-06, F14-04) into a single coherent dashboard.
  # ==========================================================================
  - id: F15
    name: "Admin Dashboard Consolidation"
    blocking: false
    description: >
      Builds the complete web-only admin dashboard that an operator can use to
      manage every configurable entity on the platform without touching code or
      the database directly. Composed of two streams: (1) the missing admin API
      endpoints, and (2) the React Native Web admin screens under app/(admin)/.
      All routes require requireRole('admin'). All monetary values in integer
      paisa. Vehicle type enum is lowercase snake_case (8 values).
    items:
      # ---------------- API LAYER ----------------

      - id: F15-API-01
        task: "Create full admin driver approval queue endpoint"
        files_to_create:
          - "app/api/admin/queue+api.ts"
        implementation_rules:
          - "GET /api/admin/queue. Auth: requireRole('admin')."
          - "Return pending + temporary drivers joined to users, vehicles, and documents."
          - "Per driver: driver_id, user_id, name, phone, vehicle_type, status, submitted_at, provisional_expires_at, is_legacy_operator, vehicle_registration_date, vehicle_age_years, has_driver_photo, face_match_score, face_match_status, face_match_warning (true if score < system_config.face_match_min_score), brta_certificate_url, documents (array of {doc_type, status, storage_url, face_match_score, face_match_status})."
          - "Compute sla_hours = EXTRACT(EPOCH FROM (now() - submitted_at)) / 3600."
          - "sla_breach = true if (is_legacy_operator AND sla_hours > 12) OR (NOT is_legacy_operator AND sla_hours > 24)."
          - "Top-level: { drivers, total, overdue_count, fast_track_overdue_count }."
          - "Filter by query param status ('pending' | 'temporary' | 'rejected' | 'all'). Default 'pending'."
          - "Use logger, not console.log. Use Drizzle query builder with relations()."
        verification:
          - type: file_exists
            path: "app/api/admin/queue+api.ts"
          - type: contains
            file: "app/api/admin/queue+api.ts"
            patterns:
              - "requireRole"
              - "face_match"
              - "sla_breach"
              - "provisional_expires_at"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: critical

      - id: F15-API-02
        task: "Create admin driver lifecycle endpoints (approve, reject, suspend, activate, upgrade, close-account, type-change-approve)"
        files_to_create:
          - "app/api/admin/driver/approve+api.ts"
          - "app/api/admin/driver/reject+api.ts"
          - "app/api/admin/driver/suspend+api.ts"
          - "app/api/admin/driver/activate+api.ts"
          - "app/api/admin/driver/upgrade+api.ts"
          - "app/api/admin/driver/close-account+api.ts"
          - "app/api/admin/driver/type-change-approve+api.ts"
        implementation_rules:
          - "All POST. All requireRole('admin'). All Zod-validated."
          - "approve: body {driver_id, new_status?: 'active'|'temporary', vehicle_type_adjusted?, reason?}. If new_status omitted: active if all docs approved else temporary. If temporary, set provisional_expires_at = now()+30d. If vehicle_type_adjusted set, update drivers.vehicle_type + vehicles.vehicle_type + record in vehicle_type_changes. Mark all pending documents status='approved', reviewed_by=admin.id."
          - "reject: body {driver_id, reason: string(10-500)}. Set status='rejected'. Update pending docs status='rejected', rejection_reason."
          - "suspend: body {driver_id, reason: string(10-500)}. Set status='suspended'."
          - "activate: body {driver_id}. Promote temporary -> active. Clear provisional_expires_at and stage2_due_at."
          - "upgrade: body {driver_id, new_vehicle_type, reason: string(10-500)}. Validate new tier > current tier (tier map from lib/vehicleTypes.ts). Record in vehicle_type_changes, update drivers.vehicle_type and vehicles.vehicle_type immediately. Return {old_vehicle_type, new_vehicle_type}."
          - "close-account: body {driver_id, reason}. Set status='rejected'. UPDATE documents SET purge_at = now()+30d WHERE driver_id AND purge_at IS NULL. Log the closure reason."
          - "type-change-approve: body {change_id, action: 'approve'|'reject', reason?}. Fetch vehicle_type_changes row. If approve: apply the type change to drivers + vehicles, set status='approved', effective_at=now(). If reject: set status='rejected'."
          - "All multi-table writes inside db.transaction. Use logger."
        verification:
          - type: file_exists
            path: "app/api/admin/driver/approve+api.ts"
          - type: file_exists
