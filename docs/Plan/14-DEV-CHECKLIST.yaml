            expect_exit: 0
        depends_on: [P9-DMR-01, P9-DMR-02]
        priority: medium

      - id: P9-PC-01
        task: "Create platform_config table migration and seed rows"
        files_to_modify:
          - "src/db/schema.ts"
        table_name: "platform_config"
        columns:
          - "key varchar(100) NOT NULL PRIMARY KEY"
          - "value text NOT NULL"
          - "updated_at timestamptz NOT NULL DEFAULT now()"
        seed_rows:
          - key: "driver_min_ratio"
            value: "0.70"
            description: "Lower bound for driver min_per_km_bdt slider (70% of system rate)"
          - key: "driver_max_ratio"
            value: "1.50"
            description: "Upper bound for slider (150% of system rate)"
          - key: "brta_max_base_bdt"
            value: "8500"
            description: "BRTA ceiling for base fare in paisa (=\u09f385)"
          - key: "brta_max_per_km_bdt"
            value: "3400"
            description: "BRTA ceiling for per-km rate in paisa (=\u09f334/km)"
          - key: "brta_max_wait_per_2min_bdt"
            value: "850"
            description: "BRTA ceiling for wait charge per 2 min in paisa (=\u09f38.50/2min)"
        notes:
          - "This is a separate table from system_config. system_config = operational toggles. platform_config = pricing policy."
          - "Seed rows must be inserted in the migration file, not as application-level upserts."
          - "Add index on key column (already PK, no extra index needed)."
        verification:
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "platform_config"
              - "driver_min_ratio"
              - "driver_max_ratio"
              - "brta_max_base_bdt"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P2-01]
        priority: critical

      - id: P9-PC-02
        task: "Create GET+PATCH /api/admin/config — platform_config admin endpoint (single file)"
        files_to_create:
          - "app/api/admin/config+api.ts"
        implementation_rules:
          - "Single file with named exports: GET (returns all platform_config rows) and PATCH (updates keys)."
          - "Both require admin role via requireRole(req, 'admin')."
          - "GET: returns { config: [{ key, value, updated_at }] }."
          - "PATCH body: { updates: Array<{ key: string, value: string }> }."
          - "Allowed keys (ALLOWED_KEYS Set): 'driver_min_ratio', 'driver_max_ratio', 'brta_max_base_bdt', 'brta_max_per_km_bdt', 'brta_max_wait_per_2min_bdt'."
          - "Unknown key → 400. Non-numeric value → 400. Ratio outside 0.10–5.00 → 400."
          - "On success: UPDATE platform_config SET value, updated_at = now() for each key. Return updated config array."
          - "Changes take effect immediately for all future GET /api/driver/slider-config calls."
          - "See also: 20-DEVELOPER-CHANGE-LIST.md Phase 7 — app/api/admin/config+api.ts for complete implementation."
        verification:
          - type: file_exists
            path: "app/api/admin/config+api.ts"
          - type: contains
            file: "app/api/admin/config+api.ts"
            patterns:
              - "platform_config"
              - "ALLOWED_KEYS"
              - "requireRole.*admin\\|admin.*role"
              - "driver_min_ratio"
              - "driver_max_ratio"
              - "brta_max_per_km_bdt"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P9-PC-01, P9-01]
        priority: high

      - id: P9-PC-03
        task: "Update GET /api/driver/slider-config endpoint to read from platform_config"
        files_to_create:
          - "app/api/driver/slider-config+api.ts"
        implementation_rules:
          - "Method: GET. Auth: required (driver role)."
          - "Read driver's vehicle_type from drivers table."
          - "Query pricing WHERE vehicle_type = driver.vehicle_type AND is_active = true to get system_per_km_bdt."
          - "Read driver_min_ratio and driver_max_ratio from platform_config table."
          - "Compute lower_bound = floor(system_per_km_bdt * min_ratio), upper_bound = ceil(system_per_km_bdt * max_ratio)."
          - "Return 200: { vehicle_type, system_per_km_bdt, min_ratio, max_ratio, lower_bound, upper_bound }."
          - "This replaces the old static 70%/150% hardcoded bounds."
        verification:
          - type: file_exists
            path: "app/api/driver/slider-config+api.ts"
          - type: contains
            file: "app/api/driver/slider-config+api.ts"
            patterns:
              - "platform_config"
              - "driver_min_ratio"
              - "lower_bound"
              - "upper_bound"
              - "system_per_km_bdt"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P9-PC-01, P9-DMR-01]
        priority: high

      - id: P9-PC-04
        task: "Implement floor fare in lib/fareCalc.ts: replace minimum_fare_bdt with computed floor (floor_length_km × per_km_bdt + floor_min × per_min_bdt) and update pricing schema"
        files_to_modify:
          - "lib/fareCalc.ts"
          - "src/db/schema.ts"
        implementation_rules:
          - "Add floor_length_km (numeric) and floor_min (integer) columns to pricing table; remove minimum_fare_bdt and per_min_wait_bdt. See 21-MIGRATION-SQL.md M-03 for migration SQL."
          - "Seed initial values per 05-DATA-MODEL.md pricing seed table and 21-MIGRATION-SQL.md M-04."
          - "calculateFare() formula: distanceCharge=round(per_km*km), timeCharge=rideTimeMin*per_min_bdt, computedTotal=base+dist+time, floorFare=base+round(per_km*floor_length_km)+(floor_min*per_min_bdt), total=max(computedTotal, floorFare)."
          - "The FareBreakdown interface: { base_fare_bdt, distance_charge_bdt, time_charge_bdt, total_bdt (= post-floor), floor_fare_bdt, distance_km, platform_commission_percent, platform_commission_bdt, driver_net_bdt }."
          - "total_bdt is the amount to charge the rider — it IS the post-floor value."
          - "Add unit tests: bike_basic 1km 0min → total_bdt=5800 (floor=5800); bike_basic 4km 30min → total_bdt=10850 (above floor)."
          - "See 20-DEVELOPER-CHANGE-LIST.md Phase 6 — lib/fareCalc.ts for the complete implementation."
          - "See 22-TEST-TEMPLATES.md lib/__tests__/fareCalc.test.ts for test coverage."
        verification:
          - type: contains
            file: "lib/fareCalc.ts"
            patterns:
              - "floor_fare_bdt"
              - "floor_length_km"
              - "Math.max.*floorFare\\|floorFare.*Math.max"
              - "total_bdt"
              - "calculateFare"
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "floor_fare_bdt"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-03, P2-11]
        priority: critical

      - id: P9-DMR-04
        task: "Add min_per_km_bdt dispatch filter to utils-server"
        files_to_modify:
          - "utils-server/dispatch.ts"
        implementation_rules:
          - "During dispatch, when selecting candidate drivers for a ride, filter out drivers whose min_per_km_bdt > ride's per_km_bdt rate."
          - "Read driver.min_per_km_bdt from connectedDrivers map (sent during auth:hello or location:update)."
          - "If driver has no min_per_km_bdt set (NULL), always include in dispatch candidates."
          - "Log filtered-out count at debug level for monitoring."
        verification:
          - type: contains
            file: "utils-server/dispatch.ts"
            patterns:
              - "min_per_km_bdt"
          - type: command
            run: "cd utils-server && npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-01]
        priority: high

      # --- Alternatives Flow Tasks ---

      - id: P9-ALT-01
        task: "Create GET /api/ride/:id/alternatives endpoint"
        files_to_create:
          - "app/api/ride/[id]/alternatives+api.ts"
        implementation_rules:
          - "Method: GET. Auth: required (rider role). Route param: id (ride_id)."
          - "Verify ride belongs to the authenticated rider (rides.user_id = requester). Return 404 if not."
          - "Verify ride.status IN ('pending', 'no_drivers'). Return 409 if not."
          - "Lookup ride's pickup lat/lng. Call getH3Ring(lat, lng, ring=1) for cells."
          - "For each vehicle_type in VEHICLE_TYPE_VALUES except ride.vehicle_type: call getDriversInCells(cells, vt)."
          - "For types with at least 1 available driver: fetch active pricing row and call calculateFare(pricing, ride.distance_km, 0)."
          - "Return all types with alternatives (not just cheaper ones — rider may want premium too)."
          - "Return 200: { ride_id, requested_vehicle_type, alternatives: Array<{ vehicle_type, fare_breakdown, available_drivers }> }."
        verification:
          - type: file_exists
            path: "app/api/ride/[id]/alternatives+api.ts"
          - type: contains
