      - id: P2-07k
        task: "Add vehicle_type_changes table — audit trail for all vehicle type changes with cooling-off"
        files_to_modify: ["src/db/schema.ts"]
        table_name: "vehicle_type_changes"
        columns:
          [
            "id: uuid PK DEFAULT gen_random_uuid()",
            "driver_id: uuid NOT NULL FK → drivers.id",
            "old_vehicle_type: varchar(25) NOT NULL  -- vehicleTypeEnum",
            "new_vehicle_type: varchar(25) NOT NULL  -- vehicleTypeEnum",
            "change_reason: varchar(20) NOT NULL  -- 'admin_downgrade' | 'admin_upgrade' | 'driver_request'",
            "reason_text: varchar(500) NOT NULL  -- mandatory explanation shown to driver",
            "changed_by: uuid NULL FK → users.id  -- admin who made the change; NULL for driver-initiated",
            "status: varchar(20) NOT NULL DEFAULT 'pending'  -- 'pending' | 'approved' | 'rejected' | 'cooling_off'",
            "effective_at: timestamptz NULL  -- driver requests: approved_at + 7 days; admin: approved_at immediately",
            "created_at: timestamptz NOT NULL DEFAULT now()",
            "updated_at: timestamptz NOT NULL DEFAULT now()",
          ]
        notes: >
          Admin downgrades are immediate (status='approved', effective_at=now()).
          Driver-initiated changes get status='cooling_off', effective_at=now()+7days.
          After 7 days, scheduler sets status='approved' and updates drivers.vehicle_type.
        verification:
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "vehicle_type_changes.*pgTable"
              - "old_vehicle_type"
              - "new_vehicle_type"
              - "change_reason"
              - "cooling_off"
              - "effective_at"
        depends_on: [P2-01, P2-03]
        priority: high

