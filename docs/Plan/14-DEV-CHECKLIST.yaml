        implementation_rules:
          - "Bump version/build numbers."
          - "Run validation_commands.secret_sweep to ensure no secrets in codebase."
          - "Run validation_commands.clerk_sweep and stripe_sweep (should be clean)."
          - "Verify EXPO_PUBLIC variables are correctly set in EAS Secrets."
        verification:
