  # ============================================================
  # PHASE 5: Payment System
  # ============================================================
  - id: 5
    name: "Payment System — bKash & Nagad Integration"
    blocking: true
    description: >
      Build the full package purchase and payment confirmation pipeline.
      Components: lib/portpos.ts (PortPos API client — creates invoices, verifies IPN), package list/purchase/active API routes,
      app/api/payment/portpos/callback+api.ts (IPN + redirect handler), lib/activateSubscription.ts (shared idempotent activation),
      utils-server/compensationWorker.ts (DB-table-backed retry via compensation_queue), and the PaymentWebView component.
      Key invariants: all writes to subscriptions and call_ledger use Drizzle transactions.
      All payment initiations use idempotency keys. Payment credentials are server-side only.
    items:
      - id: P5-01
        task: "Create lib/bkash.ts — bKash Merchant API client"
        files_to_create:
          - "lib/bkash.ts"
        required_exports:
          - "bkashClient.getToken(): Promise<string>"
          - "bkashClient.createPayment(params: { amount: number, idempotencyKey: string, callbackUrl: string }): Promise<{ paymentID: string, bkashURL: string }>"
          - "bkashClient.queryPayment(paymentID: string): Promise<{ transactionStatus: string, trxID: string }>"
          - "bkashClient.executePayment(paymentID: string): Promise<{ transactionStatus: string, trxID: string }>"
        implementation_rules:
          - "Read BKASH_APP_KEY, BKASH_APP_SECRET, BKASH_USERNAME, BKASH_PASSWORD, BKASH_BASE_URL from process.env."
          - "Token caching: cache access token in module scope. Refresh 60s before expiry."
          - "All amounts: integer paisa passed in. Convert to taka (divide by 100) before sending to bKash."
          - "createPayment: POST to {BKASH_BASE_URL}/tokenized/checkout/create. Include idempotencyKey as merchantInvoiceNumber."
          - "queryPayment: GET to {BKASH_BASE_URL}/tokenized/checkout/payment/status."
          - "On token expiry (mid-request 401): refresh token once and retry. Do not retry indefinitely."
          - "Log every bKash API call with logger.info — include paymentID and response status. Never log secrets."
        verification:
          - type: file_exists
            path: "lib/bkash.ts"
          - type: contains
            file: "lib/bkash.ts"
            patterns:
              - "getToken"
              - "createPayment"
              - "queryPayment"
              - "executePayment"
              - "merchantInvoiceNumber\\|idempotencyKey"
              - "BKASH_APP_KEY"
          - type: anti_pattern_check
            file: "lib/bkash.ts"
            forbidden: "EXPO_PUBLIC_\\|console.log"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: critical

      - id: P5-02
        task: "Create lib/nagad.ts — Nagad Merchant API client"
        files_to_create:
          - "lib/nagad.ts"
        required_exports:
          - "nagadClient.initPayment(params: { amount: number, orderId: string, callbackUrl: string }): Promise<{ url: string }>"
          - "nagadClient.verifyPayment(orderId: string): Promise<{ status: string, transactionId: string }>"
        implementation_rules:
          - "Read NAGAD_MERCHANT_ID, NAGAD_MERCHANT_PRIVATE_KEY, NAGAD_MERCHANT_PUBLIC_KEY, NAGAD_BASE_URL from process.env."
          - "Nagad requires RSA encryption of payment data using merchant's private key."
          - "initPayment: POST to {NAGAD_BASE_URL}/api/dfs/check-out/initialize/{NAGAD_MERCHANT_ID}/{orderId}."
          - "All amounts: integer paisa passed in. Convert to taka before sending to Nagad."
          - "Log every API call with logger.info — never log RSA key or decrypted data."
          - "See TD-06 in 18-KNOWN-ISSUES.md: Nagad sandbox credentials may not be available at MVP. Show 'Coming soon' in UI until credentials confirmed."
        verification:
          - type: file_exists
            path: "lib/nagad.ts"
          - type: contains
            file: "lib/nagad.ts"
            patterns:
              - "initPayment"
              - "verifyPayment"
              - "NAGAD_MERCHANT_ID"
              - "NAGAD_MERCHANT_PRIVATE_KEY"
          - type: anti_pattern_check
            file: "lib/nagad.ts"
            forbidden: "EXPO_PUBLIC_\\|console.log"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: high
        notes: "If Nagad sandbox credentials are unavailable, implement the client but stub initPayment to throw 'NagadUnavailableError'. The UI will show Coming Soon."

      - id: P5-03
        task: "Create lib/activateSubscription.ts — shared, idempotent subscription activation (do this BEFORE callback handlers)"
        files_to_create:
          - "lib/activateSubscription.ts"
        required_exports:
          - "activateSubscription(db: DrizzleDb, paymentEventId: string): Promise<{ subscriptionId: string }>"
        implementation_rules:
          - "Contains the Drizzle transaction that all three callers use: bKash callback, Nagad callback, compensation worker."
          - "Idempotent: if payment_events.subscription_id is already set, return existing subscription_id without re-running."
          - "Steps (all in db.transaction()): (1) Verify payment_events.amount_bdt = packages.price_bdt. (2) INSERT subscriptions { daily_reset_at = nextBdtMidnightUtc(), total_deductions=0, is_trial from package }. (3) INSERT call_ledger event_type='initial_load', delta=call_count, balance_after=call_count. (4) UPDATE payment_events status='paid', confirmed_at=now(), subscription_id=new_id. (5) COMMIT."
          - "If subscription has credit vouchers (status='active'): apply them inside the same transaction → UPDATE calls_remaining += voucher.calls, UPDATE credit_vouchers status='redeemed'."
          - "call_ledger write here is NOT a deduction — it is the initial_load write. Only deduction writes are forbidden outside heartbeat.ts."
        verification:
          - type: file_exists
            path: "lib/activateSubscription.ts"
          - type: contains
            file: "lib/activateSubscription.ts"
            patterns:
              - "activateSubscription"
              - "db.transaction"
              - "initial_load"
              - "idempotent\\|subscription_id.*null\\|already.*activated"
              - "total_deductions"
              - "is_trial"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P2-06, P2-07, P2-07d]
        priority: critical
        notes: >
          This replaces P5-10 (which originally appeared later). Moving it here ensures callback handlers
          (P5-07, P5-08) and the compensation worker (P5-09) all call this shared function.
          DO NOT create lib/compensationQueue.ts as an in-memory array — compensation retries
          are handled via the compensation_queue DB table (P2-07i) queried by compensationWorker.ts.

      - id: P5-04
        task: "Create app/api/package/list+api.ts — list active purchasable packages"
        files_to_create:
          - "app/api/package/list+api.ts"
        implementation_rules:
          - "Method: GET."
          - "Auth: required (any authenticated user)."
          - "Query: SELECT * FROM packages WHERE is_active = true AND deleted_at IS NULL ORDER BY is_trial DESC, price_bdt ASC."
          - "Return 200: { packages: Array<{ id, name, call_count, duration_days, price_bdt, is_trial, daily_cap }> }. For finite packages, daily_cap is null. For unlimited packages, daily_cap is the package's daily_cap value (default 200)."
          - "Trial packages sorted first in the result."
          - "price_bdt is in paisa — do NOT convert here. Let the client display layer convert."
        verification:
          - type: file_exists
            path: "app/api/package/list+api.ts"
          - type: contains
            file: "app/api/package/list+api.ts"
            patterns:
              - "verifySupabaseToken"
              - "is_active.*true\\|is_active = true"
              - "is_trial"
              - "daily_cap"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P5-01]
        priority: critical

      - id: P5-05
        task: "Create app/api/package/purchase+api.ts — initiate package purchase"
        files_to_create:
          - "app/api/package/purchase+api.ts"
        implementation_rules:
          - "Method: POST."
          - "Auth: required (driver role only)."
          - "Zod body: { package_id: uuid, provider: 'portpos' }. Do NOT accept idempotency_key in body."
          - "Header: Idempotency-Key must be present (uuid v4). Reject if missing."
          - "Check driver status: must be 'active' or 'temporary'. Return 403 if not."
          - "Check for existing active subscription: if driver already has status='active' subscription, return 409."
          - "Trial package check: join through subscriptions -> packages. If packages.is_trial=true AND driver has existing trial subscription -> return 409 { error: 'trial_already_used' }."
          - "INSERT payment_events with { driver_id, package_id, idempotency_key, provider, amount_bdt, status='initiated' }."
          - "  ON CONFLICT (idempotency_key): return existing payment_events row (idempotent)."
          - "Call portposClient.createInvoice() to create payment. Pass amount, reference (idempotencyKey), redirectUrl, ipnUrl."
          - "Update payment_events.status = 'initiated' → stays 'initiated' until callback."
          - "Return 200: { payment_url, payment_event_id }."
        response_codes:
          200: "Payment URL returned — client opens in WebView"
          400: "Invalid body"
          403: "Driver status not active/temporary"
          409: "Active subscription exists OR trial already used"
          422: "Package not found or inactive"
          502: "bKash/Nagad API error"
        verification:
          - type: file_exists
            path: "app/api/package/purchase+api.ts"
          - type: contains
            file: "app/api/package/purchase+api.ts"
            patterns:
              - "verifySupabaseToken"
              - "idempotency_key"
              - "ON CONFLICT\\|onConflict\\|upsert"
              - "provider.*portpos"
              - "payment_url"
              - "trial_already_used"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P5-01, P5-02, P5-03, P5-04]
        priority: critical

      - id: P5-06
        task: "Create app/api/package/active+api.ts — get driver's active subscription (polled post-payment)"
        files_to_create:
          - "app/api/package/active+api.ts"
        implementation_rules:
          - "Method: GET."
          - "Auth: required (driver)."
          - "Query: SELECT subscriptions.*, packages.name, packages.call_count FROM subscriptions JOIN packages ON ... WHERE driver_id = {uid} AND status = 'active' AND expires_at > now() ORDER BY purchased_at DESC LIMIT 1."
          - "Return 200: { subscription: { id, package_id, package_name, calls_remaining, daily_calls_used, daily_reset_at, status, purchased_at, expires_at, is_trial } } or { subscription: null } if none. Matches 06-API.md GET /api/package/active response schema."
          - "This endpoint is polled by the client every 3s after the payment WebView closes."
        verification:
          - type: file_exists
            path: "app/api/package/active+api.ts"
          - type: contains
            file: "app/api/package/active+api.ts"
            patterns:
              - "verifySupabaseToken"
              - "status.*active\\|active.*status"
              - "expires_at"
              - "calls_remaining"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P5-04]
        priority: critical

      - id: P5-07
        task: "Create app/api/payment/bkash/callback+api.ts — bKash payment callback handler"
        files_to_create:
          - "app/api/payment/bkash/callback+api.ts"
        implementation_rules:
          - "Method: POST. [public] — called by bKash servers, not the app."
          - "Parse body: { paymentID, status, merchantInvoiceNumber (= idempotency_key) }."
          - "Verify callback signature: compute HMAC-SHA256 of 'amount|currency|merchantInvoiceNumber|paymentID' using BKASH_APP_SECRET. Compare to x-api-signature header. Mismatch → discard, log security warning, return 200."
          - "Verify with bKash API: call bkashClient.queryPayment(paymentID) to confirm transactionStatus. Do not trust body alone."
          - "If transactionStatus != 'Completed': update payment_events.status='failed'. Return 200 (must always 200 to bKash)."
          - "If 'Completed':"
          - "  1. Lookup payment_events by idempotency_key. If not found: log warn, return 200."
          - "  2. Call activateSubscription(db, payment_event_id) from lib/activateSubscription.ts. This handles: idempotency (subscription_id already set → no-op), INSERT subscriptions, INSERT call_ledger initial_load, UPDATE payment_events — all in one Drizzle transaction. Do NOT duplicate these steps inline."
          - "  3. If activateSubscription throws: INSERT a row into compensation_queue DB table { payment_event_id, status='pending', next_retry_at=now(), attempt_count=0 }. Log error. Return 200."
          - "Always return 200 to bKash — a non-200 causes bKash to retry indefinitely."
        verification:
          - type: file_exists
            path: "app/api/payment/bkash/callback+api.ts"
          - type: contains
            file: "app/api/payment/bkash/callback+api.ts"
            patterns:
              - "queryPayment"
              - "activateSubscription"
              - "compensation_queue"
              - "BKASH_APP_SECRET.*x-api-signature\\|hmac.*bkash\\|signature.*verify"
          - type: anti_pattern_check
            file: "app/api/payment/bkash/callback+api.ts"
            forbidden: "INSERT.*subscriptions|INSERT.*call_ledger"
            description: "Callback must NOT inline activation — must delegate to activateSubscription()"
          - type: anti_pattern_check
            file: "app/api/payment/bkash/callback+api.ts"
            forbidden: "return.*4[0-9][0-9]\\|return.*500"
            description: "Must always return 200 to bKash — never return error status codes to the provider"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P5-01, P5-03, P5-05]
        priority: critical
        notes: "This is the most critical endpoint in the payment pipeline. Every path must return 200 to bKash. All DB writes delegate to activateSubscription() from lib/activateSubscription.ts. Failures are persisted to the compensation_queue DB table for automatic retry by compensationWorker.ts."

      - id: P5-08
        task: "Create app/api/payment/nagad/callback+api.ts — Nagad payment callback handler"
        files_to_create:
          - "app/api/payment/nagad/callback+api.ts"
        implementation_rules:
          - "⚠ NOT identical to bKash despite similar activation logic. Key differences:"
          - "  (1) HTTP method: GET (not POST) — Nagad sends callback as GET request with query params."
          - "  (2) Data source: query params (not request body) — parse orderId, status from URL query string."
          - "  (3) Signature verification: RSA JWT (not HMAC-SHA256) — use NAGAD_MERCHANT_PUBLIC_KEY to verify the Nagad JWT from query params."
          - "  (4) Provider client: nagadClient.verifyPayment(orderId) (not bkashClient.queryPayment)."
          - "Activation logic after verification is the same: call activateSubscription(db, payment_event_id)."
          - "Parse: orderId (= idempotency_key), status from query params."
          - "Verify with nagadClient.verifyPayment(orderId) — do not trust query params alone."
          - "Same activation transaction as P5-07."
          - "Always return 200."
          - "Skip implementation if Nagad credentials unavailable (TD-06) — stub with logger.warn and 200."
        verification:
          - type: file_exists
            path: "app/api/payment/nagad/callback+api.ts"
          - type: contains
            file: "app/api/payment/nagad/callback+api.ts"
            patterns:
              - "verifyPayment"
              - "db.transaction\\|transaction"
              - "initial_load"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P5-02, P5-03, P5-07]
        priority: high

      - id: P5-09
        task: "Create utils-server/compensationWorker.ts — periodic retry for failed activations"
        files_to_create:
          - "utils-server/compensationWorker.ts"
        implementation_rules:
          - "Export startCompensationWorker(): void — called once at utils-server startup."
          - "Run setInterval every 30 seconds."
          - "Each tick: query compensation_queue DB table WHERE status='pending' AND next_retry_at <= now() LIMIT 10. Process each row."
          - "For each compensation_queue row:"
          - "  1. Fetch payment_events row by payment_event_id. If subscription_id already set: UPDATE compensation_queue SET status='completed'. Skip."
          - "  2. Call activateSubscription(db, payment_event_id)."
          - "  3. If activation succeeds: UPDATE compensation_queue SET status='completed'. Log logger.info compensation success."
          - "  4. If activation fails: INCREMENT attempt_count. If attempt_count >= max_attempts: SET status='failed', trigger admin alert (logger.error MAX_RETRIES_EXCEEDED). Else: SET next_retry_at = now() + exponential_backoff(attempt_count)."
          - "⚠ Orphan Recovery is also handled by scheduler.ts item (11) (callback_pending recovery every 10 min — see 12-FOLDER-STRUCTURE.md). To avoid double-processing: compensationWorker should SKIP callback_pending rows that already have a pending compensation_queue row. Only the scheduler's callback_pending recovery should directly call activateSubscription for payment_events without a compensation_queue entry. The compensationWorker handles rows that already have a compensation_queue entry."
        verification:
          - type: file_exists
            path: "utils-server/compensationWorker.ts"
          - type: contains
            file: "utils-server/compensationWorker.ts"
            patterns:
              - "startCompensationWorker"
              - "setInterval"
              - "compensation_queue"  # must reference DB table, not in-memory array
              - "attempt_count\\|max_attempts"
              - "MAX_RETRIES\\|max.*retries\\|MAX RETRIES"
              - "activateSubscription\\|db.transaction"
          - type: command
            run: "cd utils-server && npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P5-03, P5-07]
        priority: critical

      - id: P5-11
        task: "Create components/PaymentWebView.tsx — bKash/Nagad payment WebView"
        files_to_create:
          - "components/PaymentWebView.tsx"
        ui_requirements:
          - "Wraps react-native-webview. Receives payment_url prop."
          - "Props: { paymentUrl: string, onSuccess: () => void, onCancel: () => void, onError: (msg: string) => void }."
          - "Show full-screen WebView. Back button at top-left closes and calls onCancel."
          - "Monitor URL changes (onNavigationStateChange). If URL matches BKASH_CALLBACK_URL or NAGAD_CALLBACK_URL pattern: close WebView and call onSuccess."
          - "EXPO_PUBLIC_SERVER_URL is used to construct the expected callback URL pattern."
          - "On WebView error: call onError with message."
          - "Do NOT embed payment credentials. This component only renders a URL returned by the server."
        verification:
          - type: file_exists
            path: "components/PaymentWebView.tsx"
          - type: contains
            file: "components/PaymentWebView.tsx"
            patterns:
              - "WebView"
              - "onNavigationStateChange"
              - "paymentUrl"
              - "onSuccess.*onCancel.*onError\\|onSuccess|onCancel|onError"
          - type: anti_pattern_check
            file: "components/PaymentWebView.tsx"
            forbidden: "BKASH_APP_KEY\\|BKASH_APP_SECRET\\|NAGAD_MERCHANT"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: critical

      - id: P5-11b
        task: "Create store/useChatStore.ts — Zustand store for in-ride chat messages"
        files_to_create:
          - "store/useChatStore.ts"
        required_exports:
          - "useChatStore: ZustandStore  -- with: messages[], addMessage(), setTyping(), clearChat()"
        implementation_rules:
          - "Listens for WebSocket chat:message events (forwarded from utils-server after POST /api/ride/:id/message)."
          - "Listens for chat:typing events."
          - "clearChat(): clears messages on ride completion or cancellation."
          - "Used by components/ChatScreen.tsx."
        verification:
          - type: file_exists
            path: "store/useChatStore.ts"
          - type: contains
            file: "store/useChatStore.ts"
            patterns:
              - "useChatStore"
              - "messages"
              - "addMessage"
        depends_on: []
        priority: medium

      - id: P5-11c
        task: "Create components/AlternativesSheet.tsx — rider bottom sheet for alternative vehicle types"
        files_to_create:
          - "components/AlternativesSheet.tsx"
        required_props:
          - "alternatives: { vehicle_type: string, fare_breakdown: FareBreakdown, available_drivers: number }[]"
          - "onSelect: (vehicleType: string) => void"
          - "onDismiss: () => void"
        implementation_rules:
          - "Shown when ride request receives ride:alternatives WebSocket event or 202 response."
          - "Displays available vehicle types with fare breakdowns and driver counts."
          - "Selecting a type calls onSelect(vehicleType), which triggers a new ride request with the alternative type."
          - "Dismiss button calls onDismiss() — rider accepts no ride."
        verification:
          - type: file_exists
            path: "components/AlternativesSheet.tsx"
          - type: contains
            file: "components/AlternativesSheet.tsx"
            patterns:
              - "AlternativesSheet"
              - "onSelect"
              - "vehicle_type"
        depends_on: []
        priority: high

      - id: P5-11d
        task: "Create components/MinRateSlider.tsx — driver minimum per-km rate slider"
        files_to_create:
          - "components/MinRateSlider.tsx"
        required_props:
          - "currentRate: number  -- current min_per_km_bdt in paisa"
          - "systemRate: number   -- per_km_bdt from active pricing row in paisa"
          - "onChange: (newRate: number | null) => void  -- null = reset to system rate"
        implementation_rules:
          - "Slider range: 70%–150% of systemRate. Displayed as ৳ per km."
          - "Shows 'Match system rate (৳X/km)' option that sets rate to null."
          - "Displays missed-ride preview: calls GET /api/driver/missed-requests to show filtered_count_7d."
          - "On change: calls PATCH /api/driver/me with { min_per_km_bdt: value | null }."
        verification:
          - type: file_exists
            path: "components/MinRateSlider.tsx"
          - type: contains
            file: "components/MinRateSlider.tsx"
            patterns:
              - "MinRateSlider"
              - "systemRate"
              - "min_per_km_bdt"
        depends_on: []
        priority: medium

      - id: P5-12
        task: "Create app/(main)/(rider)/packages.tsx — driver package selection screen"
        files_to_create:
          - "app/(main)/(rider)/packages.tsx"
        ui_requirements:
          - "Load packages from GET /api/package/list. Show skeleton cards while loading."
          - "For each package: show name, call_count, duration_days, price (÷100 for display in ৳). TRIAL badge if is_trial."
          - "Payment method: PortPos single gateway. No in-app provider selector — user picks bKash/Nagad/Rocket/card on PortPos hosted checkout page."
          - "Proceed button: generates idempotencyKey = uuid(). Calls POST /api/package/purchase with header 'Idempotency-Key: <idempotencyKey>' and body { package_id, provider }. IMPORTANT: idempotency_key must be a HEADER, not a body field — the API returns 400 if it is in the body."
          - "On success: open PaymentWebView. On WebView onSuccess: start polling GET /api/package/active every 3s."
          - "Polling: show 'Confirming payment...' overlay. On subscription found: navigate to driver home with success toast."
          - "After 2 minutes of polling with no result: show 'Taking longer than expected. Check back later.' + Dismiss button."
          - "On payment error: toast 'Payment not confirmed. If charged, contact support.'"
        verification:
          - type: file_exists
            path: "app/(main)/(rider)/packages.tsx"
          - type: contains
            file: "app/(main)/(rider)/packages.tsx"
            patterns:
              - "PaymentWebView"
              - "Idempotency-Key.*header\\|headers.*Idempotency-Key\\|idempotencyKey.*header"
              - "uuid\\|uuidv4\\|crypto.randomUUID"
              - "/api/package/active"
              - "calls_remaining\\|call_count"
              - "is_trial"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P5-05, P5-06, P5-11]
        priority: critical

      - id: P5-13
        task: "Sandbox smoke test — full bKash payment flow"
        manual_test_steps:
          - step: "Driver logs in, navigates to Buy Calls"
            expected: "Package list loads with correct call_count and prices in ৳"
          - step: "Select Micro-trial package, select bKash, tap Proceed"
            expected: "POST /api/package/purchase returns 200 with payment_url. WebView opens bKash sandbox page."
          - step: "Complete bKash sandbox payment"
            expected: "bKash sandbox sends callback to BKASH_CALLBACK_URL (via ngrok in dev). WebView navigates to callback URL."
          - step: "WebView closes. Polling starts."
            expected: "GET /api/package/active returns subscription within 30s. 'Package activated' screen shown."
          - step: "Replay same request (same idempotency_key)"
            expected: "Returns same payment_events row. No new subscription created. Idempotent."
          - step: "Check call_ledger"
            expected: "One 'initial_load' row exists for driver. balance_after = package.call_count."
        verification:
          - type: manual_check
            description: "All 6 steps pass. payment_events.status = 'paid'. subscriptions.status = 'active'. call_ledger has initial_load row."
