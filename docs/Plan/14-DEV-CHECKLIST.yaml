            "consent_document_id: uuid NULL FK → documents.id  -- owner_consent_scan doc; dated within 30 days",
            "is_legacy_operator: boolean NOT NULL DEFAULT false  -- owner has prior Uber/Pathao affiliation",
            "legacy_document_id: uuid NULL FK → documents.id  -- legacy_screenshot doc",
            "status: varchar(20) NOT NULL DEFAULT 'pending'  -- ownerConsentStatusEnum: pending | approved | rejected | expired",
            "reviewed_by: uuid NULL FK → users.id",
