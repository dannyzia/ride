              - "vehicle_type"
              - "fare_breakdown"
              - "calculateFare"
              - "getH3Ring\\|getDriversInCells"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-10, P6-01]
        priority: high

      - id: P9-ALT-02
        task: "Add no_drivers response schema and allow_downgrade flag to ride request"
        files_to_modify:
