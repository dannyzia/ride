        task: "Add driver minimum rate slider UI to driver settings"
        files_to_create:
          - "components/MinRateSlider.tsx"
        implementation_rules:
          - "Load range from GET /api/driver/slider-config on mount (not pricing-reference — slider-config returns platform_config ratios and computed bounds)."
          - "Show current value in \u09f3 (paisa / 100) and as % of system rate."
          - "Debounced PATCH /api/driver/me on slider release."
          - "Show warning if slider value is set above system rate: 'At this rate, rides with a lower system rate will not be offered to you.'"
          - "Show loading spinner while saving. Toast on success/error."
        verification:
          - type: file_exists
