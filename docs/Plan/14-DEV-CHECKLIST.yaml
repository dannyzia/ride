failure_conditions:
  - condition: "Clerk imports found in source"
    check: "grep -rn '@clerk/' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
    action: "BLOCK_ALL_PHASES"

  - condition: "Stripe imports found in source"
    check: "grep -rn '@stripe/\\|from.*['\"]stripe['\"]' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
    action: "BLOCK_ALL_PHASES"

  - condition: "Payment credentials in EXPO_PUBLIC_ variables"
    check: "grep -rn 'EXPO_PUBLIC_BKASH\\|EXPO_PUBLIC_NAGAD' . --include='*.env*' --include='*.ts'"
    action: "BLOCK_DEPLOY"

  - condition: "Secrets committed to git"
    check: "git log --all -p | grep -E 'SUPABASE_SERVICE_ROLE_KEY|bkash.*secret|nagad.*key|portpos.*secret' | grep -v '.example'"
    action: "BLOCK_DEPLOY"

  - condition: "console.log in committed source code"
    check: "grep -rn 'console\\.log' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
    action: "WARN"

  - condition: "TypeScript compilation fails"
    check: "npx tsc --noEmit; echo $?"
    expect_exit: 0
    action: "BLOCK_ALL_PHASES"

