  # ============================================================
  # PHASE 6: Dispatch Engine
  # ============================================================
  - id: 6
    name: "Dispatch Engine — WebSocket, H3, Heartbeat-Gated Call Deduction"
    blocking: true
    description: >
      Build the utils-server WebSocket dispatch server. This is the most complex and highest-risk
      component — the heartbeat-gated call deduction logic must be correct or drivers will be over/under charged.
      Components: utils-server/index.ts (WebSocket entry), utils-server/h3Index.ts (driver geo index),
      utils-server/dispatch.ts (scoring, batch broadcast), utils-server/heartbeat.ts (deduction window),
      utils-server/scheduler.ts (cron jobs), lib/h3.ts (shared H3 utilities), lib/fareCalc.ts,
      lib/zone.ts, and the app/api/ride/request+api.ts endpoint.
      Invariant: call_ledger writes ONLY happen in heartbeat.ts — no exceptions.
    items:
      - id: P6-01
        task: "Create lib/h3.ts — H3 geo utilities (single import point for h3-js)"
        files_to_create:
          - "lib/h3.ts"
        required_exports:
          - "getH3Cell(lat: number, lng: number, resolution?: number): string"
          - "getH3Ring(cell: string, ringSize: number): string[]"
          - "findNearbyDrivers(lat: number, lng: number, vehicleType?: string, maxRings?: number): string[]  -- returns list of H3 cells in the pickup area (used by dispatch.ts to pass to h3Index.getDriversInCells). vehicleType optional — if provided, used as label context only (filtering by type is done inside h3Index.getDriversInCells). Note: 02-ARCHITECTURE.md lists vehicleType as a parameter; the actual type-based filtering is in h3Index.ts, not lib/h3.ts."
          - "H3_RESOLUTION: number  -- default 9"
        implementation_rules:
          - "Import h3-js ONLY in this file. No other file imports h3-js directly."
          - "getH3Cell: calls latLngToCell(lat, lng, resolution ?? H3_RESOLUTION)."
          - "getH3Ring: calls gridDisk(cell, ringSize) — returns all cells within ringSize rings."
          - "findNearbyDrivers: start ring 0. If cells found in DB: return. Else expand to ring 1, ring 2. Max ring: H3_RESOLUTION env var default 2."
          - "H3_RESOLUTION: read from process.env.H3_RESOLUTION, default 9."
          - "Export H3_RESOLUTION constant for use in utils-server/h3Index.ts."
        verification:
          - type: file_exists
            path: "lib/h3.ts"
          - type: contains
            file: "lib/h3.ts"
            patterns:
              - "latLngToCell\\|cellToLatLng"
              - "gridDisk"
              - "getH3Cell"
              - "getH3Ring"
              - "findNearbyDrivers"
              - "H3_RESOLUTION"
          - type: anti_pattern_check
            scope: "entire_codebase"
            forbidden_pattern: "from 'h3-js'"
            exclude_files: ["lib/h3.ts", "utils-server/h3Index.ts"]
            description: "h3-js imported ONLY in lib/h3.ts and utils-server/h3Index.ts"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: critical

      - id: P6-02
        task: "Create lib/zone.ts — point-in-polygon zone validation"
        files_to_create:
          - "lib/zone.ts"
        required_exports:
          - "isInsideZone(lat: number, lng: number): Promise<boolean>"
          - "getActiveZone(): Promise<Zone | null>"
        implementation_rules:
          - "getActiveZone: query zones WHERE is_active = true LIMIT 1. Cache result for 60s."
          - "isInsideZone: uses ray-casting algorithm against zone.polygon array of {lat, lng} points."
          - "If no active zone: return true (fail-open — do not block rides when zone not configured)."
          - "Log a warning if no active zone is found (zone misconfiguration)."
        verification:
          - type: file_exists
            path: "lib/zone.ts"
          - type: contains
            file: "lib/zone.ts"
            patterns:
              - "isInsideZone"
              - "getActiveZone"
              - "ray.*cast\\|polygon\\|point.*in.*poly"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: high

      - id: P6-03
        task: "Create lib/fareCalc.ts — server-side fare breakdown calculator"
        files_to_create:
          - "lib/fareCalc.ts"
        required_exports:
          - "calculateFare(params: { vehicleType: VehicleType, distanceKm: number, estimatedWaitMin?: number, zoneId: string }): Promise<FareBreakdown>"
          - "interface FareBreakdown { base_fare_bdt: number, distance_charge_bdt: number, wait_charge_bdt: number, total_bdt: number, final_fare_bdt: number, minimum_fare_bdt: number, distance_km: number }  -- final_fare_bdt = max(total_bdt, minimum_fare_bdt); field names MUST match 05-DATA-MODEL.md rides.fare_breakdown and 06-API.md response schema exactly"
        implementation_rules:
          - "All values returned in paisa (integer). No floats."
          - "Query pricing WHERE zone_id = zoneId AND vehicle_type = vehicleType AND is_active = true."
          - "Formula: total = base_fare_bdt + (per_km_bdt * distanceKm) + max(0, estimatedWaitMin - free_wait_minutes) * per_min_wait_bdt."
          - "Apply minimum fare: final_fare = max(total, minimum_fare_bdt). Always return final_fare_bdt alongside total_bdt."
          - "BRTA ceiling check: read platform_config.brta_max_per_km_bdt and brta_max_base_bdt. If pricing.per_km_bdt > brta_max_per_km_bdt OR pricing.base_fare_bdt > brta_max_base_bdt: logger.warn('[fareCalc] BRTA ceiling exceeded'). Do NOT block the ride."
          - "Round all intermediate calculations to nearest integer (Math.round)."
          - "If no pricing row found: throw FarePricingNotFoundError (caller returns 422)."
          - "SERVER-SIDE ONLY — never import this in any screen or component."
        verification:
          - type: file_exists
            path: "lib/fareCalc.ts"
          - type: contains
            file: "lib/fareCalc.ts"
            patterns:
              - "calculateFare"
              - "FareBreakdown"
              - "base_fare_bdt"
              - "distance_charge_bdt"
              - "wait_charge_bdt"
              - "minimum_fare_bdt"
              - "final_fare_bdt"
              - "brta_max_per_km_bdt\\|brta.*ceiling\\|BRTA"
              - "Math.round"
          - type: anti_pattern_check
            file: "lib/fareCalc.ts"
            forbidden: "parseFloat\\|toFixed\\|\\.0\\b"
            description: "Must use integer arithmetic only — no floats"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: high

      - id: P6-04
        task: "Create utils-server/types.ts — all WebSocket message type definitions"
        files_to_create:
          - "utils-server/types.ts"
        types_to_define:
          - "interface HeartbeatMessage { type: 'heartbeat', lat: number, lng: number, ts: number }  -- driver identity inferred from authenticated WebSocket session; field name is 'ts' not 'timestamp' (matches 06-API.md)"
          - "interface LocationUpdateMessage { type: 'location:update', lat: number, lng: number, ts: number }  -- no driver_id in payload; driver identity comes from auth binding; includes ts timestamp per 06-API.md"
          - "interface RideOfferMessage { type: 'ride:offer', ride_id: string, pickup: { address: string, lat: number, lng: number }, dropoff: { address: string, lat: number, lng: number }, fare_breakdown: FareBreakdown, vehicle_type: string, rider_first_name: string, distance_km: number, expires_in_ms: number, expires_at: string }  -- rider_first_name (not rider_name); distance_km required per 06-API.md WebSocket events table"
          - "interface FetchConfirmMessage { type: 'fetch:confirm', ride_id: string, driver_id: string }"
          - "interface OfferAcceptMessage { type: 'offer:accept', ride_id: string, driver_id: string }"
          - "interface OfferRejectMessage { type: 'offer:reject', ride_id: string, driver_id: string }"
          - "interface AuthHelloMessage { type: 'auth:hello', supabase_access_token: string, role: 'driver'|'rider' }"
          - "type InboundMessage = HeartbeatMessage | FetchConfirmMessage | OfferAcceptMessage | OfferRejectMessage | AuthHelloMessage | LocationUpdateMessage"
          - "type OutboundMessage = RideOfferMessage | { type: 'offer:expired', ride_id: string } | { type: 'ride:matched', ride_id: string, driver_id: string, driver_phone: string }"
        verification:
          - type: file_exists
            path: "utils-server/types.ts"
          - type: contains
            file: "utils-server/types.ts"
            patterns:
              - "HeartbeatMessage"
              - "RideOfferMessage"
              - "FetchConfirmMessage"
              - "expires_in_ms"
              - "InboundMessage"
              - "OutboundMessage"
          - type: command
            run: "cd utils-server && npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: critical

      - id: P6-05
        task: "Create utils-server/h3Index.ts — in-memory H3 driver location index"
        files_to_create:
          - "utils-server/h3Index.ts"
        required_exports:
          - "h3Index.updateDriver(driverId: string, lat: number, lng: number): void"
          - "h3Index.removeDriver(driverId: string): void"
          - "h3Index.getDriversInCells(cells: string[]): string[]  -- returns driver_ids"
          - "h3Index.startRefreshLoop(): void  -- called once on startup"
          - "h3Index.getIndexAge(): number  -- ms since last DB refresh"
        implementation_rules:
          - "Internal storage: Map<h3Cell, Set<driverId>> + Map<driverId, h3Cell> (reverse index)."
          - "updateDriver: compute new H3 cell. If cell changed: remove from old cell's set, add to new. Update reverse index."
          - "startRefreshLoop: setInterval every H3_CACHE_TTL_SECONDS (default 30s). On each tick: query DB for all online+active drivers and their last location. Rebuild index."
          - "This refresh catches drivers who went offline/online via app restart without WebSocket disconnect."
          - "Log [h3] index refreshed: {driverCount} drivers on each tick."
          - "If DB query fails: log [h3] refresh failed — index may be stale. Do NOT clear existing index."
          - "getIndexAge: returns Date.now() - lastRefreshAt. Used by monitoring."
          - "Import h3-js directly here (exception to rule — this is one of two allowed files)."
        verification:
          - type: file_exists
            path: "utils-server/h3Index.ts"
          - type: contains
            file: "utils-server/h3Index.ts"
            patterns:
              - "updateDriver"
              - "removeDriver"
              - "getDriversInCells"
              - "startRefreshLoop"
              - "getIndexAge"
              - "Map.*Set\\|new Map\\|new Set"
          - type: command
            run: "cd utils-server && npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-04]
        priority: critical

      - id: P6-06
        task: "Create utils-server/heartbeat.ts — heartbeat processing and call deduction window"
        files_to_create:
          - "utils-server/heartbeat.ts"
        required_exports:
          - "processHeartbeat(driverId: string, lat: number, lng: number): Promise<void>"
          - "openDeductionWindow(rideId: string, driverId: string, subscriptionId: string): void"
          - "confirmFetch(rideId: string, driverId: string): Promise<void>"
        implementation_rules:
          - "processHeartbeat: update drivers.last_location_lat/lng/at and h3_cell_res9 in DB. Call h3Index.updateDriver()."
          - "confirmFetch: called when fetch:confirm WebSocket message is received. This is the SOLE WRITER for deduction."
          - "  Calls deductCall() inside Drizzle transaction. MUST verify that no deduction row already exists for this (ride_id, driver_id) before writing."
          - "deductCall (private): Drizzle transaction:"
          - "  1. SELECT subscriptions WHERE driver_id = X AND status='active' FOR UPDATE."
          - "  2. If calls_remaining = 0 OR (calls_remaining = -1 AND daily_calls_used >= daily_cap * coalesce(cap_override, 1.0)): do NOT deduct. Log warning."
          - "  3. If calls_remaining = -1 (unlimited): do NOT decrement calls_remaining. Write call_ledger: event_type='deduction', delta=-1, balance_after=-1, reason='app_fetch'. Increment daily_calls_used and total_deductions. Note: delta=-1 matches 02-ARCHITECTURE.md; balance_after remains -1 (sentinel for unlimited) — the delta records usage for audit without changing the unlimited balance sentinel."
          - "  4. Else: UPDATE subscriptions SET calls_remaining = calls_remaining - 1. INSERT call_ledger delta=-1."
          - "  5. The call_ledger UNIQUE index on (ride_id, driver_id) WHERE event_type='deduction' prevents double-deduction at DB level."
          - "  6. COMMIT."
          - "refundCall (private): ONLY called if fetch:confirm was received (deduction written) BUT driver ignores offer for full 15s or re-broadcast happens. INSERT call_ledger event_type='refund'."
          - "THIS IS THE ONLY FILE THAT WRITES TO call_ledger (deductions). Any PR that adds call_ledger deduction writes elsewhere must be rejected."
        verification:
          - type: file_exists
            path: "utils-server/heartbeat.ts"
          - type: contains
            file: "utils-server/heartbeat.ts"
            patterns:
              - "processHeartbeat"
              - "openDeductionWindow"
              - "confirmFetch"
              - "CALL_DEDUCTION_WINDOW_MS\\|deductionWindow"
              - "db.transaction"
              - "calls_remaining"
              - "no_interaction_refund"
              - "app_fetch"
          - type: anti_pattern_check
            scope: "entire codebase"
            forbidden_pattern: "call_ledger.*insert\\|insert.*call_ledger"
            exclude_files:
              ["utils-server/heartbeat.ts", "lib/activateSubscription.ts"]
            description: "call_ledger writes only in heartbeat.ts and activateSubscription.ts (initial_load)"
          - type: command
            run: "cd utils-server && npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-04, P6-05]
        priority: critical
        notes: "This is the highest-risk function in the codebase. Test the deduction window with sleep() delays in unit tests."

      - id: P6-07
        task: "Create utils-server/dispatch.ts — driver scoring and batch broadcast"
        files_to_create:
          - "utils-server/dispatch.ts"
        required_exports:
          - "dispatchRide(rideId: string, ride: RideRow): Promise<void>"
          - "handleOfferAccept(rideId: string, driverId: string): Promise<void>"
          - "handleOfferReject(rideId: string, driverId: string): void"
        implementation_rules:
          - "dispatchRide: called by app/api/ride/request+api.ts via internal HTTP call to utils-server."
          - "  Step 1: Get H3 cell for ride pickup lat/lng."
          - "  Step 2: Call findNearbyDrivers() to get H3 cells in rings 0→2."
          - "  Step 3: h3Index.getDriversInCells(cells) → candidate driver_ids."
          - "  Step 4: Filter candidates — only connected WebSocket clients (check connectedDrivers Map)."
          - "  Step 5: Score drivers. Weight formula: 40% proximity (ring index) + 30% rating + 20% acceptance_rate + 10% availability_bonus. Matches PRD req-21 and 02-ARCHITECTURE.md."
          - "  Step 6: Take top-N (N = MAX_DISPATCH_BATCH_SIZE, default 5) as Batch 1."
          - "  Step 7: For each driver in batch: send RideOfferMessage via WebSocket. INSERT dispatch_offers row with outcome='delivered'."
          - "  Step 8: Wait OFFER_COUNTDOWN_MS (15s). If no accept: broadcast Batch 2 (next top-N). Max 3 batches. On refund logic: if fetch:confirmed_at was set but outcome is not 'accepted', call refundCall()."
          - "  Step 9: If all 3 batches exhausted with no accept: update rides.status='expired'."
          - "handleOfferAccept: update rides.status='matched', rides.driver_id, rides.matched_at. Send ride:matched to rider. Cancel remaining offer timers for this ride."
          - "handleOfferReject: remove driver from candidate pool for this ride. Continue waiting for other drivers."
          - "Track active offers in Map<rideId, { batchIndex, pendingDriverIds, timer }>."
          - "Cleanup: clear all timers for a rideId when matched or expired."
        verification:
          - type: file_exists
            path: "utils-server/dispatch.ts"
          - type: contains
            file: "utils-server/dispatch.ts"
            patterns:
              - "dispatchRide"
              - "handleOfferAccept"
              - "handleOfferReject"
              - "openDeductionWindow"
              - "acceptance_rate"
              - "MAX_DISPATCH_BATCH_SIZE\\|batchSize\\|top.*N"
              - "rides.status.*matched\\|status.*matched"
          - type: command
            run: "cd utils-server && npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-05, P6-06]
        priority: critical

      - id: P6-08
        task: "Replace utils-server/index.ts — WebSocket server entry point"
        files_to_modify:
          - "utils-server/index.ts"
        implementation_rules:
          - "Replace GlideX Express server with ws WebSocket server."
          - "const wss = new WebSocketServer({ port: WEBSOCKET_PORT })."
          - "Maintain connectedDrivers: Map<driverId, WebSocket> — used by dispatch to send offers."
          - "Maintain connectedRiders: Map<userId, WebSocket> — used to deliver ride:matched, ride:cancelled, location:driver events to riders."
          - "On connection: expect AuthHelloMessage. Validate Supabase JWT (supabaseAdmin.auth.getUser(supabase_access_token)). Look up user by auth_uid. If role='driver': add to connectedDrivers map. If role='rider': add to connectedRiders map."
          - "On message (parse InboundMessage type field):"
          - "  'heartbeat': call processHeartbeat(). Update last_seen."
          - "  'location:update': call h3Index.updateDriver(). Update DB lat/lng."
          - "  'fetch:confirm': call confirmFetch(rideId, driverId)."
          - "  'offer:accept': call handleOfferAccept(rideId, driverId)."
          - "  'offer:reject': call handleOfferReject(rideId, driverId)."
          - "On close: h3Index.removeDriver(). Remove from connectedDrivers. Update drivers.is_online=false."
          - "Internal HTTP endpoint: POST /internal/dispatch — receives ride data from Expo API. Validates WEBSOCKET_INTERNAL_SECRET header. Calls dispatchRide()."
          - "On startup: call h3Index.startRefreshLoop(), startCompensationWorker(), recoverOrphanedPayments()."
          - "Rider socket binding: On `auth:hello` with role='rider', bind socket to user_id to deliver `ride:matched` events."
          - "Daily reset cron: setInterval every minute. If current BDT time is past midnight and daily_reset_at < midnight: UPDATE subscriptions SET daily_calls_used = 0, daily_reset_at = now() WHERE calls_remaining = -1."
        verification:
          - type: file_exists
            path: "utils-server/index.ts"
          - type: contains
            file: "utils-server/index.ts"
            patterns:
              - "WebSocketServer\\|new Server"
              - "connectedDrivers"
              - "processHeartbeat"
              - "confirmFetch"
              - "handleOfferAccept"
              - "WEBSOCKET_INTERNAL_SECRET"
              - "startRefreshLoop"
              - "startCompensationWorker"
              - "recoverOrphanedPayments"
          - type: anti_pattern_check
            file: "utils-server/index.ts"
            forbidden: "express()\\|app.listen"
            description: "Must use ws WebSocketServer — not Express"
          - type: command
            run: "cd utils-server && npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-05, P6-06, P6-07]
        priority: critical

      - id: P6-09
        task: "Create utils-server/scheduler.ts — cron jobs for daily reset, scheduled rides, pro-rata credit"
        files_to_create:
          - "utils-server/scheduler.ts"
        required_exports:
          - "startScheduler(): void  -- called once at startup"
        cron_jobs:
          - name: "Daily call reset"
            schedule: "every day at 00:00 BDT (18:00 UTC)"
            logic: "UPDATE subscriptions SET daily_calls_used=0, daily_reset_at=next_midnight WHERE status='active'"
          - name: "Subscription expiry check"
            schedule: "every hour"
            logic: "UPDATE subscriptions SET status='expired' WHERE expires_at < now() AND status='active'. For each expired: INSERT call_ledger expiry_writeoff for remaining balance. Create credit_vouchers if eligible."
          - name: "Temporary driver expiry"
            schedule: "every day at 06:00 BDT"
            logic: "SELECT drivers WHERE status='temporary' AND provisional_expires_at < now(). If consent not renewed: update status='suspended'. Send FCM push notification."
          - name: "Scheduled ride dispatch"
            schedule: "every 60 seconds"
            logic: "SELECT rides WHERE status='pending' AND scheduled_at BETWEEN now()+60s AND now()+120s AND scheduled_dispatched_at IS NULL. For each: set scheduled_dispatched_at=now(), then call dispatchRide(). Window targets rides 1–2 min away so dispatch begins ~scheduled_at-120s (AC-9). scheduled_dispatched_at IS NULL guard prevents double-dispatch on utils-server restart."
          # NOTE: acceptance_rate is NOT a scheduler cron job — it is an async background update fired
          # from dispatch.ts after each offer outcome resolves. It is listed here for documentation
          # completeness only. See 02-ARCHITECTURE.md § acceptance_rate update trigger for the SQL.
          # The update fires as a .catch()-guarded background promise from dispatch.ts — not from scheduler.ts.
          - name: "Consent scan copy deadline check"
            schedule: "every 60 seconds"
            logic: "SELECT drivers WHERE status='temporary' AND stage2_due_at < now(). Suspend drivers who have not re-submitted owner consent scan. Send FCM push."
          - name: "Document purge"
            schedule: "daily"
            logic: "DELETE Supabase Storage objects WHERE documents.purge_at < now(). Set storage_url=NULL on those rows."
          - name: "Chat message retention"
            schedule: "daily"
            logic: "DELETE FROM chat_messages WHERE created_at < now() - interval '30 days'."
          - name: "Subscription expiry (deferred for active rides)"
            schedule: "every 60 seconds"
            logic: "Emit subscription:expired to online drivers whose subscription expired. Defer if driver has active ride in progress. Maximum defer: 2 hours."
          - name: "callback_pending recovery"
            schedule: "every 10 minutes"
            logic: "SELECT payment_events WHERE status='callback_pending' AND initiated_at < now()-10min. For each: call provider verification API. If paid: call activateSubscription()."
          - name: "Rate limits cleanup"
            schedule: "every 60 minutes"
            logic: "DELETE FROM rate_limits WHERE window_start < now() - interval '1 hour'."
          - name: "Stale matched rides"
            schedule: "every 60 seconds"
            logic: "Auto-cancel rides WHERE status='matched' AND matched_at < now() - interval '30 min' (driver_no_show)."
          - name: "Credit voucher expiry"
            schedule: "daily"
            logic: "UPDATE credit_vouchers SET status='expired' WHERE expires_at < now() AND status='active'."
          - name: "Vehicle type cooling-off"
            schedule: "every 60 seconds"
            logic: "SELECT vehicle_type_changes WHERE status='cooling_off' AND effective_at <= now(). For each: UPDATE drivers.vehicle_type and vehicles.vehicle_type, set status='approved'. Notify driver."
        implementation_rules:
          - "Use setInterval for all jobs — no external cron library needed at MVP."
          - "Log job name and timestamp on each execution."
          - "If a job throws: catch error, log logger.error — do not crash the scheduler loop."
          - "At startup: recover any rides that should have been dispatched during downtime (scheduled_at BETWEEN startup_time-5min AND now())."
        verification:
          - type: file_exists
            path: "utils-server/scheduler.ts"
          - type: contains
            file: "utils-server/scheduler.ts"
            patterns:
              - "startScheduler"
              - "daily_calls_used.*0\\|daily_reset"
              - "temporary.*expired\\|provisional_expires_at"
              - "scheduled_at"
              - "pro.*rata\\|credit_issued"
          - type: command
            run: "cd utils-server && npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-07, P6-08]
        priority: high

      - id: P6-10
        task: "Create app/api/ride/request+api.ts — rider ride request endpoint"
        files_to_create:
          - "app/api/ride/request+api.ts"
        implementation_rules:
          - "Method: POST. Auth: required (rider role)."
          - "Zod body: { pickup_lat, pickup_lng, pickup_address, dropoff_lat, dropoff_lng, dropoff_address, vehicle_type, scheduled_at? (ISO string) }."
          - "Zone check: call isInsideZone(pickup_lat, pickup_lng). If false: 422 { error: 'outside_zone' }."
          - "Rate limit: 5 successful requests per rider per 60 mins AND at most 1 ride in pending/dispatching/matched/in_progress per rider at any time. Returns 409 `ride_already_active` if rider has active ride, or 429 `rider_rate_limited` if quota exceeded."
          - "Calculate distance (Haversine formula) between pickup and dropoff."
          - "Call calculateFare({ vehicleType, distanceKm, zoneId: activeZone.id })."
          - "INSERT rides row with { user_id, fare_breakdown, vehicle_type, status='pending', scheduled_at (null if immediate) }."
          - "If immediate (scheduled_at null): call internal POST {WEBSOCKET_SERVER_INTERNAL_URL}/internal/dispatch with { ride_id, ride data }. Include WEBSOCKET_INTERNAL_SECRET header."
          - "If scheduled: scheduler will dispatch at scheduled_at time — do not dispatch immediately."
          - "Return 200: { ride_id, fare_breakdown, status: 'pending' }."
        response_codes:
          200: "Ride created and dispatch initiated"
          400: "Invalid body"
          401: "Not authenticated"
          403: "Role is not rider"
          422: "Pickup outside active zone"
          429: "Too many active rides"
          502: "Utils-server unreachable (dispatch not started — ride still created)"
        verification:
          - type: file_exists
            path: "app/api/ride/request+api.ts"
          - type: contains
            file: "app/api/ride/request+api.ts"
            patterns:
              - "verifySupabaseToken"
              - "isInsideZone"
              - "outside_zone"
              - "calculateFare"
              - "fare_breakdown"
              - "WEBSOCKET_INTERNAL_SECRET"
              - "internal/dispatch"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P6-02, P6-03, P6-08]
        priority: critical

      - id: P6-11
        task: "End-to-end dispatch smoke test"
        manual_test_steps:
          - step: "Start utils-server. Connect driver WebSocket client."
            expected: "[h3] index loaded. Driver appears in connectedDrivers. is_online=true in DB."
          - step: "Driver sends heartbeat with Dhaka coordinates."
            expected: "drivers.h3_cell_res9 updated. h3Index updated. last_location_at updated."
          - step: "Rider calls POST /api/ride/request with pickup inside active zone."
            expected: "Fare calculated. Ride inserted (status=pending). Internal dispatch call made to utils-server."
          - step: "Driver receives ride:offer WebSocket message."
            expected: "offer contains ride_id, pickup, dropoff, fare_breakdown, expires_in_ms=15000."
          - step: "Driver sends fetch:confirm immediately."
            expected: "Deduction window opens. After 5s: call_ledger deduction row inserted. subscriptions.calls_remaining decremented by 1."
          - step: "Driver sends offer:accept."
            expected: "rides.status=matched. rides.driver_id set. rides.matched_at set. Rider receives ride:matched message."
          - step: "Verify no double deduction: check call_ledger for (ride_id, driver_id)."
            expected: "Exactly one deduction row. Unique index confirms no duplicates."
          - step: "Test expiry: new ride, driver does NOT send fetch:confirm within 5s."
            expected: "No deduction. call_ledger has no row for this ride+driver."
          - step: "Test 3-batch exhaustion: all drivers reject all 3 batches."
            expected: "rides.status=expired after 3 × 15s."
        verification:
          - type: manual_check
            description: "All 9 steps pass. call_ledger has exactly 1 deduction row per accepted offer with fetch:confirm."
        depends_on: [P6-08, P6-10]
        priority: critical

