          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P9-VDG-01]
        priority: medium

  # ============================================================
  # PHASE 10: In-App Chat (react-native-gifted-chat)
  # ============================================================
  - id: 10
    name: "In-App Chat (MVP)"
    blocking: false
    description: >
      Implement rider-driver in-app messaging using react-native-gifted-chat for UI.
      Transport uses the existing WebSocket connection. Messages persisted to chat_messages table.
      Chat available during matched/driver_arriving/in_progress ride states.
    items:
      - id: P10-01
        task: "Install react-native-gifted-chat dependency"
        command: "npm install react-native-gifted-chat"
        verification:
          - type: json_field_check
            file: package.json
            fields_exist:
              - "dependencies.react-native-gifted-chat"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
            description: "TypeScript compiles after adding gifted-chat."
        depends_on: [P1-03]
        priority: high

      - id: P10-02
        task: "Create app/api/ride/[id]/messages+api.ts — GET chat history"
        files_to_create:
          - "app/api/ride/[id]/messages+api.ts"
        implementation_rules:
          - "Auth: Supabase JWT. Only rider or matched driver of this ride."
          - "Query chat_messages WHERE ride_id = :id ORDER BY created_at ASC LIMIT 50."
          - "Support `before` query param for pagination (load earlier messages)."
          - "Return { messages: [...], has_more: boolean }."
          - "Return 403 if user is not a participant."
        verification:
          - type: file_exists
            path: "app/api/ride/[id]/messages+api.ts"
          - type: contains
            file: "app/api/ride/[id]/messages+api.ts"
            patterns:
              - "chat_messages"
              - "ride_id"
              - "created_at"
              - "has_more"
          - type: typescript_compiles
            file: "app/api/ride/[id]/messages+api.ts"
        depends_on: [P2-07g, P4-08]
        priority: high

      - id: P10-03
        task: "Create app/api/ride/[id]/message+api.ts — POST send message"
        files_to_create:
          - "app/api/ride/[id]/message+api.ts"
        implementation_rules:
          - "Auth: Supabase JWT. Only rider or matched driver of this ride."
          - "Validate: rides.status IN ('matched', 'driver_arriving', 'in_progress'). If not, 403 chat_closed."
          - "Validate: content length 1-1000 chars."
          - "INSERT chat_messages {ride_id, sender_id, content}."
          - "Emit chat:message WebSocket event to the OTHER participant via utils-server internal endpoint."
          - "Return 201 with created message."
        verification:
          - type: file_exists
            path: "app/api/ride/[id]/message+api.ts"
          - type: contains
            file: "app/api/ride/[id]/message+api.ts"
            patterns:
              - "chat_messages"
              - "chat_closed"
              - "content"
              - "sender_id"
          - type: anti_pattern_check
            file: "app/api/ride/[id]/message+api.ts"
            forbidden: "console.log"
        depends_on: [P10-02, P6-01]
        priority: high

      - id: P10-04
        task: "Add chat:message and chat:typing WebSocket handlers to utils-server"
        files_to_modify:
          - "utils-server/dispatch.ts"
        implementation_rules:
          - "Handle chat:message relay: when POST /api/ride/:id/message writes to DB, emit chat:message to the other participant's WebSocket connection."
          - "Handle chat:typing relay: forward typing indicator to the other participant."
          - "Look up ride participants (rider_id, driver_id) to determine recipient."
          - "No message persistence in utils-server — that happens in the Expo API route."
        verification:
          - type: contains
            file: "utils-server/dispatch.ts"
            patterns:
              - "chat:message"
              - "chat:typing"
        depends_on: [P6-01, P10-03]
        priority: high

      - id: P10-05
        task: "Create store/useChatStore.ts — Chat Zustand store"
        files_to_create:
          - "store/useChatStore.ts"
        required_exports:
          - "useChatStore"
        implementation_rules:
          - "State: messages array, loading, error, hasMore, rideId."
          - "Actions: loadMessages(rideId, before?), sendMessage(content), onNewMessage(message), clearChat()."
          - "onNewMessage: append to messages, called by WebSocket chat:message listener."
        verification:
          - type: file_exists
            path: "store/useChatStore.ts"
          - type: contains
            file: "store/useChatStore.ts"
            patterns:
              - "useChatStore"
              - "messages"
              - "loadMessages"
              - "sendMessage"
          - type: typescript_compiles
            file: "store/useChatStore.ts"
        depends_on: [P1-03, P10-02]
        priority: high

      - id: P10-06
        task: "Create components/ChatScreen.tsx — GiftedChat wrapper"
        files_to_create:
          - "components/ChatScreen.tsx"
        ui_requirements:
          - "Render GiftedChat component with messages from useChatStore."
          - "Header: back button, 'Chat with [Name]', phone icon (native dialer fallback via GET /api/ride/:id/contact)."
          - "On send: call useChatStore.sendMessage()."
          - "Load earlier: pagination via before cursor."
          - "Avatar: sender profile image or initial letter fallback."
          - "Input bar hidden when ride status not in matched/driver_arriving/in_progress. Show 'This ride has ended.' banner."
          - "States: loading (skeleton), empty ('Start the conversation'), error (retry)."
          - "Real-time: append messages on WebSocket chat:message event."
        verification:
          - type: file_exists
            path: "components/ChatScreen.tsx"
          - type: contains
            file: "components/ChatScreen.tsx"
            patterns:
              - "GiftedChat"
              - "useChatStore"
              - "loadMessages"
              - "sendMessage"
          - type: anti_pattern_check
            file: "components/ChatScreen.tsx"
            forbidden: "console.log"
          - type: typescript_compiles
            file: "components/ChatScreen.tsx"
        depends_on: [P10-01, P10-05]
        priority: high

      - id: P10-07
        task: "Add chat routes to rider and driver screens"
        files_create:
          - "app/(main)/(customer)/chat.tsx"
          - "app/(main)/(rider)/chat.tsx"
        implementation_rules:
          - "Each file is a thin wrapper that renders ChatScreen component."
          - "Pass rideId from route params."
          - "Navigation from matched-ride screen via 'Chat' button."
        verification:
          - type: file_exists
            paths:
              - "app/(main)/(customer)/chat.tsx"
              - "app/(main)/(rider)/chat.tsx"
          - type: contains
            file: "app/(main)/(customer)/chat.tsx"
            patterns:
              - "ChatScreen"
          - type: contains
            file: "app/(main)/(rider)/chat.tsx"
            patterns:
              - "ChatScreen"
        depends_on: [P10-06]
        priority: high

      - id: P10-08
        task: "Add admin chat export endpoint"
        files_to_create:
          - "app/api/admin/ride/[id]/chat+api.ts"
        implementation_rules:
          - "Auth: Supabase JWT + users.role = 'admin'."
          - "Return full chat history (no pagination limit) with participant details."
          - "Used for dispute resolution."
        verification:
          - type: file_exists
            path: "app/api/admin/ride/[id]/chat+api.ts"
          - type: contains
            file: "app/api/admin/ride/[id]/chat+api.ts"
            patterns:
              - "chat_messages"
              - "admin"
        depends_on: [P9-01, P10-02]
        priority: medium

      - id: P10-09
        task: "End-to-end chat test"
        manual_test_steps:
          - step: "Match a ride between rider and driver"
            expected: "Ride status = matched"
          - step: "Rider opens chat, sends 'Hello'"
            expected: "Message appears in rider chat. Driver receives chat:message via WebSocket."
          - step: "Driver opens chat, sees 'Hello', replies 'On my way'"
            expected: "Message appears in driver chat. Rider receives chat:message via WebSocket."
          - step: "Complete the ride"
            expected: "Chat becomes read-only. Input bar hidden. 'This ride has ended.' banner shown."
          - step: "Admin opens GET /api/admin/ride/:id/chat"
            expected: "Full message history with participant details returned."
        verification:
          - type: manual_check
            description: "All 5 chat test steps pass."
        depends_on: [P10-07, P10-08]
        priority: high

