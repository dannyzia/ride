          - "driver-economics GET: return active drivers with economics. For each driver: completed_rides_count (lifetime), cost_per_ride_bdt = round(active_subscription_total_cost / NULLIF(completed_rides_in_subscription_window, 0)) or null, calls_remaining from latest active subscription, subscription_expires_at. Latest subscription via subscriptions WHERE driver_id ORDER BY purchased_at DESC LIMIT 1."
