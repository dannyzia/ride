  # ==========================================================================
  # FEATURE IMPLEMENTATION ORDER
  # ==========================================================================
  #
  # Recommended implementation order (documented for coding agent guidance):
  #
  #   1. F7 — Polished Offer Sheet (no DB changes, UI only, builds on existing WebSocket)
  #   2. F4 — Coupon Promos (has DB dependencies but no dispatch impact)
  #   3. F5 — Driver Incentives (depends on credit_vouchers which already exist)
  #   4. F6 — Rider Preferences (touches dispatch, do last after everything else is stable)
  #
  # Rationale:
  #   - F7 is pure UI enrichment with zero risk to existing flows.
  #   - F4 adds new tables and APIs but does not modify dispatch behavior.
  #   - F5 adds new tables and a scheduler job but reuses credit_vouchers.
  #   - F6 modifies dispatch.ts which is the most critical system component,
  #     so it should be done last when all other features are verified stable.
  #
  # Dependencies between these features:
  #   - F6-10 (preference indicators on offer sheet) depends on F7-02.
  #   - No other cross-feature dependencies exist.
  # ==========================================================================

