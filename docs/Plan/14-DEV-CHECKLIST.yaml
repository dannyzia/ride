      - id: F15-API-10
        task: "Add vehicle_type column to packages table + enforce vehicle-scoped packages in list/purchase endpoints"
        files_to_modify:
          - "src/db/schema.ts"
          - "app/api/admin/packages+api.ts"
          - "app/api/package/list+api.ts"
          - "app/api/package/purchase+api.ts"
        implementation_rules:
          - "Add column packages.vehicle_type: vehicleTypeEnum('vehicle_type') (nullable, default NULL). Add index packages_vehicle_type_idx ON (vehicle_type)."
          - "Pattern mirrors incentive_definitions.vehicle_type_filter: NULL = universal package (available to every driver); non-null = scoped to that vehicle type only."
          - "Extend createSchema and updateSchema in app/api/admin/packages+api.ts to accept vehicle_type: VEHICLE_TYPE_ZOD_ENUM.nullable().optional().default(null)."
          - "app/api/package/list+api.ts: join drivers -> users to read the caller's vehicle_type, then filter WHERE is_active = true AND deleted_at IS NULL AND (vehicle_type IS NULL OR vehicle_type = driver.vehicle_type). If the caller has no driver record yet, return only universal (vehicle_type IS NULL) packages. SELECT must include vehicle_type."
          - "app/api/package/purchase+api.ts: after loading the package, if pkg.vehicle_type IS NOT NULL AND pkg.vehicle_type != driver.vehicle_type → return 403 { error: 'vehicle_type_mismatch', message: 'This package is only available for <vehicle_type> drivers' }."
          - "Generate + push migration. Existing packages default to NULL (universal) — backward compatible."
        verification:
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "vehicle_type"
          - type: contains
            file: "app/api/package/list+api.ts"
            patterns:
              - "vehicle_type"
              - "isNull"
          - type: contains
            file: "app/api/package/purchase+api.ts"
            patterns:
              - "vehicle_type_mismatch"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P2-05, P5-04, P5-05]
        priority: high

