failure_conditions:
  - condition: "Clerk imports found in source"
    check: "grep -rn '@clerk/' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
    action: "BLOCK_ALL_PHASES"

  - condition: "Stripe imports found in source"
    check: "grep -rn '@stripe/\\|from.*['\"]stripe['\"]' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
    action: "BLOCK_ALL_PHASES"

  - condition: "Payment credentials in EXPO_PUBLIC_ variables"
    check: "grep -rn 'EXPO_PUBLIC_BKASH\\|EXPO_PUBLIC_NAGAD' . --include='*.env*' --include='*.ts'"
    action: "BLOCK_DEPLOY"

  - condition: "Secrets committed to git"
    check: "git log --all -p | grep -E 'SUPABASE_SERVICE_ROLE_KEY|bkash.*secret|nagad.*key|portpos.*secret' | grep -v '.example'"
    action: "BLOCK_DEPLOY"

  - condition: "console.log in committed source code"
    check: "grep -rn 'console\\.log' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
    action: "WARN"

  - condition: "TypeScript compilation fails"
    check: "npx tsc --noEmit; echo $?"
    expect_exit: 0
    action: "BLOCK_ALL_PHASES"

ai_tracking:
  session_start: null
  current_phase: 1
  completed_items: []
  blocked_items: []
  last_updated: null
  notes: ""

validation_commands:
  type_check: "npx tsc --noEmit"
  lint: "npx eslint . --ext .ts,.tsx --max-warnings=0"
  clerk_sweep: "grep -rn '@clerk/' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
  stripe_sweep: "grep -rn 'stripe' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
  secret_sweep: "grep -rn 'SUPABASE_SERVICE_ROLE_KEY\\|bkash.*secret\\|nagad.*key\\|portpos.*key' . --include='*.ts' --exclude-dir=node_modules"
  console_sweep: "grep -rn 'console\\.log' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
  # New invariant sweeps (Phase 7+)
  float_fare_sweep: "grep -rn 'paisaToTaka\\|/ 100\\|\\/ 100' lib/fareCalc.ts | grep -v 'paisaToTaka'  # paisaToTaka must be the only /100 in fareCalc"
  platform_config_cache_sweep: "grep -rn 'const.*platform_config\\|let.*platform_config' --include='*.ts' . | grep -v 'from\\|import\\|schema'  # no module-level cache of platform_config"
  h3_import_sweep: "grep -rn \"from 'h3-js'\" --include='*.ts' . | grep -v 'lib/h3.ts\\|h3Index.ts'  # h3-js only in lib/h3.ts and h3Index.ts"

