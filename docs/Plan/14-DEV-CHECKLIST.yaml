# Development Checklist — Ride project. Canonical machine-readable source for AI agents.
# Format: YAML 1.2
# Base codebase: Ride (D:\My Projects\Current Project\Ride)
# AI Instructions:
# - Parse this file at the start of every implementation session.
# - Complete phases in critical_path order. Never start a blocking phase's dependents until it is 100% complete.
# - For each item: create/modify the listed files, run verifications, mark done before moving on.
# - Treat failure_conditions as hard blockers — if any grep/check fires, stop and fix before continuing.
# - Update ai_tracking.completed_items and ai_tracking.current_phase as you work.

version: "1.0"
project: Ride
base_codebase: Ride
total_phases: 11
critical_path:
  - phase: 1
    name: Foundation — GlideX Cleanup
    must_complete_before: [2, 3]
    reason: "Schema and auth cannot be built until Clerk/Stripe are fully removed"
  - phase: 2
    name: Database Schema
    must_complete_before: [4, 5, 6, 7, 8, 9]
    reason: "All business logic depends on the new tables existing"
  - phase: 3
    name: "Supabase Auth + dprelay Integration"
    must_complete_before: [4]
    reason: "Auth screens depend on Supabase phone OTP and dprelay being configured"
  - phase: 4
    name: Auth Layer
    must_complete_before: [5, 6, 7, 8, 9]
    reason: "Every API route requires Supabase JWT verification"
  - phase: 5
    name: Payment System
    must_complete_before: [7]
    reason: "Driver flows require package purchase before receiving calls"
  - phase: 6
    name: Dispatch Engine
    must_complete_before: [7, 8]
    reason: "Driver and rider flows require WebSocket dispatch and call deduction"
  - phase: 11
    name: Commission System & Waiting Time
    must_complete_before: []
    reason: "Post-MVP features to be implemented after core flows"

# ============================================================
# PHASE 1: Foundation — GlideX Cleanup
# ============================================================
phases:
  - id: 1
    name: "Foundation — GlideX Cleanup"
    blocking: true # All subsequent phases depend on this being clean
    description: >
      Strip GlideX of all Clerk, Stripe, and Resend dependencies.
      Update project identity. Install Ride-specific packages.
      Establish logger and environment file structure.
      Goal: codebase compiles with zero Clerk/Stripe references.
    items:
      - id: P1-01
        task: "Update project identity in package.json"
        files_to_modify:
          - "package.json"
        changes:
          - field: "name"
            from: "GlideX"
            to: "ride"
          - field: "version"
            to: "1.0.0"
        verification:
          - type: json_field_check
            file: "package.json"
            field: "name"
            expected: "ride"
          - type: anti_pattern_check
            file: "package.json"
            forbidden: "GlideX|glidex"
        depends_on: []
        priority: high

      - id: P1-02
        task: "Update app.config.js with Ride identity and remove Clerk/Stripe plugin config"
        files_to_modify:
          - "app.config.js"
        changes:
          - "Set name: 'Ride'"
          - "Set slug: 'ride-bd'"
          - "Set android.package: 'com.ride.bd'"
          - "Set ios.bundleIdentifier: 'com.ride.bd'"
          - "Remove plugins entry for @clerk/clerk-expo"
          - "Remove plugins entry for @stripe/stripe-react-native (enableGooglePay etc.)"
        verification:
          - type: contains
            file: "app.config.js"
            pattern: "ride-bd"
          - type: anti_pattern_check
            file: "app.config.js"
            forbidden: "clerk|stripe|enableGooglePay"
            case_insensitive: true
        depends_on: [P1-01]
        priority: high

      - id: P1-03
        task: "Uninstall Clerk packages"
        command: "npm uninstall @clerk/clerk-expo @clerk/express"
        verification:
          - type: anti_pattern_check
            file: "package.json"
            forbidden: "@clerk/clerk-expo"
          - type: anti_pattern_check
            file: "package.json"
            forbidden: "@clerk/express"
          - type: command
            run: "grep -r '@clerk/' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
            expect_exit: 1 # Exit 1 = no matches found = good
            description: "Zero Clerk imports remaining in source"
        depends_on: [P1-01]
        priority: critical
        notes: "Run this before deleting source files so npm doesn't complain about missing peers"

      - id: P1-04
        task: "Uninstall Stripe packages"
        command: "npm uninstall stripe @stripe/stripe-react-native"
        verification:
          - type: anti_pattern_check
            file: "package.json"
            forbidden: "@stripe/stripe-react-native"
          - type: anti_pattern_check
            file: "package.json"
            forbidden: '"stripe"'
          - type: command
            run: "grep -rn '@stripe/\\|from.*stripe' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
            expect_exit: 1
            description: "Zero Stripe imports remaining in source"
        depends_on: [P1-01]
        priority: critical

      - id: P1-05
        task: "Uninstall Resend package"
        command: "npm uninstall resend"
        verification:
          - type: anti_pattern_check
            file: "package.json"
            forbidden: '"resend"'
          - type: command
            run: "grep -r 'resend' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
            expect_exit: 1
        depends_on: [P1-01]
        priority: high

      - id: P1-06
        task: "Delete Clerk auth source files"
        files_to_delete:
          - "app/(auth)/sign-in.tsx" # Clerk sign-in screen
          - "app/(auth)/sign-up.tsx" # Clerk sign-up screen
          - "components/OAuth.tsx" # Social auth (Clerk)
          - "app/api/login+api.ts" # Clerk login endpoint
          - "app/api/clerk-role+api.ts" # Clerk role sync endpoint
          - "app/api/unique-email+api.ts" # Email uniqueness (Clerk flow)
        verification:
          - type: file_not_exists
            paths:
              - "app/api/login+api.ts"
              - "app/api/clerk-role+api.ts"
              - "components/OAuth.tsx"
          - type: command
            run: "grep -r 'useAuth\\|useUser\\|ClerkProvider\\|SignedIn\\|SignedOut' . --include='*.tsx' --include='*.ts' --exclude-dir=node_modules"
            expect_exit: 1
            description: "Zero Clerk hook/component usage remaining"
        depends_on: [P1-03]
        priority: critical

      - id: P1-07
        task: "Delete Stripe payment source files"
        files_to_delete:
          - "components/Payment.tsx" # Stripe payment sheet component
          - "app/api/create-payment+api.ts" # Stripe payment intent endpoint
          - "app/api/send-email+api.ts" # Resend email — out of scope MVP
        verification:
          - type: file_not_exists
            paths:
              - "components/Payment.tsx"
              - "app/api/create-payment+api.ts"
              - "app/api/send-email+api.ts"
          - type: command
            run: "grep -r 'StripeProvider\\|useStripe\\|PaymentSheet\\|initPaymentSheet' . --include='*.tsx' --include='*.ts' --exclude-dir=node_modules"
            expect_exit: 1
        depends_on: [P1-04, P1-05]
        priority: critical

      - id: P1-08
        task: "Scan and purge any remaining Clerk/Stripe/Resend references in kept files"
        description: >
          Some GlideX files that are KEPT (not deleted) may still import Clerk or Stripe utilities.
          Find and remove those imports. Common locations: store/index.ts, lib/utils.ts, app/_layout.tsx.
        verification:
          - type: command
            run: "grep -rn '@clerk\\|@stripe\\|from.*stripe\\|from.*resend' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
            expect_exit: 1
            description: "Absolutely zero remaining references across entire codebase"
        depends_on: [P1-06, P1-07]
        priority: critical
        notes: "This is the final sweep. Must be clean before any new code is written."

      - id: P1-09
        task: "Install new Expo app packages"
        command: "npm install h3-js@^4.1.0 @react-native-community/netinfo@^11.3.1 react-native-otp-verify@^1.x zod@^3.23.8"
        verification:
          - type: json_field_check
            file: "package.json"
            fields_exist:
              - "dependencies.h3-js"
              - "dependencies.@react-native-community/netinfo"
              - "dependencies.react-native-otp-verify"
              - "dependencies.zod"
          - type: anti_pattern_check
            file: "package.json"
            forbidden: "expo-sms"
            description: "expo-sms is send-only (cannot read inbound SMS). Use react-native-otp-verify for SMS_RETRIEVER_API."
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
            description: "TypeScript still compiles after package changes"
        depends_on: [P1-03, P1-04, P1-05]
        priority: high

      - id: P1-10
        task: "Install new utils-server packages"
        command: "cd utils-server && npm install ws@^8.18.0 h3-js@^4.1.0 @supabase/supabase-js@^2.45.0 drizzle-orm@^0.42.0 && cd .."
        verification:
          - type: json_field_check
            file: "utils-server/package.json"
            fields_exist:
              - "dependencies.ws"
              - "dependencies.h3-js"
              - "dependencies.@supabase/supabase-js"
              - "dependencies.drizzle-orm"
        depends_on: [P1-01]
        priority: high

      - id: P1-11b
        task: "Create lib/env.ts — Zod-based startup validation of all required environment variables"
        files_to_create:
          - "lib/env.ts"
        required_exports:
          - "validateServerEnv(): void  -- called at top of every API route handler file (or once in a shared init module)"
          - "validateUtilsServerEnv(): void  -- called at utils-server startup"
        implementation_rules:
          - "Use zod z.object({ ... }).parse(process.env) to validate all required env vars."
          - "On missing or invalid var: throw a descriptive Error listing the missing var name and where to get it."
          - "Never import EXPO_PUBLIC_ vars — they are bundled client-side."
          - "Required server vars: DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, BKASH_APP_KEY, BKASH_APP_SECRET, BKASH_CALLBACK_URL, WEBSOCKET_INTERNAL_SECRET, GOOGLE_MAPS_SERVER_API_KEY."
          - "Required utils-server vars: DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, WEBSOCKET_INTERNAL_SECRET, INSTANCE_COUNT (must equal '1')."
        verification:
          - type: file_exists
            path: "lib/env.ts"
          - type: contains
            file: "lib/env.ts"
            patterns:
              - "z.object\\|z.string\\|zod"
               - "DATABASE_URL"
               - "SUPABASE_URL"
               - "BKASH_APP_KEY"
          - type: anti_pattern_check
            file: "lib/env.ts"
            forbidden: "EXPO_PUBLIC_"
            description: "lib/env.ts is server-only — must never reference client-bundled vars"
        depends_on: [P1-08]
        priority: high

      - id: P1-12
        task: "Create lib/logger.ts — project logger (replaces console.log)"
        files_to_create:
          - "lib/logger.ts"
        required_exports:
          - "logger.info(message: string, meta?: Record<string, unknown>): void"
          - "logger.warn(message: string, meta?: Record<string, unknown>): void"
          - "logger.error(message: string, meta?: Record<string, unknown>): void"
          - "logger.debug(message: string, meta?: Record<string, unknown>): void"
        behaviour:
          - "Reads LOG_LEVEL from process.env. Defaults to 'info'."
          - "debug logs suppressed unless LOG_LEVEL=debug"
          - "Each log line is JSON: { level, message, timestamp (UTC ISO), ...meta }"
        verification:
          - type: file_exists
            path: "lib/logger.ts"
          - type: contains
            file: "lib/logger.ts"
            pattern: "LOG_LEVEL"
          - type: anti_pattern_check
            file: "lib/logger.ts"
            forbidden: "console.log"
            description: "Logger must not use console.log internally — use console.error for errors, console.info for others"
          - type: typescript_compiles
            file: "lib/logger.ts"
        depends_on: [P1-09]
        priority: high

      - id: P1-13
        task: "Create environment file templates"
        files_to_create:
          - ".env.local" # Expo app — copy from .env.example, fill manually
          - "utils-server/.env" # utils-server — copy from utils-server/.env.example
        files_to_verify_in_gitignore:
          - ".env.local"
          - "utils-server/.env"
        verification:
          - type: contains
            file: ".gitignore"
            patterns:
              - ".env.local"
              - "utils-server/.env"
          - type: file_not_committed
            paths:
              - ".env.local"
              - "utils-server/.env"
            description: "Secrets must never appear in git history"
        depends_on: [P1-01]
        priority: critical
        notes: "See 11-ENV-VARS.md for the full list of variables required in each file."

      - id: P1-14
        task: "Verify clean compile after all Phase 1 changes"
        description: >
          Run TypeScript compiler, Expo prebuild check, and ESLint.
          All must pass before Phase 2 begins.
        verification:
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
          - type: command
            run: "npx eslint . --ext .ts,.tsx --max-warnings=0"
            expect_exit: 0
          - type: command
            run: "npx expo export --platform android --dev 2>&1 | grep -i 'error' | grep -v 'ExpoGo'"
            expect_exit: 1
            description: "Export dry-run produces zero errors (exit 1 = grep found nothing)"
          - type: command
            run: "grep -rn '@clerk\\|@stripe\\|resend' . --include='*.ts' --include='*.tsx' --exclude-dir=node_modules"
            expect_exit: 1
            description: "Final sweep — must be 100% clean"
        depends_on: [P1-08, P1-09, P1-10, P1-12, P1-13]
        priority: critical

  # ============================================================
  # PHASE 2: Database Schema
  # ============================================================
  - id: 2
    name: "Database Schema"
    blocking: true
    description: >
      Modify existing GlideX tables (users, drivers, rides) and add all new tables.
      All changes go through src/db/schema.ts using Drizzle table builder syntax.
      Never write raw SQL. Run migration after every schema change.
      Hard rules: uuid PKs, created_at/updated_at on every table, soft deletes on user-facing tables,
      all timestamps as timestamptz UTC, all money as integer paisa.
    items:
      - id: P2-01
        task: "Define all pgEnums in src/db/schema.ts before any table definition"
        files_to_modify:
          - "src/db/schema.ts"
        enums_to_add:
          - name: "userRoleEnum"
            values: ["rider", "driver", "admin"]
          - name: "driverStatusEnum"
            values: ["pending", "temporary", "active", "suspended", "rejected"]
          - name: "vehicleTypeEnum"
            values: ["bike_basic", "bike_standard", "bike_plus", "cng", "car_economy", "car_comfort", "car_premium", "car_xl"]
            notes: "Lowercase snake_case. Replaces old UPPERCASE enum. Matches 05-DATA-MODEL.md and 06-API.md global enum."
          - name: "rideStatusEnum"
            values:
              [
                "pending",
                "dispatching",
                "matched",
                "driver_arriving",
                "in_progress",
                "completed",
                "cancelled",
                "expired",
                "no_drivers",
              ]
          - name: "subscriptionStatusEnum"
            values: ["active", "expired", "suspended"]
          - name: "callEventTypeEnum"
            values:
              [
                "deduction",
                "refund",
                "credit",
                "initial_load",
                "expiry_writeoff",
              ]
          - name: "paymentProviderEnum"
            values: ["portpos"]
          - name: "paymentStatusEnum"
            values: ["initiated", "paid", "failed", "callback_pending"]
          - name: "documentTypeEnum"
            values:
              [
                "license_front",
                "license_back",
                "reg_scan_front",
                "reg_scan_back",
                "fitness_scan",
                "tax_token_scan",
                "brta_certificate",
                "vehicle_photo_front",
                "vehicle_photo_left",
                "vehicle_photo_right",
                "vehicle_photo_back",
                "legacy_screenshot",
                "owner_consent_scan",
                "helmet_photo",
                "dashboard_photo",
                "interior_photo",
                "third_row_photo",
              ]
          - name: "documentStatusEnum"
            values: ["pending", "approved", "rejected"]
          - name: "offerOutcomeEnum"
            values: ["delivered", "accepted", "rejected", "expired", "refunded", "filtered"]
            notes: "'filtered' = driver excluded from batch due to min_per_km_bdt floor exceeding ride rate"
          - name: "ownerConsentStatusEnum"
            values: ["pending", "approved", "rejected", "expired"]
          - name: "registrationAreaEnum"
            values:
              [
                "DHAKA_METRO",
                "CHITTAGONG_METRO",
                "KHULNA_METRO",
                "RAJSHAHI_METRO",
                "BARISAL_METRO",
                "SYLHET_METRO",
                "RANGPUR_METRO",
                "MYMENSINGH_METRO",
              ]
          - name: "vehicleClassLetterEnum"
            values:
              [
                "KA", "KHA", "GA", "GHA", "CHA", "CHHA",
                "JA", "JHA", "TA", "THA", "DA", "NA",
                "PA", "BHA", "MA", "DAW", "THAW", "HA", "LA", "EE", "YA",
              ]
        verification:
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "pgEnum.*userRoleEnum"
              - "pgEnum.*driverStatusEnum"
              - "pgEnum.*vehicleTypeEnum"
              - "pgEnum.*rideStatusEnum"
              - "pgEnum.*callEventTypeEnum"
              - "pgEnum.*paymentProviderEnum"
              - "pgEnum.*paymentStatusEnum"
              - "pgEnum.*documentTypeEnum"
              - "pgEnum.*documentStatusEnum"
              - "pgEnum.*offerOutcomeEnum"
              - "pgEnum.*ownerConsentStatusEnum"
              - "pgEnum.*registrationAreaEnum"
              - "pgEnum.*vehicleClassLetterEnum"
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "no_drivers"  # rideStatusEnum
              - "filtered"    # offerOutcomeEnum
              - "license_front"  # documentTypeEnum (17 values, not 4)
              - "brta_certificate"
              - "helmet_photo"
              - "DHAKA_METRO"  # registrationAreaEnum
              - "DAW"  # vehicleClassLetterEnum
          - type: typescript_compiles
            file: "src/db/schema.ts"
        depends_on: []
        priority: critical
        notes: "Enums must be defined before tables that reference them. Export all enums."

      - id: P2-02
        task: "Modify users table — remove clerk_id, add auth_uid, phone, role, device binding"
        files_to_modify:
          - "src/db/schema.ts"
        changes:
          remove_columns:
            - "clerk_id"
          add_columns:
            - "auth_uid: varchar(128) UNIQUE NOT NULL"
            - "phone: varchar(20) UNIQUE NOT NULL  -- E.164 format"
            - "role: userRoleEnum NOT NULL DEFAULT 'rider'"
            - "device_id: varchar(255) NULL  -- for unlimited-package device binding"
            - "device_bound_at: timestamptz NULL"
          keep_columns:
            - "id, name, email, profile_image_url, created_at, updated_at"
        verification:
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "auth_uid"
              - "phone.*varchar"
              - "userRoleEnum"
              - "device_id"
              - "device_bound_at"
          - type: anti_pattern_check
            file: "src/db/schema.ts"
            forbidden: "clerk_id"
        depends_on: [P2-01]
        priority: critical

      - id: P2-03
        task: "Modify drivers table — add vehicle_type, status, license fields, location, H3 cell, consent flags, rating counters"
        files_to_modify:
          - "src/db/schema.ts"
        remove_columns:
          - "car_image_url  -- replaced by vehicles.vehicle_photos via documents table"
          - "car_seats     -- replaced by vehicles.passenger_seats"
        add_columns:
          - "vehicle_type: vehicleTypeEnum NOT NULL"
          - "status: driverStatusEnum NOT NULL DEFAULT 'pending'"
          - "license_number: varchar(100) NULL"
          - "owner_consent_verified: boolean NOT NULL DEFAULT false  -- set true by admin on owner consent approval"
          - "is_legacy_operator: boolean NOT NULL DEFAULT false  -- driver claims prior Uber/Pathao affiliation"
          - "provisional_expires_at: timestamptz NULL  -- temporary activation window end (now() + 30 days)"
          - "vehicle_id: uuid NULL  -- FK → vehicles.id. NULL until vehicle is registered"
          - "acceptance_rate: numeric(5,2) NOT NULL DEFAULT 100.00"
          - "completed_rides_count: integer NOT NULL DEFAULT 0  -- lifetime completed rides; used for CAR_PREMIUM/XL eligibility gate"
          - "rating_count: integer NOT NULL DEFAULT 0  -- total ratings received"
          - "rating_sum: integer NOT NULL DEFAULT 0  -- running sum; average = rating_sum / rating_count"
          - "min_per_km_bdt: integer NULL  -- driver-set minimum per-km rate in paisa. NULL = use system rate"
          - "vehicle_registration_date: date NULL  -- vehicle first BRTA registration date (1-year age check)"
          - "address: text NULL  -- driver residential address"
          - "is_online: boolean NOT NULL DEFAULT false"
          - "last_location_lat: numeric(10,7) NULL"
          - "last_location_lng: numeric(10,7) NULL"
          - "last_location_at: timestamptz NULL"
          - "h3_cell_res9: varchar(20) NULL  -- H3 cell index at resolution 9"
          - "stage2_due_at: timestamptz NULL  -- owner consent re-submission deadline for temporary drivers"
        keep_columns:
          - "id, user_id, rating, created_at, updated_at  -- updated_at must be present per hard rule; verify it exists in GlideX drivers table"
        verification:
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "vehicle_type.*vehicleTypeEnum"
              - "status.*driverStatusEnum"
              - "owner_consent_verified"
              - "is_legacy_operator"
              - "provisional_expires_at"
              - "vehicle_id"
              - "acceptance_rate"
              - "completed_rides_count"
              - "rating_count"
              - "min_per_km_bdt"
              - "is_online"
              - "h3_cell_res9"
              - "last_location_lat"
              - "stage2_due_at"
          - type: anti_pattern_check
            file: "src/db/schema.ts"
            forbidden: "car_image_url|car_seats|is_self_owned|owner_consent_scan_url"
            description: "These stale GlideX/old-design columns must NOT appear on drivers table"
        depends_on: [P2-01]
        priority: critical

      - id: P2-04
        task: "Modify rides table — remove fare_price/payment_status, add fare_breakdown, lifecycle timestamps, ratings"
        files_to_modify:
          - "src/db/schema.ts"
        remove_columns:
          - "fare_price  -- replaced by fare_breakdown jsonb"
          - "payment_status  -- no in-app payment in MVP (cash only)"
        add_columns:
          - "driver_id: uuid NULL FK → drivers.id -- was NOT NULL; nullable until match"
          - "zone_id: uuid NOT NULL FK → zones.id  -- operational zone at request time"
          - "pricing_id: uuid NOT NULL FK → pricing.id  -- pricing row used for fare calculation"
          - "fare_breakdown: jsonb NOT NULL  -- {base_fare_bdt, distance_charge_bdt, wait_charge_bdt, total_bdt, distance_km}"
          - "distance_km: numeric(7,3) NOT NULL  -- extracted from fare_breakdown for query convenience"
          - "vehicle_type: vehicleTypeEnum NOT NULL"
          - "status: rideStatusEnum NOT NULL DEFAULT 'pending'"
          - "scheduled_at: timestamptz NULL  -- NULL = immediate; set = scheduled pickup time"
          - "matched_at: timestamptz NULL"
          - "eta_minutes: smallint NULL  -- estimated driver arrival minutes at match time"
          - "started_at: timestamptz NULL"
          - "completed_at: timestamptz NULL"
          - "rider_rating: smallint NULL  -- 1-5"
          - "driver_rating: smallint NULL  -- 1-5"
          - "cancel_reason: varchar(255) NULL"
          - "cancelled_by: varchar(10) NULL  -- 'rider' | 'driver' | 'system'"
          - "scheduled_dispatched_at: timestamptz NULL  -- set when scheduler triggers dispatch; prevents double-dispatch on restart"
        keep_columns:
          - "id, origin_address, destination_address, origin_latitude, origin_longitude"
          - "destination_latitude, destination_longitude, driver_id, user_id, created_at"
        verification:
          - type: contains
            file: "src/db/schema.ts"
            patterns:
              - "fare_breakdown.*jsonb"
              - "zone_id"
              - "pricing_id"
              - "distance_km"
              - "rideStatusEnum"
              - "scheduled_at"
              - "matched_at"
              - "eta_minutes"
              - "started_at"
              - "completed_at"
              - "rider_rating"
