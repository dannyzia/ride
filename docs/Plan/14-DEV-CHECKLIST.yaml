        ui_requirements:
          - "Bottom sheet rendered when ride:alternatives WebSocket event received."
          - "Title: 'No drivers found for your vehicle type. Try an alternative?'"
          - "List alternative vehicle types with fare estimates (total_bdt/100 ৳)."
          - "Each row: vehicle type name, fare, estimated wait, 'Select' button."
