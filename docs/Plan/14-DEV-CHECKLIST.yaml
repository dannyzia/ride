  # ============================================================
  # PHASE 3: Supabase Auth + dprelay Integration
  # ============================================================
  - id: 3
    name: "Supabase Auth + dprelay Integration"
    blocking: true
    description: >
      Configure Supabase Auth for phone OTP verification and set up dprelay for
      Expo React Native compatibility. Supabase handles OTP generation, delivery,
      and verification internally — no custom Cloud Functions or HMAC secrets needed.
      Test against Supabase local dev (`supabase start`) before marking complete.
    items:
      - id: P3-01
        task: "Install Supabase client packages"
        command: "npm install @supabase/supabase-js@^2.45.0"
        verification:
          - type: json_field_check
            file: "package.json"
            fields_exist:
              - "dependencies.@supabase/supabase-js"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: high

      - id: P3-02
        task: "Create lib/supabaseServer.ts — Supabase server admin initialization"
        files_to_create:
          - "lib/supabaseServer.ts"
        required_exports:
          - "supabaseAdmin: SupabaseClient  -- initialized with SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY"
        implementation_rules:
          - "Read SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY from process.env — never from client env."
          - "Create a single Supabase client instance using createClient()."
          - "This admin client bypasses RLS and is used server-side only for user lookups."
        verification:
          - type: file_exists
            path: "lib/supabaseServer.ts"
          - type: contains
            file: "lib/supabaseServer.ts"
            patterns:
              - "createClient"
              - "SUPABASE_URL"
              - "SUPABASE_SERVICE_ROLE_KEY"
          - type: anti_pattern_check
            file: "lib/supabaseServer.ts"
            forbidden: "EXPO_PUBLIC_"
            description: "Server Supabase client must only use server-side env vars"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P3-01]
        priority: critical

      - id: P3-03
        task: "Create lib/supabase.ts — Supabase client initialization (client-side)"
        files_to_create:
          - "lib/supabase.ts"
        required_exports:
          - "supabase: SupabaseClient  -- initialized with EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY"
        implementation_rules:
          - "Read EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY from process.env."
          - "Create a single Supabase client instance using createClient()."
          - "This client is used in the Expo app for supabase.auth.signInWithOtp() and session management."
        verification:
          - type: file_exists
            path: "lib/supabase.ts"
          - type: contains
            file: "lib/supabase.ts"
            patterns:
              - "createClient"
              - "EXPO_PUBLIC_SUPABASE_URL"
              - "EXPO_PUBLIC_SUPABASE_ANON_KEY"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P3-01]
        priority: critical

      - id: P3-04
        task: "Configure Supabase phone OTP settings in Supabase dashboard"
        description: >
          In the Supabase dashboard (or via supabase config), enable phone auth
          with OTP. Configure SMS provider (Twilio, Vonage, or Supabase built-in).
          Set OTP expiry to 60 seconds. Enable E.164 phone format.
        manual_test_steps:
          - step: "Enable Phone provider in Supabase Auth settings"
            expected: "Phone auth enabled with SMS provider configured"
          - step: "Set OTP expiry to 60 seconds"
            expected: "OTP expires after 60s"
          - step: "Test OTP send to +880 number"
            expected: "SMS received with 6-digit OTP code"
        verification:
          - type: manual_check
            description: "Phone OTP auth is enabled and test SMS is received."
        depends_on: [P3-01]
        priority: critical

      - id: P3-05
        task: "Smoke test — verify OTP flow with Supabase local dev"
        description: >
          Test the complete OTP verification flow using Supabase local dev.
        manual_test_steps:
          - step: "Start Supabase local dev (supabase start)"
            expected: "All Supabase services running locally"
          - step: "Call supabase.auth.signInWithOtp({ phone: '+8801712345678' }) from client"
            expected: "OTP sent. In local dev, OTP is logged to console."
          - step: "Retrieve OTP from console/logs"
            expected: "6-digit code found"
          - step: "Call supabase.auth.verifyOtp({ phone, token, type: 'sms' })"
            expected: "Session established. Access token returned."
          - step: "Verify session is valid"
            expected: "supabase.auth.getUser() returns user with phone claim"
        verification:
          - type: manual_check
            description: "All 5 smoke test steps succeed with no errors."
        depends_on: [P3-02, P3-03, P3-04]
        priority: critical

  # ============================================================
  # PHASE 4: Auth Layer
  # ============================================================
  - id: 4
    name: "Auth Layer — Supabase Phone OTP Auth (App Side)"
    blocking: true
    description: >
      Replace all Clerk auth screens and middleware with the Supabase phone OTP auth flow.
      This phase builds: lib/auth.ts (server-side Supabase JWT verification), two auth screens
      (phone-entry, otp-verify), the /api/register endpoint, and the /api/auth/verify-token endpoint.
      Supabase handles OTP generation, delivery, and verification — no HMAC, no RTDB, no Cloud Functions.
      Phase 3 (Supabase Auth config) must be complete before testing this phase.
    items:
      - id: P4-01
        task: "Create lib/auth.ts — Supabase JWT verification middleware"
        files_to_create:
          - "lib/auth.ts"
        required_exports:
          - "verifySupabaseToken(request: Request): Promise<{ uid: string, phone: string }>"
          - "requireRole(role: 'rider' | 'driver' | 'admin'): middleware"
        implementation_rules:
          - "Import supabaseAdmin from lib/supabaseServer.ts."
          - "verifySupabaseToken: extract Bearer token from Authorization header. Call supabaseAdmin.auth.getUser(token)."
          - "Return 401 with { error: 'unauthorized', message: 'Missing or invalid token' } if absent/invalid."
          - "requireRole: after token verification, query users table for users.auth_uid = uid. Check role column."
          - "Return 403 with { error: 'forbidden', message: 'Insufficient role' } if role mismatch."
          - "Never expose Supabase service role key in error responses."
        verification:
          - type: file_exists
            path: "lib/auth.ts"
          - type: contains
            file: "lib/auth.ts"
            patterns:
              - "getUser"
              - "Authorization.*Bearer\\|Bearer.*Authorization"
              - "requireRole"
              - "auth_uid"
          - type: anti_pattern_check
            file: "lib/auth.ts"
            forbidden: "EXPO_PUBLIC_"
            description: "Auth middleware must only use server-side env vars"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: critical
        notes: "Every protected API route imports verifySupabaseToken from this file. No other auth mechanism is used."

      - id: P4-02
        task: "Create app/(auth)/phone-entry.tsx — phone number input screen"
        files_to_create:
          - "app/(auth)/phone-entry.tsx"
        ui_requirements:
          - "Phone input: +880 prefix fixed. Numeric keyboard. Max 10 digits after prefix."
          - "Role selector: segmented control — 'I am a Rider' | 'I am a Driver'. Stored in component state."
          - "Send Code button: disabled until 10 digits entered. Shows spinner while request in flight."
          - "On button tap: call supabase.auth.signInWithOtp({ phone: '+880...' }). Supabase sends OTP via SMS."
          - "On success: navigate to /otp-verify with params { phone, role }."
          - "Error handling: 429 → toast 'Too many attempts. Wait 60 seconds.'. Network error → toast 'Could not send OTP. Try again.'."
        verification:
          - type: file_exists
            path: "app/(auth)/phone-entry.tsx"
          - type: contains
            file: "app/(auth)/phone-entry.tsx"
            patterns:
              - "signInWithOtp"
              - "otp-verify"
              - "role"
          - type: anti_pattern_check
            file: "app/(auth)/phone-entry.tsx"
            forbidden: "useAuth\\|ClerkProvider\\|SignedIn"
            description: "Zero Clerk hooks"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P4-01]
        priority: critical

      - id: P4-04
        task: "Create app/(auth)/otp-verify.tsx — OTP entry screen (replaces otp-polling)"
        files_to_create:
          - "app/(auth)/otp-verify.tsx"
        ui_requirements:
          - "6-digit OTP input. Numeric keyboard. Auto-submit on 6th digit."
          - "Countdown from 60 seconds (OTP expiry)."
          - "On submit: call supabase.auth.verifyOtp({ phone, token: otp, type: 'sms' })."
          - "On verify success: session is established. Call POST /api/auth/verify-token with the Supabase access token to check if a user record exists."
          - "  If exists (200, exists=true): navigate to role home."
          - "  If not (200, exists=false): navigate to /register with phone and role as navigation params."
          - "On verify error (invalid/expired OTP): show error toast 'Invalid or expired code. Try again.'."
          - "Resend link: disabled for 60s cooldown. Shows countdown. On tap: call supabase.auth.signInWithOtp() again."
          - "Android SMS auto-read: use react-native-otp-verify (installed in P1-09) with SMS_RETRIEVER_API to auto-fill the OTP field. No custom native module needed."
        verification:
          - type: file_exists
            path: "app/(auth)/otp-verify.tsx"
          - type: contains
            file: "app/(auth)/otp-verify.tsx"
            patterns:
              - "verifyOtp"
              - "signInWithOtp"
              - "verify-token"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P4-02]
        priority: critical

      - id: P4-05
        task: "Create app/(auth)/register.tsx — name entry for new users"
        files_to_create:
          - "app/(auth)/register.tsx"
        ui_requirements:
          - "Name input: 2–100 chars. Autofocused."
          - "Read-only role pill showing role from navigation params."
          - "Create Account button: calls POST /api/register with { name, role, vehicle_type? }."
          - "The Supabase session is already established from verifyOtp in the otp-verify screen. The register screen does NOT re-authenticate."
          - "On 201: navigate to role home."
          - "On 409: toast 'This number is already registered. Please log in.' Navigate to phone-entry."
          - "On 401: toast 'Session expired. Start over.' Navigate to phone-entry."
        verification:
          - type: file_exists
            path: "app/(auth)/register.tsx"
          - type: contains
            file: "app/(auth)/register.tsx"
            patterns:
              - "/api/register"
              - "409\\|already.*registered"
        depends_on: [P4-04]
        priority: critical

      - id: P4-06
        task: "Create app/api/register+api.ts — new user registration endpoint"
        files_to_create:
          - "app/api/register+api.ts"
        implementation_rules:
          - "Method: POST only."
          - "Auth: [public] — no token required (user doesn't have one yet). Wait, actually: the user DOES have a Supabase session after verifyOtp. Use verifySupabaseToken to extract uid and phone from the JWT."
          - "VerifySupabaseToken: extract Bearer token from Authorization header. Call supabaseAdmin.auth.getUser(token). Extract uid and phone."
          - "Zod validation: { name: 2–100 chars, role: 'rider'|'driver', vehicle_type: string(optional) }."
          - "Check phone uniqueness: query users WHERE phone = jwt.phone. If exists: 409."
          - "INSERT users row with { auth_uid, phone, name, role }."
          - "If role='driver': also INSERT drivers row with { user_id, vehicle_type, status='pending' }."
          - "All DB writes above (INSERT users, INSERT drivers if applicable) MUST be wrapped in a single db.transaction(). If any step throws, the transaction rolls back — client may safely retry."
          - "Return 201: { user_id, role, next }."
        verification:
          - type: file_exists
            path: "app/api/register+api.ts"
          - type: contains
            file: "app/api/register+api.ts"
            patterns:
              - "zod\\|z.object"
              - "auth_uid"
              - "409"
              - "drivers.*pending\\|status.*pending"
          - type: anti_pattern_check
            file: "app/api/register+api.ts"
            forbidden: "challenge_jwt"
            description: "No challenge JWT — Supabase handles OTP replay protection"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P4-01]
        priority: critical

      - id: P4-07
        task: "Create app/api/auth/verify-token+api.ts — exchange Supabase JWT for user record"
        files_to_create:
          - "app/api/auth/verify-token+api.ts"
        implementation_rules:
          - "Method: POST only."
          - "Auth: [public] — presents token for verification."
          - "Auth: Bearer token from Authorization header (not from body). Extract with: const token = request.headers.get('Authorization')?.split('Bearer ')[1]."
          - "Body: None."
          - "Call supabaseAdmin.auth.getUser(token). Extract uid."
          - "Query users WHERE auth_uid = uid."
          - "If not found: 200 { exists: false }. This distinguishes 'valid token but unregistered user' from 'invalid token' (401)."
          - "Return 200: { user_id, role, phone }."
          - "Called by app after verifyOtp() to confirm user record exists and get role."
        verification:
          - type: file_exists
            path: "app/api/auth/verify-token+api.ts"
          - type: contains
            file: "app/api/auth/verify-token+api.ts"
            patterns:
              - "getUser"
              - "Authorization.*Bearer\\|Bearer.*split"
              - "auth_uid"
              - "404.*user_not_found\\|user_not_found.*404"
              - "role"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P4-01]
        priority: critical

      - id: P4-08
        task: "Update app/_layout.tsx — replace Clerk provider with Supabase auth state listener"
        files_to_modify:
          - "app/_layout.tsx"
        changes:
          - "Remove ClerkProvider wrapper and all Clerk imports."
          - "Add Supabase auth state listener: supabase.auth.onAuthStateChange((event, session) => { ... })."
          - "On session present: call POST /api/auth/verify-token (with Supabase access token in Authorization header) to get role. Store in global state or context."
          - "Route to correct home screen based on role: rider→/(main)/(customer)/, driver→/(main)/(rider)/."
          - "On no session: route to /(auth)/phone-entry."
          - "Show loading spinner while auth state is being determined (prevents flash of wrong screen)."
        verification:
          - type: contains
            file: "app/_layout.tsx"
            patterns:
              - "onAuthStateChange"
              - "verify-token"
              - "POST.*verify-token\\|verify-token.*POST"
              - "phone-entry\\|/(auth)/"
          - type: anti_pattern_check
            file: "app/_layout.tsx"
            forbidden: "ClerkProvider\\|useAuth.*clerk\\|@clerk"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P4-05, P4-07]
        priority: critical

      - id: P4-09
        task: "Protect all existing GlideX API routes with Supabase JWT verification"
        files_to_modify:
          - "app/api/ride/get-all+api.ts"
          - "app/api/unique-number+api.ts"
          - "app/api/ping+api.ts"
          - "app/api/driver/*.ts  (all existing driver routes)"
        implementation_rules:
          - "Add verifySupabaseToken(request) call at the top of every handler that is NOT marked [public]."
          - "ping+api.ts: keep public (health check)."
          - "unique-number+api.ts: public (pre-registration check)."
          - "All ride routes: require auth."
          - "All driver routes: require auth + driver role."
        verification:
          - type: command
            run: "grep -rL 'verifySupabaseToken\\|\\[public\\]' app/api/ --include='*+api.ts' | grep -v 'ping\\|unique-number\\|register\\|verify-token'"
            expect_exit: 1
            description: "Every non-public route contains verifySupabaseToken — empty result = all protected"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P4-01]
        priority: critical

      - id: P4-10
        task: "End-to-end auth smoke test against Supabase local dev"
        manual_test_steps:
          - step: "Fresh install — open app on Android emulator"
            expected: "Navigates to phone-entry screen. No Clerk or auth errors."
          - step: "Enter valid BD phone number, tap Send Code"
            expected: "signInWithOtp called. OTP sent. Navigates to otp-verify."
          - step: "Enter the OTP received via SMS (or from Supabase local dev logs)"
            expected: "verifyOtp succeeds. Session established. POST /api/auth/verify-token called."
          - step: "If new user: navigate to register screen. Enter name. Tap Create Account"
            expected: "POST /api/register returns 201. Navigates to role home."
          - step: "Restart app"
            expected: "onAuthStateChange fires with session. Navigates directly to role home without re-auth."
          - step: "Call any protected route without Authorization header"
            expected: "401 returned immediately."
        verification:
          - type: manual_check
            description: "All 6 steps succeed with no console errors or red screens."
        depends_on: [P4-08, P4-09]
        priority: critical

  # ============================================================
  # PHASE 5: Payment System
  # ============================================================
  - id: 5
    name: "Payment System — PortPos Unified Gateway"
    blocking: true
    description: >
      Build the full package purchase and payment confirmation pipeline.
      Components: lib/portpos.ts (PortPos API client — creates invoices, verifies IPN), package list/purchase/active API routes,
      app/api/payment/portpos/callback+api.ts (IPN + redirect handler), lib/activateSubscription.ts (shared idempotent activation),
      utils-server/compensationWorker.ts (DB-table-backed retry via compensation_queue), and the PaymentWebView component.
      Key invariants: all writes to subscriptions and call_ledger use Drizzle transactions.
      All payment initiations use idempotency keys. Payment credentials are server-side only.
    items:
      - id: P5-01
        task: "Create lib/portpos.ts — PortPos unified payment gateway client"
        files_to_create:
          - "lib/portpos.ts"
        required_exports:
          - "portposClient.createInvoice(params: { amount: number, currency: 'BDT', idempotencyKey: string, callbackUrl: string, paymentMethod: string }): Promise<{ invoice_id: string, payment_url: string }>"
          - "portposClient.verifyPayment(invoiceId: string): Promise<{ status: string, transaction_id: string }>"
          - "portposClient.queryInvoice(invoiceId: string): Promise<{ status: string, amount: number }>"
        implementation_rules:
          - "Read PORTPOS_API_KEY, PORTPOS_BASE_URL, PORTPOS_CALLBACK_URL from process.env."
          - "Token caching: cache access token in module scope. Refresh 60s before expiry."
          - "All amounts: integer paisa passed in. Convert to taka (divide by 100) before sending to PortPos."
          - "createInvoice: POST to {PORTPOS_BASE_URL}/invoices. Include idempotencyKey as reference. Supports bKash, Nagad, Rocket, and card methods."
          - "verifyPayment: GET to {PORTPOS_BASE_URL}/invoices/{invoiceId}/verify."
          - "On token expiry (mid-request 401): refresh token once and retry. Do not retry indefinitely."
          - "Log every PortPos API call with logger.info — include invoice_id and response status. Never log secrets."
        verification:
          - type: file_exists
            path: "lib/portpos.ts"
          - type: contains
            file: "lib/portpos.ts"
            patterns:
              - "createInvoice"
              - "verifyPayment"
              - "queryInvoice"
              - "idempotencyKey"
              - "PORTPOS_API_KEY"
          - type: anti_pattern_check
            file: "lib/portpos.ts"
            forbidden: "EXPO_PUBLIC_\\|console.log"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: critical

      - id: P5-02
        task: "Create inert lib/bkash.ts and lib/nagad.ts — legacy payment client stubs (not active)"
        files_to_create:
          - "lib/bkash.ts"
          - "lib/nagad.ts"
        implementation_rules:
          - "These are INERT FALLBACK files only. PortPos handles all payment methods."
          - "Export stub functions that throw 'Use lib/portpos.ts instead' errors."
          - "Kept for backwards compatibility with any residual GlideX imports."
          - "See TD-06 in 18-KNOWN-ISSUES.md: superseded by PortPos unified gateway."
        verification:
          - type: file_exists
            path: "lib/bkash.ts"
          - type: file_exists
            path: "lib/nagad.ts"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: low
        notes: "Inert fallback files. Not used in production. PortPos is the sole payment gateway."

      - id: P5-03
        task: "Create lib/activateSubscription.ts — shared, idempotent subscription activation (do this BEFORE callback handlers)"
        files_to_create:
          - "lib/activateSubscription.ts"
        required_exports:
          - "activateSubscription(db: DrizzleDb, paymentEventId: string): Promise<{ subscriptionId: string }>"
        implementation_rules:
          - "Contains the Drizzle transaction that both callers use: PortPos callback, compensation worker."
          - "Idempotent: if payment_events.subscription_id is already set, return existing subscription_id without re-running."
          - "Steps (all in db.transaction()): (1) Verify payment_events.amount_bdt = packages.price_bdt. (2) INSERT subscriptions { daily_reset_at = nextBdtMidnightUtc(), total_deductions=0, is_trial from package }. (3) INSERT call_ledger event_type='initial_load', delta=call_count, balance_after=call_count. (4) UPDATE payment_events status='paid', confirmed_at=now(), subscription_id=new_id. (5) COMMIT."
          - "If subscription has credit vouchers (status='active'): apply them inside the same transaction → UPDATE calls_remaining += voucher.calls, UPDATE credit_vouchers status='redeemed'."
          - "call_ledger write here is NOT a deduction — it is the initial_load write. Only deduction writes are forbidden outside heartbeat.ts."
        verification:
          - type: file_exists
            path: "lib/activateSubscription.ts"
          - type: contains
            file: "lib/activateSubscription.ts"
            patterns:
              - "activateSubscription"
              - "db.transaction"
              - "initial_load"
              - "idempotent\\|subscription_id.*null\\|already.*activated"
              - "total_deductions"
              - "is_trial"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P2-06, P2-07, P2-07d]
        priority: critical
        notes: >
          This replaces P5-10 (which originally appeared later). Moving it here ensures callback handlers
          (P5-07, P5-08) and the compensation worker (P5-09) all call this shared function.
          DO NOT create lib/compensationQueue.ts as an in-memory array — compensation retries
          are handled via the compensation_queue DB table (P2-07i) queried by compensationWorker.ts.

      - id: P5-04
        task: "Create app/api/package/list+api.ts — list active purchasable packages"
        files_to_create:
          - "app/api/package/list+api.ts"
        implementation_rules:
          - "Method: GET."
          - "Auth: required (any authenticated user)."
          - "Lookup the caller's vehicle_type from drivers (join via users.auth_uid). May be null if no driver record yet."
          - "Query: SELECT { id, name, call_count, duration_days, price_bdt, daily_cap, is_trial, vehicle_type } FROM packages WHERE is_active = true AND deleted_at IS NULL AND (vehicle_type IS NULL OR vehicle_type = $driver_vehicle_type) ORDER BY is_trial DESC, price_bdt ASC. If driver record missing, only universal (vehicle_type IS NULL) packages are returned."
          - "Return 200: { packages: Array<{ id, name, call_count, duration_days, price_bdt, is_trial, daily_cap, vehicle_type }> }. For finite packages, daily_cap is null. For unlimited packages, daily_cap is the package's daily_cap value (default 200). vehicle_type is null for universal packages or one of the 8 vehicleTypeEnum values."
          - "Trial packages sorted first in the result."
          - "price_bdt is in paisa — do NOT convert here. Let the client display layer convert."
          - "F15-API-10: vehicle_type filtering is mandatory. A driver must never see packages scoped to other vehicle types."
        verification:
          - type: file_exists
            path: "app/api/package/list+api.ts"
          - type: contains
            file: "app/api/package/list+api.ts"
            patterns:
              - "verifySupabaseToken"
              - "is_active.*true\\|is_active = true"
              - "is_trial"
              - "daily_cap"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P5-01]
        priority: critical

      - id: P5-05
        task: "Create app/api/package/purchase+api.ts — initiate package purchase"
        files_to_create:
          - "app/api/package/purchase+api.ts"
        implementation_rules:
          - "Method: POST."
          - "Auth: required (driver role only)."
          - "Zod body: { package_id: uuid, provider: 'portpos' }. Do NOT accept idempotency_key in body."
          - "Header: Idempotency-Key must be present (uuid v4). Reject if missing."
          - "Check driver status: must be 'active' or 'temporary'. Return 403 if not."
          - "F15-API-10: Vehicle-type enforcement. After loading the package, if pkg.vehicle_type IS NOT NULL AND pkg.vehicle_type != driver.vehicle_type → return 403 { error: 'vehicle_type_mismatch', message: 'This package is only available for <vehicle_type> drivers' }."
          - "Check for existing active subscription: if driver already has status='active' subscription, return 409."
          - "Trial package check: join through subscriptions -> packages. If packages.is_trial=true AND driver has existing trial subscription -> return 409 { error: 'trial_already_used' }."
          - "INSERT payment_events with { driver_id, package_id, idempotency_key, provider, amount_bdt, status='initiated' }."
          - "  ON CONFLICT (idempotency_key): return existing payment_events row (idempotent)."
          - "Call portposClient.createInvoice() to create payment. Pass amount, reference (idempotencyKey), redirectUrl, ipnUrl."
          - "Update payment_events.status = 'initiated' → stays 'initiated' until callback."
          - "Return 200: { payment_url, payment_event_id }."
        response_codes:
          200: "Payment URL returned — client opens in WebView"
          400: "Invalid body"
          403: "Driver status not active/temporary; OR vehicle_type_mismatch (package scoped to a different vehicle type)"
          409: "Active subscription exists OR trial already used"
          422: "Package not found or inactive"
          502: "PortPos API error"
        verification:
          - type: file_exists
            path: "app/api/package/purchase+api.ts"
          - type: contains
            file: "app/api/package/purchase+api.ts"
            patterns:
              - "verifySupabaseToken"
              - "idempotency_key"
              - "ON CONFLICT\\|onConflict\\|upsert"
              - "provider.*portpos"
              - "payment_url"
              - "trial_already_used"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P5-01, P5-02, P5-03, P5-04]
        priority: critical

      - id: P5-06
        task: "Create app/api/package/active+api.ts — get driver's active subscription (polled post-payment)"
        files_to_create:
          - "app/api/package/active+api.ts"
        implementation_rules:
          - "Method: GET."
          - "Auth: required (driver)."
          - "Query: SELECT subscriptions.*, packages.name, packages.call_count FROM subscriptions JOIN packages ON ... WHERE driver_id = {uid} AND status = 'active' AND expires_at > now() ORDER BY purchased_at DESC LIMIT 1."
          - "Return 200: { subscription: { id, package_id, package_name, calls_remaining, daily_calls_used, daily_reset_at, status, purchased_at, expires_at, is_trial } } or { subscription: null } if none. Matches 06-API.md GET /api/package/active response schema."
          - "This endpoint is polled by the client every 3s after the payment WebView closes."
        verification:
          - type: file_exists
            path: "app/api/package/active+api.ts"
          - type: contains
            file: "app/api/package/active+api.ts"
            patterns:
              - "verifySupabaseToken"
              - "status.*active\\|active.*status"
              - "expires_at"
              - "calls_remaining"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P5-04]
        priority: critical

      - id: P5-07
        task: "Create app/api/payment/portpos/callback+api.ts — PortPos payment callback handler"
        files_to_create:
          - "app/api/payment/portpos/callback+api.ts"
        implementation_rules:
          - "Method: GET. [public] — called by PortPos servers, not the app."
          - "Parse query params: { invoice_id, status, reference (= idempotency_key) }."
          - "Verify with PortPos API: call portposClient.verifyPayment(invoice_id) to confirm payment status. Do not trust query params alone."
          - "If status != 'completed': update payment_events.status='failed'. Return 200."
          - "If 'completed':"
          - "  1. Lookup payment_events by idempotency_key. If not found: log warn, return 200."
          - "  2. Call activateSubscription(db, payment_event_id) from lib/activateSubscription.ts. This handles: idempotency (subscription_id already set → no-op), INSERT subscriptions, INSERT call_ledger initial_load, UPDATE payment_events — all in one Drizzle transaction. Do NOT duplicate these steps inline."
          - "  3. If activateSubscription throws: INSERT a row into compensation_queue DB table { payment_event_id, status='pending', next_retry_at=now(), attempt_count=0 }. Log error. Return 200."
          - "Always return 200 to PortPos — a non-200 causes PortPos to retry indefinitely."
        verification:
          - type: file_exists
            path: "app/api/payment/portpos/callback+api.ts"
          - type: contains
            file: "app/api/payment/portpos/callback+api.ts"
            patterns:
              - "verifyPayment"
              - "activateSubscription"
              - "compensation_queue"
          - type: anti_pattern_check
            file: "app/api/payment/portpos/callback+api.ts"
            forbidden: "INSERT.*subscriptions|INSERT.*call_ledger"
            description: "Callback must NOT inline activation — must delegate to activateSubscription()"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P5-01, P5-03, P5-05]
        priority: critical
        notes: "This is the most critical endpoint in the payment pipeline. Every path must return 200 to PortPos. All DB writes delegate to activateSubscription() from lib/activateSubscription.ts. Failures are persisted to the compensation_queue DB table for automatic retry by compensationWorker.ts."

      - id: P5-08
        task: "Create inert callback stubs for legacy bKash and Nagad paths (not active)"
        files_to_create:
          - "app/api/payment/bkash/callback+api.ts"
          - "app/api/payment/nagad/callback+api.ts"
        implementation_rules:
          - "These are INERT FALLBACK files. PortPos handles all payments via P5-07."
          - "Both return 200 immediately with logger.warn('Legacy payment callback received — use PortPos instead')."
          - "Kept for backwards compatibility with any residual GlideX routes."
        verification:
          - type: file_exists
            path: "app/api/payment/bkash/callback+api.ts"
          - type: file_exists
            path: "app/api/payment/nagad/callback+api.ts"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: []
        priority: low
        notes: "Inert fallback. Not used in production. PortPos is the sole payment gateway."

      - id: P5-09
        task: "Create utils-server/compensationWorker.ts — periodic retry for failed activations"
        files_to_create:
          - "utils-server/compensationWorker.ts"
        implementation_rules:
          - "Export startCompensationWorker(): void — called once at utils-server startup."
          - "Run setInterval every 30 seconds."
          - "Each tick: query compensation_queue DB table WHERE status='pending' AND next_retry_at <= now() LIMIT 10. Process each row."
          - "For each compensation_queue row:"
          - "  1. Fetch payment_events row by payment_event_id. If subscription_id already set: UPDATE compensation_queue SET status='completed'. Skip."
          - "  2. Call activateSubscription(db, payment_event_id)."
          - "  3. If activation succeeds: UPDATE compensation_queue SET status='completed'. Log logger.info compensation success."
          - "  4. If activation fails: INCREMENT attempt_count. If attempt_count >= max_attempts: SET status='failed', trigger admin alert (logger.error MAX_RETRIES_EXCEEDED). Else: SET next_retry_at = now() + exponential_backoff(attempt_count)."
          - "⚠ Orphan Recovery is also handled by scheduler.ts item (11) (callback_pending recovery every 10 min — see 12-FOLDER-STRUCTURE.md). To avoid double-processing: compensationWorker should SKIP callback_pending rows that already have a pending compensation_queue row. Only the scheduler's callback_pending recovery should directly call activateSubscription for payment_events without a compensation_queue entry. The compensationWorker handles rows that already have a compensation_queue entry."
        verification:
          - type: file_exists
            path: "utils-server/compensationWorker.ts"
          - type: contains
            file: "utils-server/compensationWorker.ts"
            patterns:
              - "startCompensationWorker"
              - "setInterval"
              - "compensation_queue"  # must reference DB table, not in-memory array
              - "attempt_count\\|max_attempts"
              - "MAX_RETRIES\\|max.*retries\\|MAX RETRIES"
              - "activateSubscription\\|db.transaction"
          - type: command
            run: "cd utils-server && npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P5-03, P5-07]
        priority: critical

