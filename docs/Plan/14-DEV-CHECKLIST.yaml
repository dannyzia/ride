              - "no_drivers"
              - "alternatives_available"
          - type: command
            run: "npx tsc --noEmit"
            expect_exit: 0
        depends_on: [P9-ALT-01, P6-10]
        priority: high

      - id: P9-ALT-03
        task: "Add WebSocket ride:alternatives event to utils-server"
        files_to_modify:
          - "utils-server/types.ts"
          - "utils-server/dispatch.ts"
        implementation_rules:
          - "Add to OutboundMessage union: { type: 'ride:alternatives', ride_id: string, alternatives: Array<{ vehicle_type, fare_breakdown }> }."
          - "Emit ride:alternatives to rider when all dispatch batches exhausted and allow_downgrade=true on the ride."
          - "Rider can respond with ride:accept-alternative { ride_id, vehicle_type } to re-request with the chosen type."
