  - id: "P1-013-SOS-ALERTS-ACK"
    route_path: "app/api/admin/sos-alerts/[id]/ack+api.ts"
    action: create
    priority: P1
    note: >
      GAP: GET /api/admin/sos-alerts + admin/sos-alerts.tsx screen exist (view alerts).
      But there's NO acknowledge endpoint — admin can see alerts but can't mark them
      resolved. Create POST /api/admin/sos-alerts/[id]/ack that sets status='acknowledged'
      and acknowledged_by + acknowledged_at.
    code_template: |
      import { db } from '@/src/db';
      import { sosAlerts } from '@/src/db/schema';
      import { eq } from 'drizzle-orm';
      import { requireRole } from '@/lib/auth';
      import { logger } from '@/lib/logger';

      export async function POST(request: Request, { id }: { id: string }) {
        try {
          const { dbUser } = await requireRole('admin')(request);

          const [updated] = await db.update(sosAlerts)
            .set({
              status: 'acknowledged',
              acknowledged_by: dbUser.id,
              acknowledged_at: new Date(),
            })
            .where(eq(sosAlerts.id, id))
            .returning();

          if (!updated) return Response.json({ error: 'not_found' }, { status: 404 });

          logger.info('[admin] SOS alert acknowledged', { id, by: dbUser.id });
          return Response.json({ success: true, alert: updated });
        } catch (err: any) {
          if (err.status === 401) return Response.json({ error: 'unauthorized' }, { status: 401 });
          logger.error('[admin/sos-alerts/ack] error', err);
          return Response.json({ error: 'internal_error' }, { status: 500 });
        }
      }
    extra_note: >
      ALSO: add an "Acknowledge" button to app/admin/sos-alerts.tsx that calls
      this endpoint.

      SCHEMA CHANGE REQUIRED: The sos_alerts table (src/db/schema.ts:884) currently
      has columns: id, user_id, role, latitude, longitude, message, contacts_notified,
      created_at. It is MISSING the columns needed by this ack endpoint:
        status varchar NOT NULL DEFAULT 'open'
        acknowledged_by uuid REFERENCES users(id)
        acknowledged_at timestamptz
      Add these 3 columns to the sosAlerts pgTable definition in schema.ts, then run:
        npx drizzle-kit generate
        npx drizzle-kit push
    verification:
      - { type: file_exists, path: "app/api/admin/sos-alerts/[id]/ack+api.ts" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

