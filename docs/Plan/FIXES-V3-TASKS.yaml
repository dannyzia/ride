  - id: "P0-002-DRIVER-PUSH-TOKEN"
    route_path: "app/(auth)/driver-notifications-permission.tsx"
    action: create
    priority: P0
    note: >
      CRITICAL: Drivers have ZERO push notification registration. The screen is a
      39-line stub that just navigates. The rider version (notifications-permission.tsx)
      has the exact registerPushToken() function to copy. Replace the entire file with
      a driver variant that registers the push token then navigates to select-active-vehicle.

      CRITICAL ADDITIONAL ISSUE: driver-notifications-permission.tsx is currently
      UNREACHABLE during normal driver registration. register.tsx:72 sends drivers
      directly to /(main)/(rider), bypassing the entire driver-enable-location →
      driver-notifications-permission chain. Fixing the screen alone does NOT solve
      the push token problem.

      You MUST ALSO add push token registration to the driver home screen. After P1-001
      moves DriverHome to (tabs)/index.tsx, add a registerPushToken() call in its
      useEffect on mount (one-time, idempotent). Copy the registerPushToken function
      from the code_template below into DriverHome (or import it from a shared lib).
      Call it once when wsConnected first becomes true, so the token is registered
      after the driver is authenticated.

      ALTERNATIVELY: Add a useEffect in app/(main)/(rider)/_layout.tsx that registers
      the push token once after the DriverStatusGuard passes (driver is active/temporary).
    code_template: |
      import { View, Text, TouchableOpacity, Platform } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { useState } from "react";
      import { router } from "expo-router";
      import * as Notifications from "expo-notifications";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";

      const API_URL = process.env.EXPO_PUBLIC_SERVER_URL ?? "";

      async function registerPushToken() {
        try {
          const { status: existingStatus } = await Notifications.getPermissionsAsync();
          let finalStatus = existingStatus;
          if (existingStatus !== "granted") {
            const { status } = await Notifications.requestPermissionsAsync();
            finalStatus = status;
          }
          if (finalStatus !== "granted") return;

          const tokenData = await Notifications.getExpoPushTokenAsync();
          const pushToken = tokenData.data;
          const platform = Platform.OS === "ios" ? "ios" : "android";

          const { data: { session } } = await supabase.auth.getSession();
          if (!session?.access_token) return;

          await fetch(`${API_URL}/api/user/device`, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ push_token: pushToken, platform, device_id: pushToken }),
          });
        } catch (e) {
          logger.warn("[push] driver token registration failed", e);
        }
      }

      export default function DriverNotificationsPermission() {
        const [busy, setBusy] = useState(false);

        const allow = async () => {
          setBusy(true);
          await registerPushToken();
          router.replace("/(main)/(rider)/select-active-vehicle");
        };

        const skip = () => router.replace("/(main)/(rider)/select-active-vehicle");

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark items-center justify-center px-[24px]">
            <View className="flex-1 items-center justify-center">
              <View className="w-24 h-24 rounded-full bg-goAccentLight items-center justify-center mb-8">
                <Text className="text-[40px]">🔔</Text>
              </View>
              <Text className="text-[24px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-3 text-center">Allow Notifications</Text>
              <Text className="text-[16px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark text-center">Ride requests, payouts, and promos delivered instantly. You can change this anytime in settings.</Text>
            </View>
            <View className="flex-row w-full pb-[40px]">
              <TouchableOpacity className="flex-1 border border-goBorderLight dark:border-goBorderDark rounded-full py-[16px] items-center mr-2" onPress={skip}>
                <Text className="text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Not Now</Text>
              </TouchableOpacity>
              <TouchableOpacity className="flex-1 bg-goPrimary rounded-full py-[16px] items-center ml-2" onPress={allow} disabled={busy}>
                <Text className="text-[18px] font-JakartaBold text-goWhite">{busy ? "Enabling..." : "Allow"}</Text>
              </TouchableOpacity>
            </View>
          </SafeAreaView>
        );
      }
    verification:
      - { type: command, run: "npx tsc --noEmit", expect: 0 }
      - "Manual: register as new driver → verify user_devices row created in DB"

