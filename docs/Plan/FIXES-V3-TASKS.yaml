  - id: "P2-002B-SURGE-PIPELINE-FIX"
    route_path: "schema.ts, scheduler.ts, lib/surge.ts, lib/fareCalc.ts, heartbeat, 3 API routes"
    action: audit_and_fix
    priority: P2
    note: >
      Surge pricing is non-functional end-to-end. 3 root causes:

      B2 TYPE MISMATCH: drivers.zone_id is varchar(20) but zones.id is uuid.
      The supply query (scheduler.ts:673) compares varchar=uuid → no match → supply always 0.
      rides.surge_zone_id is varchar(20) → writing a 36-char UUID truncates or fails.

      G2 NOT WIRED: lib/surge.ts applySurge() is never imported by lib/fareCalc.ts.
      FareBreakdown interface has no surge fields. calculateFare has no zoneId param.

      B3 CROSS-PROCESS (HIDDEN — you didn't catch this one):
      lib/surge.ts uses an in-process Map (surgeMap) to cache multipliers.
      The scheduler runs in utils-server (separate Node.js process).
      The fare calculator runs in the Expo API server (different process).
      Each process gets its OWN Map instance — they do NOT share memory.
      The scheduler writes multipliers to its Map; the API server's Map is always empty.
      Even after fixing B2+G2, surge would still be non-functional without a shared store.
      FIX: Replace the in-process Map with a surge_current database table both processes share.

    fixes:
      - note: >
          CHANGE 1 — src/db/schema.ts: Fix 2 column types + add surge_current table.

          Line 287 — drivers.zone_id: change varchar to uuid:
            BEFORE: zone_id: varchar("zone_id", { length: 20 }),
            AFTER:  zone_id: uuid("zone_id"),

          Line 571 — rides.surge_zone_id: change varchar to uuid:
            BEFORE: surge_zone_id: varchar("surge_zone_id", { length: 20 }),
            AFTER:  surge_zone_id: uuid("surge_zone_id"),

          Add new table after the zones table definition (~line 776):
            export const surgeCurrent = pgTable("surge_current", {
              zone_id: uuid("zone_id").primaryKey().references(() => zones.id),
              multiplier: numeric("multiplier", { precision: 4, scale: 2 }).notNull().default("1.0"),
              demand_count: integer("demand_count").notNull().default(0),
              supply_count: integer("supply_count").notNull().default(0),
              updated_at: timestamptz("updated_at").notNull().defaultNow(),
            });

      - note: >
          CHANGE 2 — utils-server/heartbeat.ts: Backfill drivers.zone_id on location update.
          The app has a zones_one_active unique index — only ONE zone active at a time.
          All online drivers belong to that zone.
          Before the existing driver UPDATE, fetch the active zone:
            const [activeZone] = await db.select({ id: zones.id }).from(zones)
              .where(eq(zones.is_active, true)).limit(1);
          Add to the UPDATE .set() call:
            zone_id: activeZone?.id ?? null,

      - note: >
          CHANGE 3 — utils-server/scheduler.ts: Replace lines 680-685.

          REMOVE these 2 lines:
            await db.update(rides).set({ surge_multiplier: multiplier as any, surge_zone_id: zone.id })
              .where(eq(rides.zone_id, zone.id));
            setSurgeMultiplier(zone.id, multiplier);

          REPLACE with a surge_current UPSERT:
            await db.insert(surgeCurrent).values({
              zone_id: zone.id,
              multiplier: multiplier.toString(),
              demand_count: demand?.count ?? 0,
              supply_count: supply?.count ?? 0,
              updated_at: new Date(),
            }).onConflictDoUpdate({
              target: surgeCurrent.zone_id,
              set: {
                multiplier: multiplier.toString(),
                demand_count: demand?.count ?? 0,
                supply_count: supply?.count ?? 0,
                updated_at: new Date(),
              },
            });

          REMOVE line 24: import { setSurgeMultiplier } from "../lib/surge";
          ADD import for surgeCurrent from the schema (same import path as zones).

      - note: >
          CHANGE 4 — lib/surge.ts: Rewrite the ENTIRE file as a pure function.
          Remove the Map, setSurgeMultiplier, and getSurgeMultiplier.
          The new file is just:

            export function applySurge(totalBdt: number, surgeMultiplier: number) {
              const surgeFeeBdt = surgeMultiplier > 1.0
                ? Math.round(totalBdt * (surgeMultiplier - 1.0))
                : 0;
              return {
                multiplier: surgeMultiplier,
                surgeFeeBdt,
                totalWithSurge: totalBdt + surgeFeeBdt,
              };
            }

          No Map. No imports. No side effects. Pure function.
          The caller (API route) looks up the multiplier from surge_current table.

      - note: >
          CHANGE 5 — lib/fareCalc.ts: Add 2 fields to FareBreakdown interface.
          After line 36 (ride_time_min: number;), add:
            surge_multiplier: number;
            surge_fee_bdt: number;

          calculateFare() stays UNCHANGED — no zoneId parameter, stays synchronous.
          The API route applies surge AFTER calling calculateFare (see Change 6).

      - note: >
          CHANGE 6 — API routes (estimate, request, complete): Look up surge from
          surge_current table and apply after calculateFare.

          After `const breakdown = calculateFare(...)`, add:
            // Look up active zone
            const [zone] = await db.select({ id: zones.id }).from(zones)
              .where(eq(zones.is_active, true)).limit(1);
            // Look up surge multiplier (5-min staleness check)
            let surgeMultiplier = 1.0;
            if (zone) {
              const [sr] = await db.select().from(surgeCurrent)
                .where(eq(surgeCurrent.zone_id, zone.id)).limit(1);
              if (sr && Date.now() - new Date(sr.updated_at).getTime() < 300_000)
                surgeMultiplier = Number(sr.multiplier);
            }
            // Apply surge to fare
            const surge = applySurge(breakdown.total_bdt, surgeMultiplier);
            breakdown.total_bdt = surge.totalWithSurge;
            breakdown.surge_multiplier = surge.multiplier;
            breakdown.surge_fee_bdt = surge.surgeFeeBdt;
            // Recompute commission on surged total
            const commissionPct = pricing.platform_commission_percent ?? 0;
            if (commissionPct > 0) {
              breakdown.platform_commission_bdt = Math.floor(breakdown.total_bdt * commissionPct / 100);
              breakdown.driver_net_bdt = breakdown.total_bdt - breakdown.platform_commission_bdt;
            }

          Add imports: import { applySurge } from "@/lib/surge";
          Add imports: import { surgeCurrent, zones } from "@/src/db/schema";

          For ride/request: also store surge_multiplier + surge_zone_id on the ride record
          (snapshot at creation time — the multiplier won't change during the ride).
          For ride/[id]/complete: use the ride's stored surge_multiplier (no new lookup).

          Files to modify:
          - app/api/ride/estimate+api.ts
          - app/api/ride/request+api.ts
          - app/api/ride/[id]/complete+api.ts

      - note: >
          CHANGE 7 — Migration. After all schema changes:
            npx drizzle-kit generate
            npx drizzle-kit push

    verification:
