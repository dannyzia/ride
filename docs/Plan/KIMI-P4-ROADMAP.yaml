    - "[ ] npx drizzle-kit generate + push (ONE migration for ALL new tables)"
    - "[ ] Post-migration: run trigger SQL from REFERENCE.md"
    - "[ ] Post-migration: run seed SQL (tax rates + chart of accounts) from REFERENCE.md"
    - "[ ] Post-migration: run GRANT statements from REFERENCE.md"
