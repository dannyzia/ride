    code_template: |
      import { useState, useEffect, useCallback } from "react";
      import { View, Text, TouchableOpacity, ActivityIndicator, Alert } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";

      interface InsuranceData {
        is_active: boolean;
        provider: string;
        policy_number: string;
        coverage_type: string;
        expires_at: string | null;
        coverage_details: string[];
      }

      export default function Insurance() {
        const [insurance, setInsurance] = useState<InsuranceData | null>(null);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState("");

        const fetchInsurance = useCallback(async () => {
          setLoading(true);
          setError("");
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const token = session?.access_token;
            if (!token) { setError("Not authenticated"); return; }
            const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/driver/insurance`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (!res.ok) { setError("Failed to load insurance details"); return; }
            const data = await res.json();
            setInsurance(data);
          } catch (err: any) {
            setError(err?.message || "Network error");
            logger.error("Insurance fetch failed", err);
          } finally {
            setLoading(false);
          }
        }, []);

        useEffect(() => { fetchInsurance(); }, [fetchInsurance]);

        const handleViewPolicy = () => {
          Alert.alert(
            insurance?.provider ?? "Insurance Provider",
            `Policy: ${insurance?.policy_number ?? "N/A"}\nCoverage: ${insurance?.coverage_type ?? "N/A"}\nExpires: ${insurance?.expires_at ? new Date(insurance.expires_at).toLocaleDateString("en-GB") : "N/A"}`,
          );
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Insurance</Text>
              <View className="w-[50px]" />
            </View>
            <View className="flex-1 px-[24px] items-center justify-center">
              {loading ? (
                <ActivityIndicator size="small" color="#0CC25F" />
              ) : error ? (
                <Text className="text-[14px] font-Jakarta text-goDanger">{error}</Text>
              ) : (
                <>
                  <View className={`w-24 h-24 rounded-full items-center justify-center mb-6 ${insurance?.is_active ? "bg-goAccentLight dark:bg-goPrimary/20" : "bg-goDangerLight dark:bg-goDanger/20"}`}>
                    <Text className="text-[48px]">{insurance?.is_active ? "🛡️" : "⚠️"}</Text>
                  </View>
                  <Text className="text-[20px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-1">
                    {insurance?.is_active ? "Coverage Active" : "No Active Coverage"}
                  </Text>
                  <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark text-center mb-2">
                    {insurance?.provider ? `${insurance.provider} · ${insurance.coverage_type}` : "No insurance policy found."}
                  </Text>
                  {insurance?.coverage_details && insurance.coverage_details.length > 0 && (
                    <View className="w-full bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[12px] p-[16px] mb-6">
                      {insurance.coverage_details.map((detail, i) => (
                        <Text key={i} className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark py-1">
                          • {detail}
                        </Text>
                      ))}
                    </View>
                  )}
                  <TouchableOpacity
                    className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-full py-[14px] px-[32px]"
                    onPress={handleViewPolicy}
                  >
                    <Text className="text-[15px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">View Policy Details</Text>
                  </TouchableOpacity>
                </>
              )}
            </View>
          </SafeAreaView>
        );
      }
    verification:
