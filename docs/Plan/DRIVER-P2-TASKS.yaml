                      </Text>
                    </>
                  )}
                  <TouchableOpacity
                    className={`rounded-full w-full py-[16px] items-center ${withdrawing || balancePaisa < 10000 ? "bg-goBorderDark" : "bg-goPrimary"}`}
                    onPress={handleWithdraw}
