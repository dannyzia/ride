# =============================================================================
# DRIVER-P2-TASKS.yaml v4.0 — ZERO-ASSUMPTION AGENT SPEC
# =============================================================================
# READ THE INSTRUCTIONS IN DRIVER-P0-TASKS.yaml v4.0 FIRST.
# The same global_rules apply. Key differences for P2:
#   - P2 screens are secondary driver flows (wallet, profile, vehicles, documents)
#   - Wallet and Profile live under app/(main)/(rider)/(tabs)/
#   - Other P2 screens push as stack screens from those tabs
#   - useDriverStore from @/store/useDriverStore (SEPARATE FILE) for driver data
#   - ALL amounts are INTEGER PAISA — display with {(amt/100).toFixed(0)}
# =============================================================================
version: "4.0"
project: Ride
role: driver
priority_class: P2
total_tasks: 10

# =============================================================================
# DRIVER-SPECIFIC GLOBAL RULES
# =============================================================================
global_notes:
  font_rule: "font-JakartaBold (headings) and font-Jakarta (body). Do NOT use font-[Urbanist] or font-inter."
  button_rule: "CustomButton default bgVariant='primary' renders BLUE (bg-goBlue). For GREEN use bgVariant='success'. Uses rounded-full."
  money: "ALL amounts are INTEGER PAISA. Display: {(amt/100).toFixed(0)}."
  stores: >
    CRITICAL — TWO SEPARATE useDriverStore instances exist with DIFFERENT shapes:
    1. @/store/useDriverStore.ts (SEPARATE FILE, default export): has {driver, isOnline, activeSubscription, wsConnected}
       → USE THIS FOR: driver home screen (app/(main)/(rider)/index.tsx) AND P2 screens needing driver data
    2. @/store/index.ts (BARREL): has useDriverStore with {drivers, nearbyDrivers, selectedDriverId}
       → USE THIS FOR: find-customer, finish-ride screens
    DO NOT mix them. If a template says "import useDriverStore from '@/store/useDriverStore'" use THAT.
    If it says "import { useDriverStore } from '@/store'" use THAT.
  auth_note: "Driver auth uses SAME shared flow: phone-entry (role=driver) -> otp-verify -> register. No separate driver auth."
  fetch_pattern: "ALWAYS prefix with process.env.EXPO_PUBLIC_SERVER_URL. Auth token from supabase.auth.getSession()."
  safearea_dark: "<SafeAreaView className='flex-1 bg-goBgDark'><StatusBar barStyle='light-content' backgroundColor={colors.bgDark} />"
  safearea_light: "<SafeAreaView className='flex-1 bg-goBgLight'>"
  driver_folder: "app/(main)/(rider)/ (legacy name, DO NOT rename to /driver/)"

  # MANDATORY dark: variants on every color className:
  mandatory_dark: "EVERY color className MUST have a dark: variant. Example: className='bg-white dark:bg-goBgDark border border-goBorderLight dark:border-goBorderDark'"

  # P2-specific note — NEVER use contentContainerStyle on View:
  scroll_rule: "contentContainerStyle is a ScrollView/FlatList prop ONLY. NEVER apply it to a <View>. If you need padding/gap on scroll content, wrap in <ScrollView>."

  # SELF-CHECK per task:
  self_check:
    - "[ ] File exists at exact route_path"
    - "[ ] Every color className has dark: variant"
    - "[ ] All imports present (useState, useEffect, router, stores)"
    - "[ ] Font: font-JakartaBold / font-Jakarta only (no font-[Urbanist], no font-inter)"
    - "[ ] API calls: loading state + error state + try/catch"
    - "[ ] SafeAreaView from react-native-safe-area-context"
    - "[ ] ScrollView for scrollable content (NEVER contentContainerStyle on View)"
    - "[ ] ALL money amounts are integer paisa; display as {(amt/100).toFixed(0)}"
    - "[ ] npx tsc --noEmit passes"

tasks:

  # ===========================================================================
  # TASK 1: DRIVER WALLET (create)
  # ===========================================================================
  # CRITICAL FIX v4.0:
  #   - contentContainerStyle was on View → MUST be ScrollView
  #   - Balance fetched from API, displayed in integer paisa
  #   - Proper loading/error states
  # ===========================================================================
  - id: "DRIVER-026-WALLET"
    screen_numbers: [157]
    wireframe: "## 157. Driver Wallet"
    route_path: "app/(main)/(rider)/(tabs)/wallet/index.tsx"
    action: create
    code_template: |
      import { useState, useEffect, useCallback } from "react";
      import { View, Text, TouchableOpacity, ScrollView, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";

      export default function WalletScreen() {
        const [balancePaisa, setBalancePaisa] = useState(235000);
        const [pendingPaisa, setPendingPaisa] = useState(0);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState("");

        const fetchWallet = useCallback(async () => {
          setLoading(true);
          setError("");
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const token = session?.access_token;
            if (!token) { setError("Not authenticated"); return; }
            const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/driver/wallet`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (!res.ok) { setError("Failed to load wallet"); return; }
            const data = await res.json();
            setBalancePaisa(data.balance_paisa ?? 0);
            setPendingPaisa(data.pending_paisa ?? 0);
          } catch (err: any) {
            setError(err?.message || "Network error");
            logger.error("Wallet fetch failed", err);
          } finally {
            setLoading(false);
          }
        }, []);

        useEffect(() => { fetchWallet(); }, [fetchWallet]);

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <Text className="text-[20px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Wallet</Text>
              {loading ? (
                <ActivityIndicator size="small" color="#0CC25F" className="mt-3" />
              ) : error ? (
                <Text className="text-[14px] font-Jakarta text-goDanger mt-2">{error}</Text>
              ) : (
                <>
                  <Text className="text-[32px] font-JakartaBold text-goPrimary mt-1">৳{(balancePaisa / 100).toFixed(0)}</Text>
                  <Text className="text-[13px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">
                    Available balance{pendingPaisa > 0 ? ` · ৳${(pendingPaisa / 100).toFixed(0)} pending` : ""}
                  </Text>
                </>
              )}
            </View>
            <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16, gap: 12 }}>
              <TouchableOpacity className="bg-goPrimary rounded-full w-full py-[16px] items-center" onPress={() => router.push("/(main)/(rider)/wallet-topup")}>
                <Text className="text-[18px] font-JakartaBold text-goWhite">Top Up</Text>
              </TouchableOpacity>
              <TouchableOpacity className="border border-goBorderLight dark:border-goBorderDark rounded-full w-full py-[16px] items-center" onPress={() => router.push("/(main)/(rider)/payout-methods")}>
                <Text className="text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Withdraw</Text>
              </TouchableOpacity>
              <TouchableOpacity className="border border-goBorderLight dark:border-goBorderDark rounded-full w-full py-[16px] items-center" onPress={() => router.push("/(main)/(rider)/payout-history")}>
                <Text className="text-[16px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">Payout History</Text>
              </TouchableOpacity>
            </ScrollView>
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(main)/(rider)/(tabs)/wallet/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

  # ===========================================================================
  # TASK 2: DRIVER WALLET TOP UP (create)
  # ===========================================================================
  # CRITICAL FIX v4.0:
  #   - useState MUST be imported (was missing in actual implementation)
  #   - Amount input in TAKA, submit as PAISA
  #   - Loading/error states
  #   - API call to initiate PortPos payment
  # ===========================================================================
  - id: "DRIVER-027-WALLET-TOPUP"
    screen_numbers: [158]
    wireframe: "## 158. Driver Wallet Top Up"
    route_path: "app/(main)/(rider)/wallet-topup/index.tsx"
    action: create
    code_template: |
      import { useState } from "react";
      import { View, Text, TextInput, TouchableOpacity, ActivityIndicator, Alert } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";

      const PRESETS = [200, 500, 1000, 2000];

      export default function WalletTopUp() {
        const [amountTaka, setAmountTaka] = useState("500");
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");

        const handleTopUp = async () => {
          const taka = parseInt(amountTaka, 10);
          if (!taka || taka < 50) { setError("Minimum ৳50"); return; }
          if (taka > 25000) { setError("Maximum ৳25,000"); return; }
          setLoading(true);
          setError("");
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const token = session?.access_token;
            if (!token) { setError("Not authenticated"); return; }
            const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/driver/wallet/topup`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ amount_paisa: taka * 100 }),
            });
            if (!res.ok) {
              const data = await res.json().catch(() => ({}));
              setError(data.error || "Payment failed");
              return;
            }
            Alert.alert("Success", `৳${taka} added to wallet`, [{ text: "OK", onPress: () => router.back() }]);
          } catch (err: any) {
            setError(err?.message || "Network error");
            logger.error("Top-up failed", err);
          } finally {
            setLoading(false);
          }
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Top Up Wallet</Text>
              <View className="w-[50px]" />
            </View>
            <View className="flex-1 px-[24px] pt-[24px]">
              <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mb-2">Enter amount (BDT)</Text>
              <View className="flex-row items-center bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[10px] px-[16px] mb-4">
                <Text className="text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark mr-2">৳</Text>
                <TextInput
                  className="flex-1 py-[14px] text-[18px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark"
                  keyboardType="numeric"
                  value={amountTaka}
                  onChangeText={setAmountTaka}
                  placeholderTextColor="#9CA3AF"
                />
              </View>
              <View className="flex-row flex-wrap gap-2 mb-6">
                {PRESETS.map((p) => (
                  <TouchableOpacity
                    key={p}
                    className={`px-[16px] py-[8px] rounded-full border ${parseInt(amountTaka, 10) === p ? "border-goPrimary bg-goAccentLight dark:bg-goPrimary/20" : "border-goBorderLight dark:border-goBorderDark"}`}
                    onPress={() => setAmountTaka(String(p))}
                  >
                    <Text className={`text-[14px] font-JakartaBold ${parseInt(amountTaka, 10) === p ? "text-goPrimary" : "text-goTextSecondaryLight dark:text-goTextSecondaryDark"}`}>৳{p}</Text>
                  </TouchableOpacity>
                ))}
              </View>
              {error ? <Text className="text-[14px] font-Jakarta text-goDanger mb-3">{error}</Text> : null}
              <TouchableOpacity
                className={`rounded-full w-full py-[16px] items-center ${loading || !amountTaka ? "bg-goBorderDark" : "bg-goPrimary"}`}
                onPress={handleTopUp}
                disabled={loading || !amountTaka}
              >
                {loading ? <ActivityIndicator size={20} color="#FFFFFF" /> : <Text className="text-[18px] font-JakartaBold text-goWhite">Add ৳{amountTaka || "0"}</Text>}
              </TouchableOpacity>
            </View>
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(main)/(rider)/wallet-topup/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

  # ===========================================================================
  # TASK 3: PAYOUT METHODS (create — 2 files)
  # ===========================================================================
  - id: "DRIVER-028-PAYOUT-METHODS"
    screen_numbers: [159, 160, 161]
    wireframe: "## 159. Driver Payout Methods / ## 160. Driver Add Payout Method / ## 161. Driver Payout Method Added"
    route_path: "app/(main)/(rider)/payout-methods/index.tsx"
    action: create
    code_template: |
      import { useState, useEffect, useCallback } from "react";
      import { View, Text, TouchableOpacity, ScrollView, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";

      interface PayoutMethod {
        id: string;
        method_type: string;
        account_label: string;
        is_default: boolean;
      }

      export default function PayoutMethods() {
        const [methods, setMethods] = useState<PayoutMethod[]>([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState("");

        const fetchMethods = useCallback(async () => {
          setLoading(true);
          setError("");
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const token = session?.access_token;
            if (!token) { setError("Not authenticated"); return; }
            const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/driver/payout-methods`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (!res.ok) { setError("Failed to load methods"); return; }
            const data = await res.json();
            setMethods(data.methods ?? []);
          } catch (err: any) {
            setError(err?.message || "Network error");
            logger.error("Payout methods fetch failed", err);
          } finally {
            setLoading(false);
          }
        }, []);

        useEffect(() => { fetchMethods(); }, [fetchMethods]);

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Payout Methods</Text>
              <View className="w-[50px]" />
            </View>
            <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16, gap: 12 }}>
              {loading ? (
                <ActivityIndicator size="small" color="#0CC25F" />
              ) : error ? (
                <Text className="text-[14px] font-Jakarta text-goDanger">{error}</Text>
              ) : methods.length === 0 ? (
                <Text className="text-[15px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark text-center mt-8">No payout methods added yet.</Text>
              ) : (
                methods.map((m) => (
                  <View key={m.id} className="flex-row justify-between items-center p-[14px] bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[12px]">
                    <View>
                      <Text className="text-[15px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">{m.method_type}</Text>
                      <Text className="text-[13px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">{m.account_label}{m.is_default ? " · Default" : ""}</Text>
                    </View>
                    <Text className="text-[18px] text-goTextSecondaryLight dark:text-goTextSecondaryDark">⋯</Text>
                  </View>
                ))
              )}
              <TouchableOpacity className="bg-goPrimary rounded-full w-full py-[16px] items-center mt-4" onPress={() => router.push("/(main)/(rider)/add-payout-method")}>
                <Text className="text-[18px] font-JakartaBold text-goWhite">+ Add Method</Text>
              </TouchableOpacity>
            </ScrollView>
          </SafeAreaView>
        );
      }
    extra_files:
      - path: "app/(main)/(rider)/add-payout-method/index.tsx"
        code_template: |
          import { useState } from "react";
          import { View, Text, TextInput, TouchableOpacity, ActivityIndicator, Alert } from "react-native";
          import { SafeAreaView } from "react-native-safe-area-context";
          import { router } from "expo-router";
          import { supabase } from "@/lib/supabase";
          import { logger } from "@/lib/logger";

          const METHOD_TYPES = [
            { key: "bkash", label: "bKash" },
            { key: "nagad", label: "Nagad" },
            { key: "rocket", label: "Rocket" },
            { key: "bank", label: "Bank Account" },
          ];

          export default function AddPayoutMethod() {
            const [methodType, setMethodType] = useState("");
            const [accountNumber, setAccountNumber] = useState("");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [showTypePicker, setShowTypePicker] = useState(false);

            const handleSave = async () => {
              if (!methodType) { setError("Select a method type"); return; }
              if (!accountNumber.trim()) { setError("Enter account number"); return; }
              setLoading(true);
              setError("");
              try {
                const { data: { session } } = await supabase.auth.getSession();
                const token = session?.access_token;
                if (!token) { setError("Not authenticated"); return; }
                const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/driver/payout-methods`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                  body: JSON.stringify({ method_type: methodType, account_number: accountNumber.trim() }),
                });
                if (!res.ok) {
                  const data = await res.json().catch(() => ({}));
                  setError(data.error || "Failed to save");
                  return;
                }
                Alert.alert("Added", "Payout method saved.", [{ text: "OK", onPress: () => router.replace("/(main)/(rider)/payout-methods") }]);
              } catch (err: any) {
                setError(err?.message || "Network error");
                logger.error("Add payout method failed", err);
              } finally {
                setLoading(false);
              }
            };

            return (
              <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
                <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
                  <TouchableOpacity onPress={() => router.back()}>
                    <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
                  </TouchableOpacity>
                  <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Add Payout Method</Text>
                  <View className="w-[50px]" />
                </View>
                <View className="flex-1 px-[24px] pt-[24px]">
                  <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mb-2">Method Type</Text>
                  <TouchableOpacity
                    className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[10px] px-[16px] py-[14px] mb-4"
                    onPress={() => setShowTypePicker(!showTypePicker)}
                  >
                    <Text className="text-[15px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark">
                      {methodType ? METHOD_TYPES.find((m) => m.key === methodType)?.label ?? methodType : "Select method..."}
                    </Text>
                  </TouchableOpacity>
                  {showTypePicker && (
                    <View className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[10px] mb-4 overflow-hidden">
                      {METHOD_TYPES.map((m) => (
                        <TouchableOpacity
                          key={m.key}
                          className={`px-[16px] py-[12px] border-b border-goBorderLight dark:border-goBorderDark ${methodType === m.key ? "bg-goAccentLight dark:bg-goPrimary/20" : ""}`}
                          onPress={() => { setMethodType(m.key); setShowTypePicker(false); }}
                        >
                          <Text className={`text-[15px] font-Jakarta ${methodType === m.key ? "text-goPrimary font-JakartaBold" : "text-goTextPrimaryLight dark:text-goTextPrimaryDark"}`}>{m.label}</Text>
                        </TouchableOpacity>
                      ))}
                    </View>
                  )}
                  <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mb-2">Account Number</Text>
                  <TextInput
                    className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[10px] px-[16px] py-[14px] text-[15px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-4"
                    placeholder="01XXXXXXXXX"
                    placeholderTextColor="#9CA3AF"
                    keyboardType="numeric"
                    value={accountNumber}
                    onChangeText={setAccountNumber}
                  />
                  {error ? <Text className="text-[14px] font-Jakarta text-goDanger mb-3">{error}</Text> : null}
                  <TouchableOpacity
                    className={`rounded-full w-full py-[16px] items-center ${loading ? "bg-goBorderDark" : "bg-goPrimary"}`}
                    onPress={handleSave}
                    disabled={loading}
                  >
                    {loading ? <ActivityIndicator size={20} color="#FFFFFF" /> : <Text className="text-[18px] font-JakartaBold text-goWhite">Save Method</Text>}
                  </TouchableOpacity>
                </View>
              </SafeAreaView>
            );
          }
    verification:
      - { type: file_exists, path: "app/(main)/(rider)/payout-methods/index.tsx" }
      - { type: file_exists, path: "app/(main)/(rider)/add-payout-method/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

  # ===========================================================================
  # TASK 4: PAYOUT HISTORY + INSTANT PAY (create — 2 files)
  # ===========================================================================
  # CRITICAL FIX v4.0:
  #   - Payout history fetches from API (not hardcoded rows)
  #   - Instant pay has proper balance fetch, loading/error states
  #   - ALL amounts in integer paisa
  # ===========================================================================
  - id: "DRIVER-029-PAYOUT-HISTORY"
    screen_numbers: [162, 163]
    wireframe: "## 162. Driver Payout History / ## 163. Driver Instant Pay"
    route_path: "app/(main)/(rider)/payout-history/index.tsx"
    action: create
    code_template: |
      import { useState, useEffect, useCallback } from "react";
      import { View, Text, TouchableOpacity, ScrollView, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";

      interface PayoutRow {
        id: string;
        amount_paisa: number;
        status: string;
        created_at: string;
        method_type: string;
      }

      export default function PayoutHistory() {
        const [rows, setRows] = useState<PayoutRow[]>([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState("");

        const fetchHistory = useCallback(async () => {
          setLoading(true);
          setError("");
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const token = session?.access_token;
            if (!token) { setError("Not authenticated"); return; }
            const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/driver/payout-history`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (!res.ok) { setError("Failed to load history"); return; }
            const data = await res.json();
            setRows(data.payouts ?? []);
          } catch (err: any) {
            setError(err?.message || "Network error");
            logger.error("Payout history fetch failed", err);
          } finally {
            setLoading(false);
          }
        }, []);

        useEffect(() => { fetchHistory(); }, [fetchHistory]);

        const formatDate = (iso: string) => {
          try { return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
          catch { return iso; }
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
