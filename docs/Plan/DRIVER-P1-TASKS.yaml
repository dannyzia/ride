    action: create
    note: >
      CREATE this file. Allows driver to set weekly availability with toggles.
      Static UI — time values are pre-filled defaults that can be toggled on/off.
    code_template: |
      import { useState } from "react";
      import { View, Text, TouchableOpacity, ScrollView, Switch } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";

      const DAYS = [
        { key: "mon", label: "Monday" },
        { key: "tue", label: "Tuesday" },
        { key: "wed", label: "Wednesday" },
        { key: "thu", label: "Thursday" },
        { key: "fri", label: "Friday" },
        { key: "sat", label: "Saturday" },
        { key: "sun", label: "Sunday" },
      ];

      export default function Schedule() {
        const [active, setActive] = useState<Record<string, boolean>>({
          mon: true, tue: true, wed: true, thu: true, fri: true, sat: false, sun: false,
        });

        const toggle = (key: string) => {
          setActive((prev) => ({ ...prev, [key]: !prev[key] }));
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Set Availability</Text>
              <View className="w-[50px]" />
            </View>
            <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16 }}>
              <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mb-3">Toggle days you are available to drive</Text>
              {DAYS.map((d) => (
                <View key={d.key} className={`flex-row justify-between items-center p-[14px] mb-2 rounded-[12px] border ${active[d.key] ? "bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border-goBorderLight dark:border-goBorderDark" : "bg-goBgLight dark:bg-goBgDark border-goBorderLight dark:border-goBorderDark"}`}>
                  <View className="flex-1">
                    <Text className="text-[15px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">{d.label}</Text>
                    {active[d.key] ? (
                      <Text className="text-[13px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">09:00 – 21:00</Text>
                    ) : (
                      <Text className="text-[13px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">Off</Text>
                    )}
                  </View>
                  <Switch
                    value={active[d.key]}
                    onValueChange={() => toggle(d.key)}
                    trackColor={{ false: "#D1D5DB", true: "#0CC25F" }}
                    thumbColor="#FFFFFF"
                  />
                </View>
              ))}
              <TouchableOpacity className="bg-goPrimary rounded-full w-full py-[16px] items-center mt-4">
                <Text className="text-[18px] font-JakartaBold text-goWhite">Save Schedule</Text>
              </TouchableOpacity>
            </ScrollView>
          </SafeAreaView>
        );
      }
