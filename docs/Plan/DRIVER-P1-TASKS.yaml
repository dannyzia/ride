# =============================================================================
# DRIVER-P1-TASKS.yaml v4.0 — ZERO-ASSUMPTION AGENT SPEC
# =============================================================================
# INSTRUCTIONS FOR THE CODING AGENT:
#
#   You are building React Native screens for an Expo Router app. You MUST
#   follow every rule below exactly. Do NOT guess, do NOT use "typical" RN
#   patterns unless they match what's written here. If you are unsure about
#   ANYTHING, read the code_template — it contains the COMPLETE, correct code.
#
#   HOW TO USE THIS FILE:
#   1. Read the global_rules section ONCE and remember all rules.
#   2. For each task: read the entire task block before writing ANY code.
#   3. Copy the code_template EXACTLY — it is compilable JavaScript.
#   4. Run the verification steps for each task before marking it done.
#   5. After ALL tasks: run "npx tsc --noEmit" from the project root.
#
#   IF A TASK SAYS "audit_and_fix": the file ALREADY EXISTS. Only apply the
#   find/replace pairs listed in the "fixes" section. Do NOT recreate the file.
#
#   IF A TASK SAYS "create": use the code_template AS-IS. Copy it, paste it
#   into the file at route_path. Do not add or remove features.
# =============================================================================
version: "4.0"
project: Ride
role: driver
priority_class: P1
total_tasks: 13

# =============================================================================
# GLOBAL RULES — MEMORIZE THESE. EVERY TASK MUST FOLLOW ALL OF THEM.
# =============================================================================
global_rules:

  # --- FRAMEWORK & STACK ---
  framework:
    - "Expo Router (file-based routing). NO react-navigation imports."
    - "NOT Next.js. Dynamic route params come directly as 2nd arg to handlers."
    - "app/(main)/(rider)/ for driver screens (legacy folder name, DO NOT rename)"
    - "app/(auth)/ for auth screens (shared with rider)"
    - "components/ for shared components (flat folder, no subfolder)"
    - "theme/goRide.ts for design tokens (import colors, fonts, radii, spacing)"

  # --- STATE MANAGEMENT ---
  state:
    - "Zustand only. NO Redux, NO React Context for business state, NO useState for cross-screen data."
    - "useDriverStore from @/store/useDriverStore is a SEPARATE FILE with {driver, isOnline, activeSubscription, wsConnected}"
    - "useDriverStore from @/store (BARREL) has {drivers, nearbyDrivers, selectedDriverId} — DIFFERENT shape"
    - "For driver home/onboarding: import { useDriverStore } from '@/store/useDriverStore'"
    - "For find-customer/finish-ride: import { useDriverStore } from '@/store'"
    - "useDriverFlowStore from @/store/useDriverFlowStore (SEPARATE FILE, direct import, NOT barrel)"
    - "useDriverStatusStore from @/store (barrel re-export)"
    - "usePackageStore from @/store (barrel)"
    - "useCallLedgerStore from @/store (barrel)"

  # --- STYLING (NativeWind only. NO StyleSheet.create.) ---
  styling:
    font_heading: "font-JakartaBold"        # for screen titles, headings
    font_body:    "font-Jakarta"             # for body text, labels, secondary
    font_semibold:"font-JakartaSemiBold"     # for subheadings, card titles
    bg_light:     "bg-goBgLight"             # light mode background
    bg_dark:      "dark:bg-goBgDark"         # dark mode background (always pair with bg_light)
    surface_light:"bg-goSurfaceLight"        # light mode card/input bg
    surface_dark: "dark:bg-goSurfaceElevatedDark" # dark mode card/input bg
    border_light: "border-goBorderLight"     # light mode border
    border_dark:  "dark:border-goBorderDark" # dark mode border
    text_primary_l: "text-goTextPrimaryLight"
    text_primary_d: "dark:text-goTextPrimaryDark"
    text_secondary_l: "text-goTextSecondaryLight"
    text_secondary_d: "dark:text-goTextSecondaryDark"
    primary:      "text-goPrimary"           # green brand color for text
    primary_bg:   "bg-goPrimary"             # green brand for button backgrounds
    danger_text:  "text-goDanger"            # red for errors/cancel
    danger_bg:    "bg-goDanger"              # red for destructive buttons
    white_text:   "text-goWhite"             # white text on colored buttons
    accent_light: "bg-goAccentLight"         # light green tint for highlight areas
    blue_bg:      "bg-goBlue"                # blue for CustomButton default

    # BANNED patterns (do NOT use these — they do not exist in tailwind.config.js):
    banned:
      - "font-[Urbanist] OR font-urbanist-bold OR font-inter — use font-JakartaBold / font-Jakarta instead"
      - "bg-[#FAFAFA] OR bg-[#F5F5F5] OR bg-[#EEEEEE] — use bg-goBgLight or bg-goSurfaceLight"
      - "text-[#616161] OR text-[#1F222A] — use text-goTextSecondaryLight"
      - "StyleSheet.create({...}) — use NativeWind className only"
      - "Any inline hex color in className like bg-[#0CC25F] — use bg-goPrimary"

    # MANDATORY: Every color-bearing className MUST have a dark: variant. Examples:
    mandatory_dark_example:
      correct: "className='bg-white dark:bg-goBgDark border border-goBorderLight dark:border-goBorderDark'"
      wrong:   "className='bg-white border border-goBorderLight'  ← missing dark:"

  # --- IMPORTS (exact paths — do not guess or modify) ---
  imports:
    safe_area:  "import { SafeAreaView } from 'react-native-safe-area-context'"
    router:     "import { router } from 'expo-router'"
    local_params:"import { useLocalSearchParams } from 'expo-router'"
    supabase:   "import { supabase } from '@/lib/supabase'"
    logger:     "import { logger } from '@/lib/logger'"
    colors:     "import { colors } from '@/theme/goRide'"
    status_bar: "import { StatusBar } from 'react-native'  # NOT expo-status-bar"
    rn_core:    "import { View, Text, TouchableOpacity, TextInput, ActivityIndicator, ScrollView } from 'react-native'"
    driver_store_separate: "import { useDriverStore } from '@/store/useDriverStore'  # SEPARATE FILE for home/onboarding"
    driver_store_barrel:   "import { useDriverStore } from '@/store'  # BARREL for find-customer/finish-ride"
    driver_flow_store: "import { useDriverFlowStore } from '@/store/useDriverFlowStore'  # SEPARATE FILE"

    # Available components (check components/ folder before creating new ones):
    components_available:
      - "CustomButton from @/components/CustomButton  → bgVariant: primary=blue(bg-goBlue), success=green(bg-goPrimary), danger=red, outline=transparent. Uses rounded-full."
      - "InputField from @/components/InputField"
      - "RideLayout from @/components/RideLayout  → wraps screen with map+header"
      - "SlideButton from @/components/SlideButton"

  # --- NAVIGATION ---
  navigation:
    push: "router.push('/path') — go forward to a screen"
    back: "router.back() — go back one screen"
    replace: "router.replace('/path') — replace current screen (no back stack)"
    params: "useLocalSearchParams<{ key: string }>() — read URL query params"
    route_path_format: "app/(main)/(rider)/screen-name/index.tsx"

  # --- HEADER PATTERN ---
  header_pattern: |
    EVERY screen with navigation needs this exact header:
    <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
      <TouchableOpacity onPress={() => router.back()}>
        <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
      </TouchableOpacity>
      <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Screen Title</Text>
      <View className="w-[50px]" />
    </View>

  # --- MONEY ---
  money: "ALL amounts are INTEGER PAISA. Display: {(amt/100).toFixed(0)}. Never divide before display. Store price constants in paisa (e.g. 49900 = ৳499)."

  # --- API CALL PATTERN (use for EVERY fetch) ---
  api_pattern: |
    EVERY API call MUST follow this exact pattern:
    1. const [loading, setLoading] = useState(false);
    2. const [error, setError] = useState('');
    3. const { data: { session } } = await supabase.auth.getSession();
    4. const token = session?.access_token;
    5. if (!token) { setError('Not authenticated'); return; }
    6. try {
         setLoading(true); setError('');
         const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/...`, {
           method: 'POST',
           headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
           body: JSON.stringify({ ... }),
         });
         const data = await res.json();
         if (!res.ok) { setError(data.error || 'Request failed'); return; }
         // handle success
       } catch (err: any) {
         setError(err?.message || 'Network error');
       } finally {
         setLoading(false);
       }

  # --- SELF-CHECK CHECKLIST (run this for every task before marking done) ---
  self_check:
    - "[ ] Does the file exist at the exact route_path?"
    - "[ ] Does every color className have a dark: variant?"
    - "[ ] Are ALL imports at the top, including useState/useEffect/useRef?"
    - "[ ] Does the template use font-JakartaBold (heading) and font-Jakarta (body) — NOT font-[Urbanist], NOT font-inter?"
    - "[ ] For API calls: is there loading state, error state, and try/catch?"
    - "[ ] Is SafeAreaView imported from react-native-safe-area-context (NOT react-native)?"
    - "[ ] Are store imports using the CORRECT path (useDriverStore from @/store/useDriverStore for SEPARATE FILE, from @/store for barrel)?"
    - "[ ] Does the code use existing components (CustomButton, RideLayout, InputField) instead of building new ones?"
    - "[ ] Are ALL money amounts in INTEGER PAISA with display: {(amt/100).toFixed(0)}?"
    - "[ ] Does header use router.back() inside TouchableOpacity wrapping <Text> (NOT Text onPress directly)?"
    - "[ ] Did you run 'npx tsc --noEmit' and it passed?"
    - "[ ] No console.log anywhere — use logger.info/warn/error from @/lib/logger"

# =============================================================================
# TASKS
# =============================================================================

tasks:

  # ===========================================================================
  # TASK 1: DRIVER PERSONAL PROFILE (create)
  # ===========================================================================
  - id: "DRIVER-014-PERSONAL-PROFILE"
    screen_numbers: [117, 118]
    wireframe: "## 117. Driver Personal Profile Blank / ## 118. Driver Personal Profile Filled"
    route_path: "app/(main)/(rider)/personal-profile/index.tsx"
    action: create
    note: >
      CREATE this file. Driver profile edit screen with photo upload, name, and city.
      Uses expo-image-picker for photo. API: PATCH /api/driver/profile.
      The code_template is complete — copy it exactly.
    code_template: |
      import { useState } from "react";
      import { View, Text, TextInput, TouchableOpacity, ScrollView, Image, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import * as ImagePicker from "expo-image-picker";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";

      export default function DriverPersonalProfile() {
        const [name, setName] = useState("");
        const [city, setCity] = useState("");
        const [photo, setPhoto] = useState<string | null>(null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");

        const pickImage = async () => {
          try {
            const result = await ImagePicker.launchImageLibraryAsync({
              mediaTypes: ImagePicker.MediaTypeOptions.Images,
              allowsEditing: true,
              aspect: [1, 1],
              quality: 0.8,
            });
            if (!result.canceled && result.assets[0]) {
              setPhoto(result.assets[0].uri);
            }
          } catch (err) {
            logger.error("Image pick failed", err);
          }
        };

        const handleSave = async () => {
          if (!name.trim()) { setError("Name is required"); return; }
          setLoading(true); setError("");
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const token = session?.access_token;
            if (!token) { setError("Not authenticated"); return; }
            const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/driver/profile`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ name: name.trim(), city: city.trim(), photo_url: photo }),
            });
            const data = await res.json();
            if (!res.ok) { setError(data.error || "Failed to save"); return; }
            router.push("/(main)/(rider)/onboarding/documents");
          } catch (err: any) {
            setError(err?.message || "Network error");
            logger.error("Driver profile save failed", err);
          } finally {
            setLoading(false);
          }
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Complete Driver Profile</Text>
              <View className="w-[50px]" />
            </View>
            <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingBottom: 40 }}>
              <TouchableOpacity onPress={pickImage} className="items-center mb-6 mt-4">
                {photo ? (
                  <Image source={{ uri: photo }} className="w-24 h-24 rounded-full" />
                ) : (
                  <View className="w-24 h-24 rounded-full bg-goAccentLight items-center justify-center">
                    <Text className="text-[14px] font-Jakarta text-goPrimary">Upload Photo</Text>
                  </View>
                )}
              </TouchableOpacity>
              <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mb-2">Name</Text>
              <TextInput
                className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[10px] px-[16px] py-[14px] text-[15px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-4"
                placeholder="Enter your full name"
                placeholderTextColor="#9CA3AF"
                value={name}
                onChangeText={setName}
              />
              <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mb-2">City</Text>
              <TextInput
                className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[10px] px-[16px] py-[14px] text-[15px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-4"
                placeholder="Select your operating city"
                placeholderTextColor="#9CA3AF"
                value={city}
                onChangeText={setCity}
              />
              {error ? (
                <Text className="text-[14px] font-Jakarta text-goDanger mb-3">{error}</Text>
              ) : null}
              <TouchableOpacity
                className={`rounded-full py-[16px] items-center ${loading ? "bg-goBorderDark" : "bg-goPrimary"}`}
                onPress={handleSave}
                disabled={loading}
              >
                {loading ? (
                  <ActivityIndicator size={20} color="#FFFFFF" />
                ) : (
                  <Text className="text-[18px] font-JakartaBold text-goWhite">Continue</Text>
                )}
              </TouchableOpacity>
            </ScrollView>
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(main)/(rider)/personal-profile/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

  # ===========================================================================
  # TASK 2: DRIVER SUBSCRIPTION PLANS (create)
  # ===========================================================================
  - id: "DRIVER-015-SUBSCRIPTION-PLANS"
    screen_numbers: [120]
    wireframe: "## 120. Driver Subscription Plans"
    route_path: "app/(main)/(rider)/subscription-plans/index.tsx"
    action: create
    note: >
      CREATE this file. Displays hardcoded call packages (Starter 50 calls, Pro 200 calls).
      ALL prices in INTEGER PAISA. Display divides by 100 at render time.
      Tapping a plan navigates to subscription-details with plan id as param.
    code_template: |
      import { View, Text, TouchableOpacity, ScrollView } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";

      const PLANS: { id: string; name: string; calls: number; price_bdt: number; validity_days: number }[] = [
        { id: "starter", name: "Starter 50", calls: 50, price_bdt: 49900, validity_days: 30 },
        { id: "pro", name: "Pro 200", calls: 200, price_bdt: 149900, validity_days: 30 },
      ];

      export default function SubscriptionPlans() {
        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Call Packages</Text>
              <View className="w-[50px]" />
            </View>
            <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16, gap: 12 }}>
              {PLANS.map((p) => (
                <TouchableOpacity
                  key={p.id}
                  className="p-[16px] bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[12px]"
                  onPress={() => router.push(`/(main)/(rider)/subscription-details?planId=${p.id}`)}
                >
                  <View className="flex-row justify-between items-center">
                    <View>
                      <Text className="text-[16px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">{p.name}</Text>
                      <Text className="text-[13px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">{p.calls} calls · {p.validity_days}-day validity</Text>
                    </View>
                    <Text className="text-[16px] font-JakartaBold text-goPrimary">৳{(p.price_bdt / 100).toFixed(0)}</Text>
                  </View>
                </TouchableOpacity>
              ))}
            </ScrollView>
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(main)/(rider)/subscription-plans/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

  # ===========================================================================
  # TASK 3: SUBSCRIPTION PLAN DETAILS + CHECKOUT (create — 2 files)
  # ===========================================================================
  - id: "DRIVER-016-SUBSCRIPTION-DETAILS-CHECKOUT"
    screen_numbers: [121, 122]
    wireframe: "## 121. Driver Subscription Plan Details / ## 122. Driver Subscription Checkout"
    route_path: "app/(main)/(rider)/subscription-details/index.tsx"
    action: create
    note: >
      CREATE BOTH files. subscription-details reads planId from URL params and displays
      the selected plan details. subscription-checkout shows payment method options.
      Both are static/semi-static screens with navigation.
    code_template: |
      import { View, Text, TouchableOpacity, ScrollView } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router, useLocalSearchParams } from "expo-router";

      const PLANS: Record<string, { id: string; name: string; calls: number; price_bdt: number; validity_days: number }> = {
        starter: { id: "starter", name: "Starter 50", calls: 50, price_bdt: 49900, validity_days: 30 },
        pro: { id: "pro", name: "Pro 200", calls: 200, price_bdt: 149900, validity_days: 30 },
      };

      export default function SubscriptionDetails() {
        const { planId } = useLocalSearchParams<{ planId: string }>();
        const plan = PLANS[planId || "starter"] || PLANS.starter;

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Plan Details</Text>
              <View className="w-[50px]" />
            </View>
            <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16 }}>
              <View className="p-[16px] bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[12px] mb-4">
                <Text className="text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">{plan.name}</Text>
                <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mt-1">{plan.calls} calls included</Text>
                <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">{plan.validity_days}-day validity from activation</Text>
                <Text className="text-[22px] font-JakartaBold text-goPrimary mt-2">৳{(plan.price_bdt / 100).toFixed(0)}</Text>
              </View>
              <View className="p-[16px] bg-goAccentLight rounded-[12px] mb-4">
                <Text className="text-[13px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">Commission rate varies by plan. Pro plan has lower per-ride commission than Starter.</Text>
              </View>
              <TouchableOpacity
                className="bg-goPrimary rounded-full w-full py-[16px] items-center"
                onPress={() => router.push(`/(main)/(rider)/subscription-checkout?planId=${plan.id}`)}
              >
                <Text className="text-[18px] font-JakartaBold text-goWhite">Proceed to checkout</Text>
              </TouchableOpacity>
            </ScrollView>
          </SafeAreaView>
        );
      }
    extra_files:
      - path: "app/(main)/(rider)/subscription-checkout/index.tsx"
        code_template: |
          import { useState } from "react";
          import { View, Text, TouchableOpacity, ScrollView, ActivityIndicator } from "react-native";
          import { SafeAreaView } from "react-native-safe-area-context";
          import { router, useLocalSearchParams } from "expo-router";
          import { supabase } from "@/lib/supabase";
          import { logger } from "@/lib/logger";

          const PLANS: Record<string, { id: string; name: string; calls: number; price_bdt: number; validity_days: number }> = {
            starter: { id: "starter", name: "Starter 50", calls: 50, price_bdt: 49900, validity_days: 30 },
            pro: { id: "pro", name: "Pro 200", calls: 200, price_bdt: 149900, validity_days: 30 },
          };

          export default function SubscriptionCheckout() {
            const { planId } = useLocalSearchParams<{ planId: string }>();
            const plan = PLANS[planId || "starter"] || PLANS.starter;
            const [selectedMethod, setSelectedMethod] = useState("bKash");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");

            const handlePay = async () => {
              setLoading(true); setError("");
              try {
                const { data: { session } } = await supabase.auth.getSession();
                const token = session?.access_token;
                if (!token) { setError("Not authenticated"); return; }
                const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/package/purchase`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                  body: JSON.stringify({ package_id: plan.id, payment_method: selectedMethod }),
                });
                const data = await res.json();
                if (!res.ok) { setError(data.error || "Payment failed"); return; }
                router.replace("/(main)/(rider)/subscription-confirmation");
              } catch (err: any) {
                setError(err?.message || "Network error");
                logger.error("Checkout failed", err);
              } finally {
                setLoading(false);
              }
            };

            const methods = ["bKash", "Nagad", "Card"];

            return (
              <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
                <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
                  <TouchableOpacity onPress={() => router.back()}>
                    <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
                  </TouchableOpacity>
                  <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Checkout</Text>
                  <View className="w-[50px]" />
                </View>
                <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16 }}>
                  <View className="p-[16px] bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[12px] mb-4">
                    <Text className="text-[15px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">{plan.name}</Text>
                    <Text className="text-[13px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mt-1">{plan.calls} calls · {plan.validity_days} days</Text>
                    <Text className="text-[20px] font-JakartaBold text-goPrimary mt-2">৳{(plan.price_bdt / 100).toFixed(0)}</Text>
                  </View>
                  <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mb-2">Payment method</Text>
                  {methods.map((m) => (
                    <TouchableOpacity
                      key={m}
                      className={`flex-row items-center p-[14px] mb-2 rounded-[12px] border ${
                        selectedMethod === m
                          ? "border-goPrimary bg-goAccentLight"
