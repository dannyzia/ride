  - id: "DRIVER-021-BREAK-MODE"
    screen_numbers: [136]
    wireframe: "## 136. Driver Break / Rest Mode"
    route_path: "app/(main)/(rider)/break-mode/index.tsx"
    action: create
    note: >
      CREATE this file. Shows break status with timer and controls.
      Uses useState for break timer — static countdown for demo.
    code_template: |
      import { useState, useEffect } from "react";
      import { View, Text, TouchableOpacity } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";

      export default function BreakMode() {
        const [seconds, setSeconds] = useState(300); // 5-minute demo countdown

        useEffect(() => {
          if (seconds <= 0) return;
          const interval = setInterval(() => {
            setSeconds((prev) => Math.max(0, prev - 1));
          }, 1000);
          return () => clearInterval(interval);
        }, [seconds]);

        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
