global_notes:
  font_rule: "font-JakartaBold (headings) and font-Jakarta (body). Do NOT use font-[Urbanist] or font-inter."
  button_rule: "CustomButton default bgVariant='primary' renders BLUE (bg-goBlue). For GREEN use bgVariant='success'. Uses rounded-full."
  money: "ALL amounts are INTEGER PAISA. Display: {(amt/100).toFixed(0)}."
  stores: >
    CRITICAL — TWO SEPARATE useDriverStore instances exist with DIFFERENT shapes:
    1. @/store/useDriverStore.ts (SEPARATE FILE, default export): has {driver, isOnline, activeSubscription, wsConnected}
       → USE THIS FOR: driver home screen (app/(main)/(rider)/index.tsx)
    2. @/store/index.ts (BARREL): has useDriverStore with {drivers, nearbyDrivers, selectedDriverId}
       → USE THIS FOR: find-customer, finish-ride screens
    DO NOT mix them. If a template says "import { useDriverStore } from '@/store/useDriverStore'" use THAT.
    If it says "import { useDriverStore } from '@/store'" use THAT.
  auth_note: "Driver auth uses SAME shared flow: phone-entry (role=driver) -> otp-verify -> register. No separate driver auth."
  fetch_pattern: "ALWAYS prefix with process.env.EXPO_PUBLIC_SERVER_URL. Auth token from supabase.auth.getSession()."
  safearea_dark: "<SafeAreaView className='flex-1 bg-goBgDark'><StatusBar barStyle='light-content' backgroundColor={colors.bgDark} />"
  safearea_light: "<SafeAreaView className='flex-1 bg-goBgLight'>"
  driver_folder: "app/(main)/(rider)/ (legacy name, DO NOT rename to /driver/)"

  # MANDATORY dark: variants on every color className:
  mandatory_dark: "EVERY color className MUST have a dark: variant. Example: className='bg-white dark:bg-goBgDark border border-goBorderLight dark:border-goBorderDark'"

  # SELF-CHECK per task:
  self_check:
    - "[ ] File exists at exact route_path"
    - "[ ] Every color className has dark: variant"
    - "[ ] All imports present (useState, useEffect, router, stores)"
    - "[ ] Font: font-JakartaBold / font-Jakarta only (no font-[Urbanist], no font-inter)"
    - "[ ] API calls: loading state + error state + try/catch"
    - "[ ] SafeAreaView from react-native-safe-area-context"
    - "[ ] useDriverStore import matches the note (separate file vs barrel)"
    - "[ ] npx tsc --noEmit — filter for YOUR files only: npx tsc --noEmit 2>&1 | Select-String 'yourFile.tsx'"
    - "[ ] If tsc shows errors in files you DID NOT edit → those are pre-existing, report them but do NOT fix"

