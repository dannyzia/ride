# =============================================================================
# RIDER-P1-TASKS.yaml v4.0 — ZERO-ASSUMPTION AGENT SPEC
# =============================================================================
# INSTRUCTIONS FOR THE CODING AGENT:
#
#   You are building React Native screens for an Expo Router app. You MUST
#   follow every rule below exactly. Do NOT guess, do NOT use "typical" RN
#   patterns unless they match what's written here. If you are unsure about
#   ANYTHING, read the code_template — it contains the COMPLETE, correct code.
#
#   HOW TO USE THIS FILE:
#   1. Read the global_rules section ONCE and remember all rules.
#   2. For each task: read the entire task block before writing ANY code.
#   3. Copy the code_template EXACTLY — it is compilable JavaScript.
#   4. Run the verification steps for each task before marking it done.
#   5. After ALL tasks: run "npx tsc --noEmit" from the project root.
#
#   IF A TASK SAYS "audit_and_fix": the file ALREADY EXISTS. Only apply the
#   find/replace pairs listed in the "fixes" section. Do NOT recreate the file.
#
#   IF A TASK SAYS "create": use the code_template AS-IS. Copy it, paste it
#   into the file at route_path. Do not add or remove features.
#
#   CROSS-FILE NOTE: voice-call and video-call screens are defined in BOTH
#   RIDER-P1 (CANONICAL) and RIDER-P3. The P1 versions are the CANONICAL
#   definitions — RIDER-P3 should mark those tasks as SKIP_IF_EXISTS.
# =============================================================================
version: "4.0"
project: Ride
role: rider
priority_class: P1
total_tasks: 15

# =============================================================================
# GLOBAL RULES — MEMORIZE THESE. EVERY TASK MUST FOLLOW ALL OF THEM.
# =============================================================================
global_rules:

  # --- FRAMEWORK & STACK (verified against package.json) ---
  framework:
    - "Expo Router (file-based routing). NO react-navigation imports."
    - "NOT Next.js. Dynamic route params come directly as 2nd arg to handlers."
    - "app/(main)/(customer)/ for rider screens"
    - "app/(auth)/ for auth screens (NO header — _layout.tsx sets headerShown:false)"
    - "components/ for shared components (flat folder, no subfolder)"
    - "theme/goRide.ts for design tokens (import colors, fonts, radii, spacing)"

  # --- STATE MANAGEMENT ---
  state:
    - "Zustand only. NO Redux, NO React Context for business state, NO useState for cross-screen data."
    - "useRiderStore from @/store/useRiderStore (direct import, NOT barrel)"
    - "useCustomer from @/store (barrel re-export)"
    - "useWSStore from @/store (barrel)"
    - "useAppUserStore from @/store (barrel)"
    - "DO NOT import useRiderStore from @/store — it is a SEPARATE file at @/store/useRiderStore"

  # --- STYLING (NativeWind only. NO StyleSheet.create.) ---
  styling:
    font_heading: "font-JakartaBold"        # for screen titles, headings
    font_body:    "font-Jakarta"             # for body text, labels, secondary
    font_semibold:"font-JakartaSemiBold"     # for subheadings, card titles
    bg_light:     "bg-goBgLight"             # light mode background
    bg_dark:      "dark:bg-goBgDark"         # dark mode background (always pair with bg_light)
    surface_light:"bg-goSurfaceLight"        # light mode card/input bg
    surface_dark: "dark:bg-goSurfaceElevatedDark" # dark mode card/input bg
    border_light: "border-goBorderLight"     # light mode border
    border_dark:  "dark:border-goBorderDark" # dark mode border
    text_primary_l: "text-goTextPrimaryLight"
    text_primary_d: "dark:text-goTextPrimaryDark"
    text_secondary_l: "text-goTextSecondaryLight"
    text_secondary_d: "dark:text-goTextSecondaryDark"
    primary:      "text-goPrimary"           # green brand color for text
    primary_bg:   "bg-goPrimary"             # green for button backgrounds
    danger_text:  "text-goDanger"            # red for errors/cancel
    danger_bg:    "bg-goDanger"              # red for destructive buttons
    white_text:   "text-goWhite"             # white text on colored buttons
    accent_light: "bg-goAccentLight"         # light green tint for highlight areas

    # BANNED patterns (do NOT use these — they do not exist in tailwind.config.js):
    banned:
      - "font-[Urbanist] OR font-urbanist-bold OR font-inter — use font-JakartaBold / font-Jakarta instead"
      - "bg-[#FAFAFA] OR bg-[#F5F5F5] OR bg-[#EEEEEE] — use bg-goBgLight or bg-goSurfaceLight"
      - "text-[#616161] OR text-[#1F222A] — use text-goTextSecondaryLight"
      - "StyleSheet.create({...}) — use NativeWind className only"
      - "Any inline hex color in className like bg-[#0CC25F] — use bg-goPrimary"

    # MANDATORY: Every color-bearing className MUST have a dark: variant. Examples:
    mandatory_dark_example:
      correct: "className='bg-white dark:bg-goBgDark border border-goBorderLight dark:border-goBorderDark'"
      wrong:   "className='bg-white border border-goBorderLight'  ← missing dark:"

  # --- IMPORTS (exact paths — do not guess or modify) ---
  imports:
    safe_area:  "import { SafeAreaView } from 'react-native-safe-area-context'"
    router:     "import { router } from 'expo-router'"
    router_hook:"import { useRouter } from 'expo-router'  # only when you need the hook (not push/back)"
    local_params:"import { useLocalSearchParams } from 'expo-router'"
    supabase:   "import { supabase } from '@/lib/supabase'"
    logger:     "import { logger } from '@/lib/logger'"
    colors:     "import { colors } from '@/theme/goRide'"
    status_bar: "import { StatusBar } from 'react-native'  # NOT expo-status-bar"
    rn_core:    "import { View, Text, TouchableOpacity, TextInput, ActivityIndicator, ScrollView } from 'react-native'"

    # NEVER import store/useRiderStore from @/store. ALWAYS use @/store/useRiderStore directly.
    rider_store:"import { useRiderStore } from '@/store/useRiderStore'"
    customer_store: "import { useCustomer } from '@/store'"
    ws_store:   "import { useWSStore } from '@/store'"

    # Available components (check components/ folder before creating new ones):
    components_available:
      - "CustomButton from @/components/CustomButton  → BG variant: primary=green, success=green, danger=red, outline=transparent"
      - "InputField from @/components/InputField"
      - "RideLayout from @/components/RideLayout  → wraps screen with map+header"
      - "BarikoiAutocomplete from @/components/BarikoiAutocomplete"
      - "SOSButton from @/components/SOSButton"
      - "ChatScreen from @/components/ChatScreen"
      - "SlideButton from @/components/SlideButton"

  # --- NAVIGATION ---
  navigation:
    push: "router.push('/path') — go forward to a screen"
    back: "router.back() — go back one screen"
    replace: "router.replace('/path') — replace current screen (no back stack)"
    params: "useLocalSearchParams<{ key: string }>() — read URL query params"
    route_path_format: "app/(main)/(customer)/screen-name/index.tsx"

  # --- HEADER PATTERN (use for screens that need a top bar) ---
  header_pattern: |
    <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
      <TouchableOpacity onPress={() => router.back()}>
        <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
      </TouchableOpacity>
      <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">SCREEN TITLE</Text>
      <View className="w-[50px]" />
    </View>

  # --- API CALL PATTERN (use for EVERY fetch) ---
  api_pattern: |
    EVERY API call MUST follow this exact pattern:
    1. const [loading, setLoading] = useState(false);
    2. const [error, setError] = useState('');
    3. const { data: { session } } = await supabase.auth.getSession();
    4. const token = session?.access_token;
    5. if (!token) { setError('Not authenticated'); return; }
    6. try {
         setLoading(true); setError('');
         const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/...`, {
           method: 'POST',
           headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
           body: JSON.stringify({ ... }),
         });
         const data = await res.json();
         if (!res.ok) { setError(data.error || 'Request failed'); return; }
         // handle success
       } catch (err: any) {
         setError(err?.message || 'Network error');
       } finally {
         setLoading(false);
       }

  # --- STATUS BAR ON DARK SCREENS ---
  statusbar_dark: |
    import { StatusBar } from 'react-native';
    import { colors } from '@/theme/goRide';
    <StatusBar barStyle="light-content" backgroundColor={colors.bgDark} />

  # --- SELF-CHECK CHECKLIST (run this for every task before marking done) ---
  self_check:
    - "[ ] Does the file exist at the exact route_path?"
    - "[ ] Does every color className have a dark: variant?"
    - "[ ] Are ALL imports at the top, including useState/useEffect/useRef?"
    - "[ ] Does the template use font-JakartaBold (heading) and font-Jakarta (body) — NOT font-[Urbanist], NOT font-inter?"
    - "[ ] For API calls: is there loading state, error state, and try/catch?"
    - "[ ] Is SafeAreaView imported from react-native-safe-area-context (NOT react-native)?"
    - "[ ] Are store imports using the CORRECT path (useRiderStore from @/store/useRiderStore, others from @/store)?"
    - "[ ] Does the code use existing components (CustomButton, RideLayout, InputField) instead of building new ones?"
    - "[ ] Did you run 'npx tsc --noEmit' and it passed?"
    - "[ ] No console.log anywhere — use logger.info/warn/error from @/lib/logger"

# =============================================================================
# TASKS
# =============================================================================

tasks:

  # ===========================================================================
  # TASK 1: FORGOT PASSWORD (audit_and_fix)
  # ===========================================================================
  - id: "RIDER-024-FORGOT-PASSWORD"
    screen_numbers: [13]
    wireframe: "## 13. Forgot Password"
    route_path: "app/(auth)/forgot-password.tsx"
    action: audit_and_fix
    note: >
      File EXISTS at app/(auth)/forgot-password.tsx. DO NOT CREATE. Only apply
      the find/replace fixes below. This screen handles password reset via SMS OTP.
    fixes:
      - find: "font-[Urbanist]"
        replace: "font-JakartaBold"
        replace_all: true
      - find: "font-inter"
        replace: "font-Jakarta"
        replace_all: true
    forbidden_patterns:
      - "Do NOT change the password reset flow from Supabase phone OTP."
      - "Do NOT add email-based recovery."
    verification:
      - { type: command, run: "npx tsc --noEmit", expect: 0 }
      - { type: anti_pattern, file: "app/(auth)/forgot-password.tsx", forbidden: "font-\\[Urbanist\\]|font-inter" }

  # ===========================================================================
  # TASK 2: NOTIFICATIONS PERMISSION (create)
  # ===========================================================================
  - id: "RIDER-025-NOTIFICATIONS"
    screen_numbers: [15]
    wireframe: "## 15. Notifications Permission"
    route_path: "app/(auth)/notifications-permission.tsx"
    action: create
    note: >
      CREATE this file. Simple allow/not-now screen shown after enable-location
      in the onboarding flow. Both buttons navigate to the home screen.
    code_template: |
      import { View, Text, TouchableOpacity } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";

      export default function NotificationsPermission() {
        const allow = () => router.replace("/(main)/(customer)/(tabs)/home");
        const skip = () => router.replace("/(main)/(customer)/(tabs)/home");

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark items-center justify-center px-[24px]">
            <View className="flex-1 items-center justify-center">
              <View className="w-24 h-24 rounded-full bg-goAccentLight items-center justify-center mb-8">
                <Text className="text-[40px]">🔔</Text>
              </View>
              <Text className="text-[24px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-3">
                Allow Notifications
              </Text>
              <Text className="text-[16px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark text-center">
                We'll send you ride updates, promo offers, and important alerts.
              </Text>
            </View>
            <View className="flex-row w-full pb-[40px]">
              <TouchableOpacity className="flex-1 border border-goBorderLight dark:border-goBorderDark rounded-full py-[16px] items-center mr-2" onPress={skip}>
                <Text className="text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Not Now</Text>
              </TouchableOpacity>
              <TouchableOpacity className="flex-1 bg-goPrimary rounded-full py-[16px] items-center ml-2" onPress={allow}>
                <Text className="text-[18px] font-JakartaBold text-goWhite">Allow</Text>
              </TouchableOpacity>
            </View>
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(auth)/notifications-permission.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

  # ===========================================================================
  # TASK 3: AVAILABLE OPTIONS EXPANDED (create)
  # ===========================================================================
  - id: "RIDER-026-AVAILABLE-OPTIONS-EXPANDED"
    screen_numbers: [26]
    wireframe: "## 26. Available GoRide Options & Trip Fares - Expanded View"
    route_path: "app/(main)/(customer)/available-options-expanded/index.tsx"
    action: create
    note: >
      CREATE this file. Expanded fare breakdown view with per-option details.
      CRITICAL FIXES from v3.0: (1) add missing useState import, (2) add missing
      ActivityIndicator import, (3) fix contentContainerStyle on wrong element —
      the outer wrapper View cannot have contentContainerStyle; wrap in ScrollView.
    code_template: |
      import { useState } from "react";
      import { View, Text, TouchableOpacity, ScrollView, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { useRiderStore } from "@/store/useRiderStore";
      import { useCustomer } from "@/store";

      export default function AvailableOptionsExpanded() {
        const { estimates } = useRiderStore();
        const { destinationLatitude, destinationLongitude } = useCustomer();
        const [loading, setLoading] = useState(false);

        const expandedOptions = (estimates ?? []).map((estimate: any) => ({
          ...estimate,
          breakdown: {
            base_fare: Math.floor(estimate.total_bdt * 0.4),
            distance_fare: Math.floor(estimate.total_bdt * 0.4),
            time_fare: Math.floor(estimate.total_bdt * 0.15),
            surge_fare: Math.floor(estimate.total_bdt * 0.05),
          },
        }));

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Trip Options</Text>
              <View className="w-[50px]" />
            </View>
            {loading ? (
              <View className="flex-1 items-center justify-center">
                <ActivityIndicator size="large" color="#0CC25F" />
              </View>
            ) : (
              <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16, gap: 12 }}>
                {expandedOptions.map((option: any, index: number) => (
                  <View key={index} className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-2xl p-[16px] mb-4">
                    <View className="flex-row justify-between items-center mb-2">
                      <Text className="text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">
                        {option.vehicle_type.replace(/_/g, " ").replace(/\b\w/g, (c: string) => c.toUpperCase())}
                      </Text>
                      <Text className="text-[16px] font-JakartaBold text-goPrimary">৳{(option.total_bdt / 100).toFixed(0)}</Text>
                    </View>
                    <View className="flex-row gap-4 mb-2">
                      <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">
                        {option.eta_minutes} min away
                      </Text>
                      <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">
                        {option.seats} seats
                      </Text>
                      {option.has_ac ? (
                        <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">· AC</Text>
                      ) : null}
                    </View>
                    <View className="border-t border-goBorderLight dark:border-goBorderDark pt-3 mt-2">
                      <Text className="text-[14px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Fare Breakdown</Text>
                      <View className="flex-row flex-wrap mt-1">
                        <Text className="text-[12px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark w-1/2">Base Fare:</Text>
                        <Text className="text-[12px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark w-1/2 text-right">৳{((option.breakdown?.base_fare ?? 0) / 100).toFixed(0)}</Text>
                        <Text className="text-[12px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark w-1/2">Distance:</Text>
                        <Text className="text-[12px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark w-1/2 text-right">৳{((option.breakdown?.distance_fare ?? 0) / 100).toFixed(0)}</Text>
                        <Text className="text-[12px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark w-1/2">Time:</Text>
                        <Text className="text-[12px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark w-1/2 text-right">৳{((option.breakdown?.time_fare ?? 0) / 100).toFixed(0)}</Text>
                        <Text className="text-[12px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark w-1/2">Surge:</Text>
                        <Text className="text-[12px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark w-1/2 text-right">৳{((option.breakdown?.surge_fare ?? 0) / 100).toFixed(0)}</Text>
                      </View>
                    </View>
                  </View>
                ))}
                <TouchableOpacity
                  className="bg-goPrimary rounded-full w-full py-[16px] items-center"
                  onPress={() => router.push("/(main)/(customer)/select-payment")}
                >
                  <Text className="text-[18px] font-JakartaBold text-goWhite">Choose Payment Method</Text>
                </TouchableOpacity>
              </ScrollView>
            )}
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(main)/(customer)/available-options-expanded/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

  # ===========================================================================
  # TASK 4: APPLY PROMOS (create)
  # ===========================================================================
  - id: "RIDER-027-APPLY-PROMOS"
    screen_numbers: [28]
    wireframe: "## 27. Apply for Promos or Vouchers"
    route_path: "app/(main)/(customer)/apply-promos/index.tsx"
    action: create
    note: >
      CREATE this file. Riders enter promo codes and see available promos.
      CRITICAL FIX from v3.0: add missing useState import.
    code_template: |
      import { useState } from "react";
      import { View, Text, TouchableOpacity, ScrollView, TextInput, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";
      import { useRiderStore } from "@/store/useRiderStore";

      const AVAILABLE_PROMOS = [
        { code: "WELCOME10", description: "10% off first ride", discount: 10 },
        { code: "RIDE50", description: "৳50 off next ride", discount: 50 },
      ];

      export default function ApplyPromos() {
        const [promoCode, setPromoCode] = useState("");
        const [message, setMessage] = useState("");
        const [messageType, setMessageType] = useState<"success" | "error">("success");
        const [loading, setLoading] = useState(false);
        const { applyPromo, activeRide } = useRiderStore();

        const handleApply = async () => {
          if (!promoCode.trim()) return;
          setLoading(true);
          setMessage("");
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const token = session?.access_token;
            if (!token) { setMessage("Not authenticated"); setMessageType("error"); setLoading(false); return; }
            const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/promo/apply`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ code: promoCode.trim() }),
            });
            const data = await res.json();
            if (!res.ok) {
              setMessage(data.error || "Invalid promo code");
              setMessageType("error");
              return;
            }
            setMessage("Promo applied successfully!");
            setMessageType("success");
            if (applyPromo) await applyPromo(data.promo);
          } catch (err: any) {
            setMessage(err?.message || "Failed to apply promo");
            setMessageType("error");
            logger.error("Apply promo failed", err);
          } finally {
            setLoading(false);
          }
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Apply Promo</Text>
              <View className="w-[50px]" />
            </View>
            <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16 }}>
              <View className="mb-6">
                <Text className="text-[16px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-2">
                  Enter Promo Code
                </Text>
                <TextInput
                  className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[10px] px-[16px] py-[14px] text-[15px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark"
                  placeholder="Enter promo code"
                  placeholderTextColor="#9CA3AF"
                  value={promoCode}
                  onChangeText={setPromoCode}
                />
              </View>
              {message ? (
                <View className={`mb-4 p-[12px] rounded-[8px] bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border ${messageType === "success" ? "border-goPrimary" : "border-goDanger"}`}>
                  <Text className={`text-[14px] font-Jakarta ${messageType === "success" ? "text-goPrimary" : "text-goDanger"}`}>
                    {message}
                  </Text>
                </View>
              ) : null}
              <TouchableOpacity
                className={`rounded-full py-[14px] items-center mb-6 ${loading || !promoCode.trim() ? "bg-goBorderDark" : "bg-goPrimary"}`}
                onPress={handleApply}
                disabled={loading || !promoCode.trim()}
              >
                {loading ? (
                  <ActivityIndicator size={20} color="#FFFFFF" />
                ) : (
                  <Text className="text-[16px] font-JakartaBold text-goWhite">Apply</Text>
                )}
              </TouchableOpacity>
              <View>
                <Text className="text-[16px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-2">
                  Available Promos
                </Text>
                {AVAILABLE_PROMOS.map((promo) => (
                  <TouchableOpacity
                    key={promo.code}
                    className="flex-row items-center p-[12px] bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[8px] mb-2"
                    onPress={() => { setPromoCode(promo.code); }}
                  >
                    <View className="w-5 h-5 rounded-full bg-goPrimary mr-3" />
                    <View className="flex-1">
                      <Text className="text-[14px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">{promo.code}</Text>
                    </View>
                    <Text className="text-[12px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">{promo.description}</Text>
                  </TouchableOpacity>
                ))}
              </View>
            </ScrollView>
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(main)/(customer)/apply-promos/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

  # ===========================================================================
  # TASK 5: NO DRIVERS AVAILABLE (create)
  # ===========================================================================
  - id: "RIDER-028-NO-DRIVERS"
    screen_numbers: [35]
    wireframe: "## 32. Rider No Drivers Available"
    route_path: "app/(main)/(customer)/no-drivers-available/index.tsx"
    action: create
    note: >
      CREATE this file. Shown when dispatch cannot find any drivers.
