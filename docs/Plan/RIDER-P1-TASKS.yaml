  # TASK 14: SETTINGS PERSONAL INFO (create)
  # ===========================================================================
  - id: "RIDER-037-SETTINGS-PERSONAL-INFO"
    screen_numbers: [90]
    wireframe: "## 90. Settings - Personal Info"
    route_path: "app/(main)/(customer)/(tabs)/settings/personal-info/index.tsx"
    action: create
    note: >
      CREATE this file. Rider can view/edit name, upload photo, view email and
      phone (non-editable). CRITICAL FIX from v3.0: add missing useState and
      TextInput imports. Fix ImagePicker API — the old `result.cancelled` is
      deprecated; use `result.canceled` (single L, Expo SDK 52+).
    code_template: |
      import { useState } from "react";
      import { View, Text, TouchableOpacity, ScrollView, Image, TextInput, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import * as ImagePicker from "expo-image-picker";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";
      import { useRiderStore } from "@/store/useRiderStore";

      export default function SettingsPersonalInfo() {
        const { name, photo, setRider } = useRiderStore();
        const [localName, setLocalName] = useState(name || "");
        const [localPhoto, setLocalPhoto] = useState<string | null>(photo ?? null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const [successMessage, setSuccessMessage] = useState("");

        const pickImage = async () => {
          try {
            const result = await ImagePicker.launchImageLibraryAsync({
              mediaTypes: ImagePicker.MediaTypeOptions.Images,
              allowsEditing: true,
              aspect: [1, 1],
              quality: 0.8,
            });
            if (!result.canceled && result.assets[0]) {
              setLocalPhoto(result.assets[0].uri);
            }
          } catch (err) {
            logger.error("Image pick failed", err);
          }
        };

        const saveChanges = async () => {
          if (!localName.trim()) { setError("Name is required"); return; }
          setLoading(true); setError(""); setSuccessMessage("");
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const token = session?.access_token;
            if (!token) { setError("Not authenticated"); return; }
            const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/rider/profile`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ name: localName.trim(), photo_url: localPhoto }),
            });
            const data = await res.json();
            if (!res.ok) { setError(data.error || "Failed to save"); return; }
            if (setRider) setRider({ name: localName.trim(), photo: localPhoto ?? undefined } as any);
            setSuccessMessage("Profile updated successfully!");
