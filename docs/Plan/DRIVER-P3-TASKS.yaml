  # TASK 8: DRIVER CANCELLATION REASONS (create)
  # ===========================================================================
  - id: "DRIVER-043-CANCELLATION-REASONS"
    screen_numbers: [181]
    wireframe: "## 181. Driver Cancellation Reasons"
    route_path: "app/(main)/(rider)/cancellation-reasons/index.tsx"
    action: create
    note: >
      CREATE this file. Lists predefined cancellation reasons for the driver.
      Tapping a reason navigates back to home (simulating cancellation submission).
      useState tracks the selected reason for visual feedback before navigating.
      Header uses TouchableOpacity wrapping Text.
    code_template: |
      import { useState } from "react";
      import { View, Text, TouchableOpacity, ScrollView } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";

      const REASONS = [
        "Rider requested cancellation",
        "Wrong pickup address",
        "Emergency situation",
        "Vehicle mechanical issue",
        "Rider no-show",
        "Unsafe pickup location",
        "Payment issue",
        "Other reason",
      ];

      export default function CancellationReasons() {
        const [selected, setSelected] = useState("");

        const handleConfirm = () => {
          if (!selected) return;
          router.replace("/(main)/(rider)/(tabs)/home");
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Cancel Ride</Text>
              <View className="w-[50px]" />
            </View>
            <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16 }}>
              <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mb-3">Please select a reason for cancellation</Text>
              {REASONS.map((r) => (
                <TouchableOpacity
                  key={r}
                  className={`flex-row items-center p-[14px] mb-2 rounded-[12px] border ${
                    selected === r
                      ? "border-goPrimary bg-goAccentLight"
                      : "border-goBorderLight dark:border-goBorderDark bg-goSurfaceLight dark:bg-goSurfaceElevatedDark"
                  }`}
                  onPress={() => setSelected(r)}
                >
                  <View
                    className={`w-5 h-5 rounded-full border-2 mr-[12px] ${
                      selected === r ? "border-goPrimary bg-goPrimary" : "border-goBorderLight dark:border-goBorderDark"
                    }`}
                  />
                  <Text className="text-[15px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark">{r}</Text>
                </TouchableOpacity>
              ))}
              <TouchableOpacity
                className={`rounded-full w-full py-[16px] items-center mt-4 ${selected ? "bg-goPrimary" : "bg-goBorderDark"}`}
                onPress={handleConfirm}
                disabled={!selected}
              >
                <Text className="text-[18px] font-JakartaBold text-goWhite">Confirm Cancellation</Text>
              </TouchableOpacity>
            </ScrollView>
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(main)/(rider)/cancellation-reasons/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

  # ===========================================================================
  # TASK 9: DRIVER REFERRAL (create)
  # ===========================================================================
  - id: "DRIVER-044-REFERRAL"
    screen_numbers: [182]
    wireframe: "## 182. Driver Referral"
    route_path: "app/(main)/(rider)/referral/index.tsx"
    action: create
    note: >
      CREATE this file. Referral code screen that fetches the driver's referral code
      from the API and displays it with share and copy actions. Reward info is displayed
      prominently. Uses Clipboard for copy and Linking for SMS share.
      CRITICAL FIX from v3.0: referral code is NOW FETCHED from API
      (GET /api/driver/referral-code) instead of hardcoded "DRIVER-XYZ789".
      Loading/error states included. Uses full API call pattern.
    code_template: |
      import { useState, useEffect } from "react";
      import { View, Text, TouchableOpacity, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { Linking } from "react-native";
      import * as Clipboard from "expo-clipboard";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";

      export default function DriverReferral() {
        const [code, setCode] = useState("");
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState("");
        const [copied, setCopied] = useState(false);

        useEffect(() => {
          fetchReferralCode();
        }, []);

        const fetchReferralCode = async () => {
          setLoading(true); setError("");
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const token = session?.access_token;
            if (!token) { setError("Not authenticated"); return; }
            const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/driver/referral-code`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await res.json();
            if (!res.ok) { setError(data.error || "Failed to load referral code"); return; }
            setCode(data.code || data.referral_code || "");
          } catch (err: any) {
            setError(err?.message || "Network error");
            logger.error("Fetch referral code failed", err);
          } finally {
            setLoading(false);
          }
        };

        const handleCopy = async () => {
          await Clipboard.setStringAsync(code);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        };

        const handleShare = () => {
          const message = `Drive with GoRide and earn! Use my referral code: ${code}. Download the app to get started.`;
          Linking.openURL(`sms:?body=${encodeURIComponent(message)}`);
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Referral</Text>
              <View className="w-[50px]" />
            </View>
            <View className="flex-1 items-center justify-center px-[24px]">
              {loading ? (
                <ActivityIndicator size="large" color="#0CC25F" />
              ) : error ? (
                <View className="items-center">
                  <Text className="text-[15px] font-Jakarta text-goDanger mb-4 text-center">{error}</Text>
                  <TouchableOpacity
                    className="bg-goPrimary rounded-full px-[24px] py-[12px]"
                    onPress={fetchReferralCode}
                  >
                    <Text className="text-[16px] font-JakartaBold text-goWhite">Retry</Text>
                  </TouchableOpacity>
                </View>
              ) : (
                <>
                  <View className="w-24 h-24 rounded-full bg-goAccentLight items-center justify-center mb-6">
                    <Text className="text-[48px]">🤝</Text>
                  </View>
                  <Text className="text-[22px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-2">Refer & Earn</Text>
                  <Text className="text-[15px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark text-center mb-2">
                    Invite fellow drivers and earn ৳200 for every approved referral.
                  </Text>
                  <View className="flex-row items-center mb-3">
                    <Text className="text-[13px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mr-1">Total earned:</Text>
                    <Text className="text-[14px] font-JakartaBold text-goPrimary">৳800</Text>
                  </View>
                  <View className="w-full px-[20px] py-[16px] bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[12px] mb-4 items-center">
                    <Text className="text-[13px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mb-1">Your referral code</Text>
                    <Text className="text-[24px] font-JakartaBold text-goPrimary">{code}</Text>
                  </View>
                  <TouchableOpacity
                    className="bg-goPrimary rounded-full w-full py-[16px] items-center mb-3"
                    onPress={handleShare}
                  >
                    <Text className="text-[18px] font-JakartaBold text-goWhite">Share via SMS</Text>
                  </TouchableOpacity>
                  <TouchableOpacity
                    className={`border rounded-full w-full py-[16px] items-center ${
                      copied
                        ? "border-goPrimary bg-goAccentLight"
                        : "border-goBorderLight dark:border-goBorderDark"
                    }`}
                    onPress={handleCopy}
                  >
                    <Text
                      className={`text-[18px] font-JakartaBold ${
                        copied ? "text-goPrimary" : "text-goTextPrimaryLight dark:text-goTextPrimaryDark"
                      }`}
                    >
                      {copied ? "Copied!" : "Copy code"}
                    </Text>
                  </TouchableOpacity>
                </>
              )}
            </View>
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(main)/(rider)/referral/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }
