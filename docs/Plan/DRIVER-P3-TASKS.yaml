  - id: "DRIVER-037-SETTINGS-NOTIFICATIONS"
    screen_numbers: [172]
    wireframe: "## 172. Driver Settings - Notifications"
    route_path: "app/(main)/(rider)/settings/notifications/index.tsx"
    action: create
    note: >
      CREATE this file. Toggle switches for ride request notifications, promo alerts,
      and sound. Uses three useState boolean toggles with React Native Switch.
      Switch uses value + onValueChange (React Native API). trackColor and thumbColor
      are set with inline hex values because these are Switch-specific platform props
      that cannot use NativeWind classes.
      CRITICAL FIX from v3.0: header now uses TouchableOpacity wrapping Text (not Text onPress).
    code_template: |
      import { useState } from "react";
      import { View, Text, Switch, TouchableOpacity } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";

      interface ToggleRow {
        label: string;
        value: boolean;
        setter: (v: boolean) => void;
      }

      export default function DriverSettingsNotifications() {
        const [ride, setRide] = useState(true);
        const [promo, setPromo] = useState(true);
        const [sound, setSound] = useState(false);
        const [vibrate, setVibrate] = useState(true);

        const rows: ToggleRow[] = [
          { label: "Ride requests", value: ride, setter: setRide },
          { label: "Promos & offers", value: promo, setter: setPromo },
          { label: "Sounds", value: sound, setter: setSound },
          { label: "Vibration", value: vibrate, setter: setVibrate },
        ];

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Notifications</Text>
              <View className="w-[50px]" />
            </View>
            <View className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16 }}>
              {rows.map((row, i) => (
                <View
                  key={i}
                  className="flex-row justify-between items-center p-[14px] bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[12px] mb-3"
                >
                  <Text className="text-[15px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark">{row.label}</Text>
                  <Switch
                    value={row.value}
                    onValueChange={row.setter}
                    trackColor={{ false: "#D1D5DB", true: "#0CC25F" }}
                    thumbColor="#FFFFFF"
                  />
                </View>
              ))}
            </View>
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(main)/(rider)/settings/notifications/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

