    extra_files:
      - path: "app/(main)/(rider)/settings/change-password/index.tsx"
        code_template: |
          import { useState } from "react";
          import { View, Text, TextInput, TouchableOpacity, ActivityIndicator } from "react-native";
          import { SafeAreaView } from "react-native-safe-area-context";
          import { router } from "expo-router";
          import { supabase } from "@/lib/supabase";
          import { logger } from "@/lib/logger";

          export default function ChangePassword() {
            const [current, setCurrent] = useState("");
            const [password, setPassword] = useState("");
            const [confirm, setConfirm] = useState("");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [success, setSuccess] = useState(false);

            const handleChange = async () => {
              if (!current || !password || !confirm) { setError("All fields are required"); return; }
              if (password.length < 8) { setError("Password must be at least 8 characters"); return; }
              if (password !== confirm) { setError("Passwords do not match"); return; }
              setLoading(true); setError("");
              try {
                const { data: { session } } = await supabase.auth.getSession();
                const token = session?.access_token;
                if (!token) { setError("Not authenticated"); return; }
                const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/auth/change-password`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                  body: JSON.stringify({ current_password: current, new_password: password }),
                });
                const data = await res.json();
                if (!res.ok) { setError(data.error || "Failed to change password"); return; }
                setSuccess(true);
                setTimeout(() => router.back(), 1500);
              } catch (err: any) {
                setError(err?.message || "Network error");
                logger.error("Change password failed", err);
              } finally {
                setLoading(false);
              }
            };

            return (
              <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
                <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
                  <TouchableOpacity onPress={() => router.back()}>
                    <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
                  </TouchableOpacity>
                  <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Change Password</Text>
                  <View className="w-[50px]" />
                </View>
                <View className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16 }}>
                  {success ? (
                    <View className="items-center justify-center flex-1">
                      <View className="w-20 h-20 rounded-full bg-goAccentLight items-center justify-center mb-4">
                        <Text className="text-[40px]">✅</Text>
                      </View>
                      <Text className="text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Password changed</Text>
                    </View>
                  ) : (
                    <>
                      <TextInput
                        className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[10px] px-[16px] py-[14px] text-[15px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-3"
                        placeholder="Current password"
                        placeholderTextColor="#9CA3AF"
                        secureTextEntry
                        value={current}
                        onChangeText={setCurrent}
                      />
                      <TextInput
                        className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[10px] px-[16px] py-[14px] text-[15px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-3"
                        placeholder="New password (min 8 characters)"
                        placeholderTextColor="#9CA3AF"
                        secureTextEntry
                        value={password}
                        onChangeText={setPassword}
                      />
                      <TextInput
                        className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[10px] px-[16px] py-[14px] text-[15px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-4"
                        placeholder="Confirm new password"
                        placeholderTextColor="#9CA3AF"
                        secureTextEntry
                        value={confirm}
                        onChangeText={setConfirm}
                      />
                      {error ? (
                        <Text className="text-[14px] font-Jakarta text-goDanger mb-3">{error}</Text>
                      ) : null}
                      <TouchableOpacity
                        className={`rounded-full py-[16px] items-center ${loading ? "bg-goBorderDark" : "bg-goPrimary"}`}
                        onPress={handleChange}
                        disabled={loading}
                      >
                        {loading ? (
                          <ActivityIndicator size={20} color="#FFFFFF" />
                        ) : (
                          <Text className="text-[18px] font-JakartaBold text-goWhite">Update Password</Text>
                        )}
                      </TouchableOpacity>
                    </>
                  )}
                </View>
              </SafeAreaView>
            );
          }
    verification:
      - { type: file_exists, path: "app/(main)/(rider)/settings/account-security/index.tsx" }
      - { type: file_exists, path: "app/(main)/(rider)/settings/change-password/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

  # ===========================================================================
  # TASK 4: DRIVER SETTINGS — APPEARANCE + LANGUAGE (create)
