        code_template: |
          import { useState } from "react";
          import { View, Text, TouchableOpacity, ActivityIndicator } from "react-native";
          import { SafeAreaView } from "react-native-safe-area-context";
          import { router, useLocalSearchParams } from "expo-router";
          import { supabase } from "@/lib/supabase";
          import { logger } from "@/lib/logger";

          const METHODS = [
            { key: "bkash", label: "bKash", icon: "💸" },
            { key: "nagad", label: "Nagad", icon: "📱" },
            { key: "card", label: "Credit/Debit Card", icon: "💳" },
          ];

          export default function TopUpMethod() {
            const { amount } = useLocalSearchParams<{ amount: string }>();
            const [selectedMethod, setSelectedMethod] = useState("");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");

            const handlePay = async () => {
              if (!selectedMethod) { setError("Please select a payment method"); return; }
              setLoading(true); setError("");
              try {
                const { data: { session } } = await supabase.auth.getSession();
                const token = session?.access_token;
                if (!token) { setError("Not authenticated"); return; }
                const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/rider/topup`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                  body: JSON.stringify({ amount_bdt: parseInt(amount || "500", 10) * 100, method: selectedMethod }),
                });
                const data = await res.json();
                if (!res.ok) { setError(data.error || "Payment failed"); return; }
                router.replace(`/(main)/(customer)/(tabs)/settings/top-up-success?amount=${amount}`);
              } catch (err: any) {
                setError(err?.message || "Network error");
                logger.error("Top-up payment failed", err);
              } finally {
                setLoading(false);
              }
            };

            return (
              <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
                <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
                  <TouchableOpacity onPress={() => router.back()}>
                    <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
                  </TouchableOpacity>
                  <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Payment Method</Text>
                  <View className="w-[50px]" />
                </View>
                <View className="flex-1 px-[24px] pt-[24px]">
                  <Text className="text-[15px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mb-1">
                    Amount
                  </Text>
                  <Text className="text-[28px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-6">
                    ৳{amount ?? "500"}
                  </Text>
                  {METHODS.map((m) => (
                    <TouchableOpacity
                      key={m.key}
                      className={`flex-row items-center p-[14px] rounded-[12px] border mb-3 ${
                        selectedMethod === m.key
                          ? "bg-goAccentLight border-goPrimary"
                          : "bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border-goBorderLight dark:border-goBorderDark"
                      }`}
                      onPress={() => setSelectedMethod(m.key)}
                    >
                      <View className="w-10 h-10 rounded-full bg-goAccentLight items-center justify-center mr-3">
                        <Text className="text-[20px]">{m.icon}</Text>
                      </View>
                      <Text className="text-[15px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">{m.label}</Text>
                      <View className="ml-auto">
                        <View className={`w-5 h-5 rounded-full border-2 items-center justify-center ${
                          selectedMethod === m.key ? "border-goPrimary bg-goPrimary" : "border-goBorderLight dark:border-goBorderDark"
                        }`}>
                          {selectedMethod === m.key && <Text className="text-[12px] text-goWhite">✓</Text>}
                        </View>
                      </View>
                    </TouchableOpacity>
                  ))}
                  {error ? (
                    <Text className="text-[14px] font-Jakarta text-goDanger mb-3">{error}</Text>
                  ) : null}
                  <TouchableOpacity
                    className={`rounded-full w-full py-[16px] items-center mt-4 ${loading || !selectedMethod ? "bg-goBorderDark" : "bg-goPrimary"}`}
                    onPress={handlePay}
                    disabled={loading || !selectedMethod}
                  >
                    {loading ? (
                      <ActivityIndicator size={20} color="#FFFFFF" />
                    ) : (
                      <Text className="text-[18px] font-JakartaBold text-goWhite">Pay ৳{amount ?? "500"}</Text>
                    )}
                  </TouchableOpacity>
                </View>
              </SafeAreaView>
            );
          }
