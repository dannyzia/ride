  - id: "RIDER-059-SHARE-TRIP-STATUS"
    screen_numbers: [41]
    wireframe: "## 41. Share Trip Status"
    route_path: "app/(main)/(customer)/share-trip/index.tsx"
    action: create
    note: >
      CREATE this file. Allows the rider to share their live trip status with
      trusted contacts. Uses hardcoded contacts as placeholder — in production
      this would fetch from the contacts API or user's saved trusted contacts.
      The share action uses the Share API or SMS intent.
    code_template: |
      import { useState } from "react";
      import { View, Text, TouchableOpacity, ScrollView, Share, Linking } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { logger } from "@/lib/logger";
      import { useRiderStore } from "@/store/useRiderStore";

      export default function ShareTripStatus() {
        const { activeRide } = useRiderStore();
        const [selected, setSelected] = useState<number[]>([]);

        const contacts = [
          { id: 1, name: "Mom", phone: "+8801XXXXXXXXX" },
          { id: 2, name: "Rahim", phone: "+8801XXXXXXXXX" },
          { id: 3, name: "Work Group", phone: "+8801XXXXXXXXX" },
        ];

        const toggleSelect = (id: number) => {
          setSelected((prev) =>
            prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
          );
        };

        const handleShare = async () => {
          const tripLink = `https://ride.bd/track/${activeRide?.id ?? "demo"}`;
          const message = `I'm on a Ride trip! Track me live: ${tripLink}`;
          try {
            await Share.share({ message });
          } catch (err: any) {
            logger.error("Share trip failed", err);
          }
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
