            useEffect(() => {
              let cancelled = false;
              (async () => {
                try {
                  setLoading(true); setError("");
                  const { data: { session } } = await supabase.auth.getSession();
                  const token = session?.access_token;
                  if (!token) { setError("Not authenticated"); setLoading(false); return; }
                  const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/rider/addresses/${id}`, {
                    headers: { Authorization: `Bearer ${token}` },
                  });
                  const data = await res.json();
                  if (!res.ok) { setError(data.error || "Failed to load"); return; }
                  if (!cancelled) setAddress(data.address);
                } catch (err: any) {
                  if (!cancelled) setError(err?.message || "Network error");
                } finally {
                  if (!cancelled) setLoading(false);
                }
              })();
              return () => { cancelled = true; };
            }, [id]);

            const handleDelete = () => {
              Alert.alert(
                "Delete Address",
                `Are you sure you want to delete "${address?.label}"?`,
                [
                  { text: "Cancel", style: "cancel" },
                  {
                    text: "Delete",
                    style: "destructive",
                    onPress: async () => {
                      setDeleting(true);
                      try {
                        const { data: { session } } = await supabase.auth.getSession();
                        const token = session?.access_token;
                        if (!token) { setError("Not authenticated"); return; }
                        const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/rider/addresses/${id}`, {
                          method: "DELETE",
                          headers: { Authorization: `Bearer ${token}` },
                        });
                        if (!res.ok) {
                          const data = await res.json();
                          setError(data.error || "Failed to delete");
                          return;
                        }
                        router.replace("/(main)/(customer)/(tabs)/settings/saved-addresses");
                      } catch (err: any) {
                        setError(err?.message || "Network error");
                        logger.error("Delete address failed", err);
                      } finally {
                        setDeleting(false);
                      }
                    },
                  },
                ]
              );
            };

            return (
              <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
                <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
                  <TouchableOpacity onPress={() => router.back()}>
                    <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
                  </TouchableOpacity>
                  <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Address</Text>
                  <TouchableOpacity onPress={() => setShowMore(!showMore)}>
                    <Text className="text-[18px] text-goTextSecondaryLight dark:text-goTextSecondaryDark">⋯</Text>
                  </TouchableOpacity>
                </View>
                {loading ? (
                  <View className="flex-1 items-center justify-center">
                    <ActivityIndicator size="large" color="#0CC25F" />
                  </View>
                ) : error ? (
                  <View className="flex-1 items-center justify-center px-[24px]">
                    <Text className="text-[16px] font-Jakarta text-goDanger text-center">{error}</Text>
                  </View>
                ) : address ? (
                  <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 24 }}>
                    <View className="items-center mb-6">
                      <View className="w-20 h-20 rounded-full bg-goAccentLight items-center justify-center mb-3">
                        <Text className="text-[32px]">📍</Text>
                      </View>
                      <Text className="text-[22px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">{address.label}</Text>
                    </View>
                    <View className="p-[16px] bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[12px]">
                      <Text className="text-[15px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark">{address.address_line}</Text>
                      {address.lat && address.lng && (
                        <Text className="text-[13px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark mt-2">
                          {address.lat.toFixed(6)}, {address.lng.toFixed(6)}
                        </Text>
                      )}
                    </View>
                    {showMore && (
                      <View className="mt-4">
                        <TouchableOpacity
                          className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[12px] py-[14px] items-center mb-3"
                          onPress={() => router.push(`/(main)/(customer)/(tabs)/settings/saved-addresses/add-address?edit=${address.id}`)}
                        >
                          <Text className="text-[15px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Edit Address</Text>
                        </TouchableOpacity>
                        <TouchableOpacity
                          className="bg-goDanger rounded-[12px] py-[14px] items-center"
                          onPress={handleDelete}
                          disabled={deleting}
                        >
                          {deleting ? (
                            <ActivityIndicator size={20} color="#FFFFFF" />
                          ) : (
                            <Text className="text-[15px] font-JakartaBold text-goWhite">Delete Address</Text>
                          )}
                        </TouchableOpacity>
                      </View>
                    )}
                  </ScrollView>
                ) : (
                  <View className="flex-1 items-center justify-center px-[24px]">
                    <Text className="text-[16px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">Address not found</Text>
                  </View>
                )}
              </SafeAreaView>
            );
          }
