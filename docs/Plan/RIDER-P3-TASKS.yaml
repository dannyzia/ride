    code_template: |
      import { useState, useEffect } from "react";
      import { View, Text, TouchableOpacity, ScrollView, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";

      interface SavedAddress {
        id: string;
        label: string;
        address_line: string;
        lat: number | null;
        lng: number | null;
      }

      export default function SavedAddresses() {
        const [addresses, setAddresses] = useState<SavedAddress[]>([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState("");

        const fetchAddresses = async () => {
          try {
            setLoading(true); setError("");
            const { data: { session } } = await supabase.auth.getSession();
            const token = session?.access_token;
            if (!token) { setError("Not authenticated"); setLoading(false); return; }
            const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/rider/addresses`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await res.json();
            if (!res.ok) { setError(data.error || "Failed to load addresses"); return; }
            setAddresses(data.addresses || []);
          } catch (err: any) {
            setError(err?.message || "Network error");
            logger.error("Fetch addresses failed", err);
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          fetchAddresses();
        }, []);

        const getIcon = (label: string) => {
          const lower = label.toLowerCase();
          if (lower.includes("home")) return "🏠";
          if (lower.includes("work") || lower.includes("office")) return "💼";
          return "📍";
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
