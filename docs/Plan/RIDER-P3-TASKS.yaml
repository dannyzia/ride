  # ===========================================================================
  # TASK 2: FARES AFTER PROMO (create)
  # ===========================================================================
  - id: "RIDER-056-FARES-AFTER-PROMO"
    screen_numbers: [29, 30]
    wireframe: "## 29. Available Options & Fares After Promo - Expanded View / ## 30. Available Options & Fares After Promo"
    route_path: "app/(main)/(customer)/fares-after-promo/index.tsx"
    action: create
    note: >
      CREATE this file. Displays fare estimates after a promo code has been applied.
      Data comes from useRiderStore (estimates + appliedPromo). All amounts are
      integer paisa — divide by 100 at display.
    code_template: |
      import { useState, useEffect } from "react";
      import { View, Text, TouchableOpacity, ScrollView, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";
      import { useRiderStore } from "@/store/useRiderStore";

      export default function FaresAfterPromo() {
        const { estimates, appliedPromo, pickupCoords, dropoffCoords } = useRiderStore();
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const [localEstimates, setLocalEstimates] = useState<any[]>([]);

        useEffect(() => {
          let cancelled = false;
          (async () => {
            if (estimates && estimates.length > 0) {
              setLocalEstimates(estimates);
              return;
            }
            try {
              setLoading(true); setError("");
              const { data: { session } } = await supabase.auth.getSession();
              const token = session?.access_token;
              if (!token) { setError("Not authenticated"); setLoading(false); return; }
              const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/ride/estimate`, {
                method: "POST",
                headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                body: JSON.stringify({
                  pickup_lat: pickupCoords?.lat ?? 23.8103,
                  pickup_lng: pickupCoords?.lng ?? 90.4125,
                  dropoff_lat: dropoffCoords?.lat ?? 23.7936,
                  dropoff_lng: dropoffCoords?.lng ?? 90.4043,
                }),
              });
              const data = await res.json();
              if (!res.ok) { setError(data.error || "Failed to load fares"); return; }
              if (!cancelled) setLocalEstimates(data.estimates || []);
            } catch (err: any) {
              if (!cancelled) setError(err?.message || "Network error");
            } finally {
              if (!cancelled) setLoading(false);
            }
          })();
          return () => { cancelled = true; };
        }, []);

        const handleConfirm = () => {
          router.push("/(main)/(customer)/confirm-ride");
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Trip Fares</Text>
              <View className="w-[50px]" />
            </View>
            {appliedPromo && (
              <View className="mx-[24px] mt-[12px] p-[10px] bg-goAccentLight rounded-[8px]">
                <Text className="text-[14px] font-JakartaBold text-goPrimary">
                  Promo {appliedPromo.code} applied — {appliedPromo.description}
                </Text>
              </View>
            )}
            {loading ? (
              <View className="flex-1 items-center justify-center">
                <ActivityIndicator size="large" color="#0CC25F" />
              </View>
            ) : error ? (
              <View className="flex-1 items-center justify-center px-[24px]">
                <Text className="text-[16px] font-Jakarta text-goDanger text-center">{error}</Text>
              </View>
            ) : (
              <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16 }}>
                {(localEstimates.length > 0 ? localEstimates : (estimates ?? [])).map((est: any, i: number) => (
                  <View key={i} className="flex-row justify-between items-center p-[14px] bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[12px] mb-3">
                    <View>
                      <Text className="text-[15px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">
                        {est.vehicle_type.replace(/_/g, " ").replace(/\b\w/g, (c: string) => c.toUpperCase())}
                      </Text>
                      <Text className="text-[13px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">
                        {est.eta_minutes ?? "—"} min · {est.distance_km ?? "—"} km
                      </Text>
                    </View>
                    <Text className="text-[15px] font-JakartaBold text-goPrimary">
                      ৳{(est.total_bdt / 100).toFixed(0)}
                    </Text>
                  </View>
                ))}
                <TouchableOpacity
                  className="bg-goPrimary rounded-full w-full py-[16px] items-center mt-4"
                  onPress={handleConfirm}
                >
                  <Text className="text-[18px] font-JakartaBold text-goWhite">Confirm & Find Ride</Text>
                </TouchableOpacity>
              </ScrollView>
            )}
          </SafeAreaView>
        );
      }
    verification:
