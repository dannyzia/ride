              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Saved Addresses</Text>
              <View className="w-[50px]" />
            </View>
            {loading ? (
              <View className="flex-1 items-center justify-center">
                <ActivityIndicator size="large" color="#0CC25F" />
              </View>
            ) : error ? (
              <View className="flex-1 items-center justify-center px-[24px]">
                <Text className="text-[16px] font-Jakarta text-goDanger text-center">{error}</Text>
              </View>
            ) : (
              <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16 }}>
                {addresses.length === 0 ? (
                  <Text className="text-[15px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark text-center py-[24px]">
                    No saved addresses yet
                  </Text>
                ) : (
                  addresses.map((a) => (
                    <TouchableOpacity
                      key={a.id}
                      className="flex-row justify-between items-center p-[14px] bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[12px] mb-3"
                      onPress={() => router.push(`/(main)/(customer)/(tabs)/settings/saved-addresses/${a.id}`)}
                    >
                      <View className="flex-row items-center flex-1">
                        <View className="w-10 h-10 rounded-full bg-goAccentLight items-center justify-center mr-3">
                          <Text className="text-[18px]">{getIcon(a.label)}</Text>
                        </View>
                        <View className="flex-1">
                          <Text className="text-[15px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">{a.label}</Text>
                          <Text className="text-[13px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark" numberOfLines={1}>
                            {a.address_line}
                          </Text>
                        </View>
                      </View>
                      <Text className="text-[18px] text-goTextSecondaryLight dark:text-goTextSecondaryDark">›</Text>
                    </TouchableOpacity>
                  ))
                )}
                <TouchableOpacity
                  className="bg-goPrimary rounded-full w-full py-[16px] items-center mt-4"
                  onPress={() => router.push("/(main)/(customer)/(tabs)/settings/saved-addresses/add-address")}
                >
                  <Text className="text-[18px] font-JakartaBold text-goWhite">+ Add address</Text>
                </TouchableOpacity>
              </ScrollView>
            )}
          </SafeAreaView>
        );
      }
