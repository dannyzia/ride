  # ===========================================================================
  - id: "RIDER-020-RATE"
    screen_numbers: [46]
    wireframe: "## 46. Rate the Driver"
    route_path: "app/(main)/(customer)/rate-driver/index.tsx"
    action: create
    code_template: |
      import { useState } from "react";
      import { View, Text, TextInput, TouchableOpacity, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";
      import { useRiderStore } from "@/store/useRiderStore";

      export default function RateDriver() {
        const { activeRide } = useRiderStore();
        const [rating, setRating] = useState(0);
        const [feedback, setFeedback] = useState("");
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const driver = activeRide?.driver;

        const handleSubmit = async () => {
          if (rating === 0) { setError("Please select a rating"); return; }
          setLoading(true); setError("");
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const token = session?.access_token;
            if (!token) { setError("Not authenticated"); return; }
            const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/ride/${activeRide?.id}/rate`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ rating, feedback: feedback.trim() || undefined }),
            });
            const data = await res.json();
            if (!res.ok) { setError(data.error || "Failed to submit"); return; }
            router.replace("/(main)/(customer)/ride-completed");
          } catch (err: any) {
            setError(err?.message || "Network error");
            logger.error("Rate driver failed", err);
          } finally {
            setLoading(false);
          }
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <Text className="text-[16px] font-Jakarta text-goPrimary" onPress={() => router.back()}>Back</Text>
