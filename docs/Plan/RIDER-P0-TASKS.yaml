  - id: "RIDER-015-VEHICLE"
    screen_numbers: [23]
    wireframe: "## 23. Select Vehicle Type Under Category"
    route_path: "app/(main)/(customer)/select-vehicle/index.tsx"
    action: create
    code_template: |
      import { useState, useEffect } from "react";
      import { ScrollView, View, Text, TouchableOpacity, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router, useLocalSearchParams } from "expo-router";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";
      import { VEHICLE_TYPES } from "@/lib/vehicleTypes";

      const CATEGORY_MAP: Record<string, string[]> = {
        bike: ["bike_basic", "bike_standard", "bike_plus"],
        cng: ["cng"],
        car: ["car_economy", "car_comfort", "car_premium"],
        car_xl: ["car_xl"],
      };

      export default function SelectVehicle() {
        const { category } = useLocalSearchParams<{ category: string }>();
        const [estimates, setEstimates] = useState<any[]>([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState("");
        const types = CATEGORY_MAP[category || "car"] || [];

        useEffect(() => {
          let cancelled = false;
          (async () => {
            try {
              setLoading(true); setError("");
              const { data: { session } } = await supabase.auth.getSession();
              const token = session?.access_token;
              if (!token) { setError("Not authenticated"); setLoading(false); return; }
              const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/ride/estimate`, {
                method: "POST",
                headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                body: JSON.stringify({ pickup_lat: 23.8103, pickup_lng: 90.4125, dropoff_lat: 23.7936, dropoff_lng: 90.4043 }),
              });
              const data = await res.json();
              if (!res.ok) { setError(data.error || "Failed"); return; }
              if (!cancelled) setEstimates(data.estimates || []);
            } catch (err: any) {
              if (!cancelled) setError(err?.message || "Network error");
            } finally {
              if (!cancelled) setLoading(false);
            }
          })();
          return () => { cancelled = true; };
        }, []);

        const filtered = estimates.filter((e: any) => types.includes(e.vehicle_type));

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <Text className="text-[16px] font-Jakarta text-goPrimary" onPress={() => router.back()}>Back</Text>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Select Vehicle</Text>
              <View className="w-[50px]" />
            </View>
            {loading ? (
              <View className="flex-1 items-center justify-center"><ActivityIndicator size="large" color="#0CC25F" /></View>
            ) : error ? (
              <View className="flex-1 items-center justify-center px-[24px]"><Text className="text-goDanger font-Jakarta text-center">{error}</Text></View>
            ) : filtered.length === 0 ? (
              <View className="flex-1 items-center justify-center px-[24px]"><Text className="font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">No vehicles available for this category</Text></View>
            ) : (
              <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16, gap: 12 }}>
                {filtered.map((est: any) => {
                  const def = VEHICLE_TYPES.find((v) => v.key === est.vehicle_type);
                  return (
                    <TouchableOpacity
                      key={est.vehicle_type}
                      className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[16px] p-[16px]"
                      onPress={() => router.push(`/(main)/(customer)/book-ride?vehicle_type=${est.vehicle_type}`)}
                    >
                      <View className="flex-row justify-between items-center">
                        <View>
                          <Text className="text-[16px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">
                            {def?.display_en ?? est.vehicle_type}
                          </Text>
                          <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark">
                            {est.eta_minutes} min · {def?.seats} seats{def?.has_ac ? " · AC" : ""}
                          </Text>
                        </View>
                        <Text className="text-[18px] font-JakartaBold text-goPrimary">
                          ৳{(est.total_bdt / 100).toFixed(0)}
                        </Text>
                      </View>
                    </TouchableOpacity>
                  );
                })}
              </ScrollView>
            )}
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(main)/(customer)/select-vehicle/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

