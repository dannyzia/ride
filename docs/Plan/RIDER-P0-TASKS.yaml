    code_template: |
      import { useState, useEffect } from "react";
      import { View, Text, ScrollView, ActivityIndicator } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { supabase } from "@/lib/supabase";
      import { logger } from "@/lib/logger";
      import VehicleCategoryCard from "@/components/VehicleCategoryCard";

      const CATEGORIES: { key: string; icon: string; label: string; types: string[] }[] = [
        { key: "bike", icon: "🏍️", label: "Bike", types: ["bike_basic", "bike_standard", "bike_plus"] },
        { key: "cng", icon: "🛺", label: "CNG", types: ["cng"] },
        { key: "car", icon: "🚗", label: "Car", types: ["car_economy", "car_comfort", "car_premium"] },
        { key: "car_xl", icon: "🚐", label: "Car XL", types: ["car_xl"] },
      ];

      export default function SelectCategory() {
        const [estimates, setEstimates] = useState<any[]>([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState("");

        useEffect(() => {
          let cancelled = false;
          (async () => {
            try {
              setLoading(true); setError("");
              const { data: { session } } = await supabase.auth.getSession();
              const token = session?.access_token;
              if (!token) { setError("Not authenticated"); setLoading(false); return; }
              const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/ride/estimate`, {
                method: "POST",
                headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                body: JSON.stringify({
                  pickup_lat: 23.8103,
                  pickup_lng: 90.4125,
                  dropoff_lat: 23.7936,
                  dropoff_lng: 90.4043,
                }),
              });
              const data = await res.json();
              if (!res.ok) { setError(data.error || "Failed to load estimates"); return; }
              if (!cancelled) setEstimates(data.estimates || []);
            } catch (err: any) {
              if (!cancelled) setError(err?.message || "Network error");
            } finally {
              if (!cancelled) setLoading(false);
            }
          })();
          return () => { cancelled = true; };
        }, []);

        const getFareForCategory = (types: string[]): number => {
          const est = estimates.find((e: any) => types.includes(e.vehicle_type));
          return est?.total_bdt ?? 0;
        };
        const getEtaForCategory = (types: string[]): number => {
          const est = estimates.find((e: any) => types.includes(e.vehicle_type));
          return est?.eta_minutes ?? 5;
        };

        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <Text className="text-[16px] font-Jakarta text-goPrimary" onPress={() => router.back()}>Back</Text>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Select Category</Text>
              <View className="w-[50px]" />
            </View>
            {loading ? (
              <View className="flex-1 items-center justify-center">
                <ActivityIndicator size="large" color="#0CC25F" />
              </View>
            ) : error ? (
              <View className="flex-1 items-center justify-center px-[24px]">
                <Text className="text-[16px] font-Jakarta text-goDanger text-center">{error}</Text>
              </View>
            ) : (
              <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingVertical: 16, gap: 12 }}>
                {CATEGORIES.map((cat) => (
                  <VehicleCategoryCard
                    key={cat.key}
                    icon={cat.icon}
                    label={cat.label}
                    estimatedFare={getFareForCategory(cat.types)}
                    eta={getEtaForCategory(cat.types)}
                    onPress={() => router.push(`/(main)/(customer)/select-vehicle?category=${cat.key}`)}
                  />
                ))}
              </ScrollView>
            )}
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(main)/(customer)/select-category/index.tsx" }
      - { type: file_exists, path: "components/VehicleCategoryCard.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

