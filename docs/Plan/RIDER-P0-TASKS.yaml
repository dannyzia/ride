# =============================================================================
# RIDER-P0-TASKS.yaml v4.0 — ZERO-ASSUMPTION AGENT SPEC
# =============================================================================
# INSTRUCTIONS FOR THE CODING AGENT:
#
#   You are building React Native screens for an Expo Router app. You MUST
#   follow every rule below exactly. Do NOT guess, do NOT use "typical" RN
#   patterns unless they match what's written here. If you are unsure about
#   ANYTHING, read the code_template — it contains the COMPLETE, correct code.
#
#   HOW TO USE THIS FILE:
#   1. Read the global_rules section ONCE and remember all rules.
#   2. For each task: read the entire task block before writing ANY code.
#   3. Copy the code_template EXACTLY — it is compilable JavaScript.
#   4. Run the verification steps for each task before marking it done.
#   5. After ALL tasks: run "npx tsc --noEmit" from the project root.
#
#   IF A TASK SAYS "audit_and_fix": the file ALREADY EXISTS. Only apply the
#   find/replace pairs listed in the "fixes" section. Do NOT recreate the file.
#
#   IF A TASK SAYS "create": use the code_template AS-IS. Copy it, paste it
#   into the file at route_path. Do not add or remove features.
# =============================================================================
version: "4.0"
project: Ride
role: rider
priority_class: P0
total_tasks: 23

# =============================================================================
# GLOBAL RULES — MEMORIZE THESE. EVERY TASK MUST FOLLOW ALL OF THEM.
# =============================================================================
global_rules:

  # --- FRAMEWORK & STACK (verified against package.json) ---
  framework:
    - "Expo Router (file-based routing). NO react-navigation imports."
    - "NOT Next.js. Dynamic route params come directly as 2nd arg to handlers."
    - "app/(main)/(customer)/ for rider screens"
    - "app/(auth)/ for auth screens (NO header — _layout.tsx sets headerShown:false)"
    - "components/ for shared components (flat folder, no subfolder)"
    - "theme/goRide.ts for design tokens (import colors, fonts, radii, spacing)"

  # --- STATE MANAGEMENT ---
  state:
    - "Zustand only. NO Redux, NO React Context for business state, NO useState for cross-screen data."
    - "useRiderStore from @/store/useRiderStore (direct import, NOT barrel)"
    - "useCustomer from @/store (barrel re-export)"
    - "useWSStore from @/store (barrel)"
    - "useAppUserStore from @/store (barrel)"
    - "DO NOT import useRiderStore from @/store — it is a SEPARATE file at @/store/useRiderStore"

  # --- STYLING (NativeWind only. NO StyleSheet.create.) ---
  styling:
    font_heading: "font-JakartaBold"        # for screen titles, headings
    font_body:    "font-Jakarta"             # for body text, labels, secondary
    font_semibold:"font-JakartaSemiBold"     # for subheadings, card titles
    bg_light:     "bg-goBgLight"             # light mode background
    bg_dark:      "dark:bg-goBgDark"         # dark mode background (always pair with bg_light)
    surface_light:"bg-goSurfaceLight"        # light mode card/input bg
    surface_dark: "dark:bg-goSurfaceElevatedDark" # dark mode card/input bg
    border_light: "border-goBorderLight"     # light mode border
    border_dark:  "dark:border-goBorderDark" # dark mode border
    text_primary_l: "text-goTextPrimaryLight"
    text_primary_d: "dark:text-goTextPrimaryDark"
    text_secondary_l: "text-goTextSecondaryLight"
    text_secondary_d: "dark:text-goTextSecondaryDark"
    primary:      "text-goPrimary"           # green brand color for text
    primary_bg:   "bg-goPrimary"             # green brand for button backgrounds
    danger_text:  "text-goDanger"            # red for errors/cancel
    danger_bg:    "bg-goDanger"              # red for destructive buttons
    white_text:   "text-goWhite"             # white text on colored buttons
    accent_light: "bg-goAccentLight"         # light green tint for highlight areas

    # BANNED patterns (do NOT use these — they do not exist in tailwind.config.js):
    banned:
      - "font-[Urbanist] OR font-urbanist-bold OR font-inter — use font-JakartaBold / font-Jakarta instead"
      - "bg-[#FAFAFA] OR bg-[#F5F5F5] OR bg-[#EEEEEE] — use bg-goBgLight or bg-goSurfaceLight"
      - "text-[#616161] OR text-[#1F222A] — use text-goTextSecondaryLight"
      - "StyleSheet.create({...}) — use NativeWind className only"
      - "Any inline hex color in className like bg-[#0CC25F] — use bg-goPrimary"

    # MANDATORY: Every color-bearing className MUST have a dark: variant. Examples:
    mandatory_dark_example:
      correct: "className='bg-white dark:bg-goBgDark border border-goBorderLight dark:border-goBorderDark'"
      wrong:   "className='bg-white border border-goBorderLight'  ← missing dark:"

  # --- IMPORTS (exact paths — do not guess or modify) ---
  imports:
    safe_area:  "import { SafeAreaView } from 'react-native-safe-area-context'"
    router:     "import { router } from 'expo-router'"
    router_hook:"import { useRouter } from 'expo-router'  # only when you need the hook (not push/back)"
    local_params:"import { useLocalSearchParams } from 'expo-router'"
    supabase:   "import { supabase } from '@/lib/supabase'"
    logger:     "import { logger } from '@/lib/logger'"
    colors:     "import { colors } from '@/theme/goRide'"
    status_bar: "import { StatusBar } from 'react-native'  # NOT expo-status-bar"
    rn_core:    "import { View, Text, TouchableOpacity, TextInput, ActivityIndicator, ScrollView } from 'react-native'"

    # NEVER import store/useRiderStore from @/store. ALWAYS use @/store/useRiderStore directly.
    rider_store:"import { useRiderStore } from '@/store/useRiderStore'"
    customer_store: "import { useCustomer } from '@/store'"
    ws_store:   "import { useWSStore } from '@/store'"

    # Available components (check components/ folder before creating new ones):
    components_available:
      - "CustomButton from @/components/CustomButton  → BG variant: primary=green, success=green, danger=red, outline=transparent"
      - "InputField from @/components/InputField"
      - "RideLayout from @/components/RideLayout  → wraps screen with map+header"
      - "BarikoiAutocomplete from @/components/BarikoiAutocomplete"
      - "SOSButton from @/components/SOSButton"
      - "ChatScreen from @/components/ChatScreen"
      - "SlideButton from @/components/SlideButton"

  # --- NAVIGATION ---
  navigation:
    push: "router.push('/path') — go forward to a screen"
    back: "router.back() — go back one screen"
    replace: "router.replace('/path') — replace current screen (no back stack)"
    params: "useLocalSearchParams<{ key: string }>() — read URL query params"
    route_path_format: "app/(main)/(customer)/screen-name/index.tsx"

  # --- API CALL PATTERN (use for EVERY fetch) ---
  api_pattern: |
    EVERY API call MUST follow this exact pattern:
    1. const [loading, setLoading] = useState(false);
    2. const [error, setError] = useState('');
    3. const { data: { session } } = await supabase.auth.getSession();
    4. const token = session?.access_token;
    5. if (!token) { setError('Not authenticated'); return; }
    6. try {
         setLoading(true); setError('');
         const res = await fetch(`${process.env.EXPO_PUBLIC_SERVER_URL}/api/...`, {
           method: 'POST',
           headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
           body: JSON.stringify({ ... }),
         });
         const data = await res.json();
         if (!res.ok) { setError(data.error || 'Request failed'); return; }
         // handle success
       } catch (err: any) {
         setError(err?.message || 'Network error');
       } finally {
         setLoading(false);
       }

  # --- SELF-CHECK CHECKLIST (run this for every task before marking done) ---
  self_check:
    - "[ ] Does the file exist at the exact route_path?"
    - "[ ] Does every color className have a dark: variant?"
    - "[ ] Are ALL imports at the top, including useState/useEffect/useRef?"
    - "[ ] Does the template use font-JakartaBold (heading) and font-Jakarta (body) — NOT font-[Urbanist], NOT font-inter?"
    - "[ ] For API calls: is there loading state, error state, and try/catch?"
    - "[ ] Is SafeAreaView imported from react-native-safe-area-context (NOT react-native)?"
    - "[ ] Are store imports using the CORRECT path (useRiderStore from @/store/useRiderStore, others from @/store)?"
    - "[ ] Does the code use existing components (CustomButton, RideLayout, InputField) instead of building new ones?"
    - "[ ] npx tsc --noEmit — filter for YOUR files: npx tsc --noEmit 2>&1 | Select-String 'yourFile.tsx'"
    - "[ ] If tsc shows errors in files you DID NOT edit → pre-existing, report but do NOT fix"
    - "[ ] No console.log anywhere — use logger.info/warn/error from @/lib/logger"

