# =============================================================================
# UI-FACELIFT.yaml — Kimi-K2.6 Design Refresh (v2 — COMPLETE)
# =============================================================================
# Philosophy: "richer surfaces, tighter type, softer shadows"
# Source: Kimi-K2.6 facelift plan v2 (2026-07-27) — complete output with
# find/replace table + screen examples.
#
# Primary green: #0A9B4C (darker, richer than v1's #0AAF6B)
# Backgrounds: slate-tinted (#F8FAFC light, #0F1115 dark)
# Shadows: built-in Tailwind + color modifiers (no custom boxShadow needed)
# Typography: t-shirt sizes with tight tracking on headings
#
# CRITICAL: Verify `goBg` (bare) is not used directly in screens.
# If it is, keep goBg = '#0F1115' (dark) to match original semantics.
# =============================================================================
version: "1.0"
project: Ride
role: all
priority_class: P2
total_tasks: 5

global_notes:
  principle: "Replace hex values in theme + tailwind config. Class names stay the same. All screens pick up new colors automatically."
  font_rule: "font-JakartaBold (headings), font-Jakarta (body). Add tracking-tight to large headings."
  dark_rule: "EVERY color className MUST have a dark: variant."
  self_check:
    - "[ ] npx tsc --noEmit passes"
    - "[ ] App launches — no white screen"
    - "[ ] Light mode: backgrounds are #F8FAFC (slate-tinted, not pure white)"
    - "[ ] Dark mode: backgrounds are #0F1115 (not pure black)"
    - "[ ] Primary buttons are #0AAF6B (deeper emerald) with soft glow shadow"
    - "[ ] All text is readable in both modes"

