  - id: "UI-003-CUSTOMBUTTON-UPDATE"
    route_path: "components/CustomButton.tsx"
    action: audit_and_fix
    note: >
      Update the button variants to use the new shadow utilities and
      dark: variants. Key changes:
      - Primary: shadow-go-glow-primary (green ambient glow)
      - Danger: shadow-go-glow-danger (red ambient glow)
      - Secondary: uses goSurface/goSurfaceElevatedDark with border
      - Outline: border-2 instead of border-1
      - All: activeOpacity={0.85}, px-8 py-4 (48dp tap target)
      - Text: font-JakartaBold tracking-wide instead of font-bold
      - Disabled: opacity-40 instead of opacity-50
    fixes:
      - find: "bg-goDarkSecondary shadow-lg shadow-goBlue/40 border border-goBlue/60"
        replace: "bg-goSurface dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark shadow-go-sm"
      - find: "bg-goRedVariant shadow-md shadow-red-500/40 border border-red-500/60"
        replace: "bg-goDanger shadow-go-glow-danger border border-goDanger/20"
      - find: "bg-goGreenVariant shadow-md shadow-green-500/40 border border-green-500/60"
        replace: "bg-goGreenVariant shadow-go-glow-primary/30 border border-goGreenVariant/20"
      - find: "bg-transparent border border-goBlue/50"
        replace: "bg-transparent border-2 border-goPrimary"
      - find: "bg-goBlue shadow-xl shadow-goBlue/50"
        replace: "bg-goPrimary shadow-go-glow-primary"
      - find: "rounded-full p-4 flex flex-row justify-center items-center shadow-md shadow-neutral-400/70"
        replace: "rounded-full px-8 py-4 flex flex-row justify-center items-center"
      - find: "opacity-50"
        replace: "opacity-40"
      - find: "text-white text-lg font-bold"
        replace: "text-white text-base font-JakartaBold tracking-wide"
      - find: "<TouchableOpacity\n        disabled={disabled}\n        onPress={onPress}"
        replace: "<TouchableOpacity\n        activeOpacity={0.85}\n        disabled={disabled}\n        onPress={onPress}"
    verification:
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

  - id: "UI-004-GLOBAL-POLISH"
    route_path: "Multiple files (global find/replace)"
    action: audit_and_fix
    note: >
      Apply Kimi's polish patterns across the codebase. These are small
      className tweaks that add up to a premium feel.

      GLOBAL FIND/REPLACE PAIRS (apply across all .tsx files):

      1. HEADINGS: Add letter-spacing to large text
         - text-[22px] font-JakartaBold  →  text-[22px] font-JakartaBold tracking-tight
         - text-[24px] font-JakartaBold  →  text-[24px] font-JakartaBold tracking-tight
         - text-[28px] font-JakartaBold  →  text-[28px] font-JakartaBold tracking-tighter
         Only apply to headings (font-JakartaBold at 22px+). Do NOT add to body text.

      2. CARDS: Add subtle shadow
         - Find: rounded-[10px] or rounded-[12px] or rounded-[16px] with bg-goSurfaceLight
           Add: shadow-go-sm after the bg class
         Example: "bg-goSurfaceLight rounded-[12px]" → "bg-goSurfaceLight rounded-[12px] shadow-go-sm"

      3. CARD PADDING: Slightly more generous
         - p-[12px] → p-[16px] (only on card containers, not buttons)
         - p-3 → p-4 (only on card containers)

      4. INPUT FIELDS: Add focus-style border
         - Find: border border-goBorderLight in TextInput contexts
         These already work — the new border color (#E2E8F0) is softer.
         No change needed — the token swap handles it.

      5. BOTTOM SHEETS: Add elevation
         - Find: rounded-t-[20px] or rounded-t-[24px] or rounded-t-[32px]
           Add: shadow-go-lg
         Example: "rounded-t-[24px]" → "rounded-t-[24px] shadow-go-lg"

      DO NOT change:
      - Screen structure or navigation
      - Feature logic
      - Component props or interfaces
      - Any non-className code
    verification:
      - { type: command, run: "npx tsc --noEmit", expect: 0 }
      - "Visual: app looks richer — deeper green, slate-tinted backgrounds, soft shadows"
      - "Visual: dark mode is #0F1115 (not pure black) with #1A1D23 elevated surfaces"
      - "Visual: primary buttons have a subtle green glow"

  # ===========================================================================
  # TASK 5: MICRO-ANIMATIONS (Kimi-K2.6 Reanimated snippets)
  # ===========================================================================
  - id: "UI-005-ANIMATIONS"
    route_path: "Multiple files (CustomButton, RideLayout, screens with loading)"
    action: audit_and_fix
    priority: P2
    note: >
      Add 5 micro-interactions using react-native-reanimated (already in project).
      These enhance the premium feel without changing any functionality.

    animations:

      1_button_press_scale:
        where: "components/CustomButton.tsx — replace activeOpacity with scale animation"
        code: |
          import Animated, { useSharedValue, useAnimatedStyle, withSpring } from 'react-native-reanimated';
          // Inside the component:
          const scale = useSharedValue(1);
          const animatedStyle = useAnimatedStyle(() => ({ transform: [{ scale: scale.value }] }));
          // Wrap the TouchableOpacity:
          <Animated.View style={animatedStyle}>
            <TouchableOpacity
              activeOpacity={1}
              onPressIn={() => { scale.value = withSpring(0.96, { stiffness: 400, damping: 15 }); }}
              onPressOut={() => { scale.value = withSpring(1, { stiffness: 400, damping: 15 }); }}
              onPress={onPress}
              className="..."
            >
          </Animated.View>

      2_card_entrance:
        where: "Create components/AnimatedCard.tsx — reusable fade+slide wrapper for cards"
        code: |
          import Animated, { useSharedValue, useAnimatedStyle, withSpring } from 'react-native-reanimated';
          // Usage: <AnimatedCard>{children}</AnimatedCard>
          const offset = useSharedValue(24);
          const opacity = useSharedValue(0);
          const cardStyle = useAnimatedStyle(() => ({
            transform: [{ translateY: offset.value }],
            opacity: opacity.value,
          }));
          useEffect(() => {
            offset.value = withSpring(0, { stiffness: 120, damping: 14, mass: 0.8 });
            opacity.value = withSpring(1, { stiffness: 120, damping: 14 });
          }, []);
          // Render: <Animated.View style={cardStyle} className="...">{children}</Animated.View>
          // Apply to: ride estimate cards in book-ride, wallet cards, earnings cards

      3_success_checkmark:
        where: "finish-ride completion modal, payment success screens, package purchase success"
        code: |
          import Animated, { useSharedValue, useAnimatedStyle, withSpring, withDelay } from 'react-native-reanimated';
          const checkScale = useSharedValue(0);
          const checkStyle = useAnimatedStyle(() => ({
            transform: [{ scale: checkScale.value }, { rotate: `${(1 - checkScale.value) * -15}deg` }],
          }));
          useEffect(() => {
            checkScale.value = withDelay(200, withSpring(1, { stiffness: 260, damping: 12 }));
          }, []);
          // Render: <Animated.View style={checkStyle} className="w-20 h-20 rounded-full bg-goAccent/10 items-center justify-center mb-4">
          //           <Text className="text-4xl text-goAccent">✓</Text>
          //         </Animated.View>

      4_skeleton_shimmer:
        where: "Any screen with API loading state (show-ride, activity/top-up, earnings, wallet)"
        code: |
          import Animated, { useSharedValue, useAnimatedStyle, withRepeat, withTiming, Easing } from 'react-native-reanimated';
          const shimmer = useSharedValue(-200);
          const shimmerStyle = useAnimatedStyle(() => ({ transform: [{ translateX: shimmer.value }] }));
          useEffect(() => {
            shimmer.value = withRepeat(withTiming(400, { duration: 1200, easing: Easing.linear }), -1);
          }, []);
          // Render: <View className="h-4 bg-goGray200 dark:bg-goBorderDark rounded-lg overflow-hidden">
          //           <Animated.View style={shimmerStyle} className="w-[200] h-full bg-white/30 dark:bg-white/10 blur-xl" />
          //         </View>
          // Create a reusable <Skeleton width={} height={} /> component

      5_bottom_sheet_spring:
        where: "components/RideLayout.tsx — update the BottomSheet component"
        code: |
          const springConfig = useMemo(() => ({
            damping: 20, mass: 0.8, stiffness: 180,
            overshootClamping: false,
            restDisplacementThreshold: 0.01,
            restSpeedThreshold: 0.01,
          }), []);
          // Add to BottomSheet props:
          // animationConfigs={springConfig}

    verification:
      - { type: command, run: "npx tsc --noEmit", expect: 0 }
      - "Visual: buttons shrink slightly on press then spring back"
      - "Visual: cards fade+slide in when screen mounts"
      - "Visual: success screens show animated checkmark pop"
      - "Visual: loading screens show shimmer instead of blank/spinner"
      - "Visual: bottom sheets open/close with smooth spring physics"
