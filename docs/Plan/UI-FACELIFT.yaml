  - id: "UI-002-TAILWIND-REPLACE"
    route_path: "tailwind.config.js"
    action: create
    note: >
      Replace the ENTIRE file with Kimi's updated config.
      All class name aliases (goPrimary, goBgLight, etc.) stay the SAME.
      Only the hex values change. This means every existing className
      in every screen automatically picks up the new colors.
      Key additions: boxShadow utilities (go-sm, go-md, go-glow-primary),
      letterSpacing scale, lineHeight scale.
    code_template: |
      /** @type {import('tailwindcss').Config} */
      module.exports = {
        content: [
          "./App.{js,jsx,ts,tsx}",
          "./app/**/*.{js,jsx,ts,tsx}",
          "./components/**/*.{js,jsx,ts,tsx}",
          "./global.css"
        ],
        presets: [require("nativewind/preset")],
        theme: {
