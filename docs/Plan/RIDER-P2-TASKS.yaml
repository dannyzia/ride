  # ===========================================================================
  - id: "RIDER-041-ADD-STOP"
    screen_numbers: [24]
    wireframe: "## 24. Add Stop / Multi-Destination"
    route_path: "app/(main)/(customer)/add-stop/index.tsx"
    action: create
    note: >
      CREATE this file. FIXED from v3: added missing useState import. Uses ScrollView with contentContainerStyle (correct pattern).
    code_template: |
      import { useState } from "react";
      import { View, Text, TouchableOpacity, ScrollView, TextInput } from "react-native";
      import { SafeAreaView } from "react-native-safe-area-context";
      import { router } from "expo-router";
      import { useRiderStore } from "@/store/useRiderStore";
      
      export default function AddStop() {
        const [stops, setStops] = useState<string[]>([]);
        const [newStop, setNewStop] = useState("");
      
        const addStop = () => {
          if (newStop.trim()) {
            setStops([...stops, newStop.trim()]);
            setNewStop("");
          }
        };
      
        const removeStop = (index: number) => {
          setStops(stops.filter((_, i) => i !== index));
        };
      
        const continueToFares = () => {
          router.push("/(main)/(customer)/select-category");
        };
      
        return (
          <SafeAreaView className="flex-1 bg-goBgLight dark:bg-goBgDark">
            <View className="flex-row items-center px-[24px] py-[16px] border-b border-goBorderLight dark:border-goBorderDark">
              <TouchableOpacity onPress={() => router.back()}>
                <Text className="text-[16px] font-Jakarta text-goPrimary">Back</Text>
              </TouchableOpacity>
              <Text className="flex-1 text-center text-[18px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark">Add Stop</Text>
              <View className="w-[50px]" />
            </View>
            <ScrollView className="flex-1 px-[24px]" contentContainerStyle={{ paddingBottom: 24 }}>
              <View className="mt-4 mb-4">
                <Text className="text-[16px] font-JakartaBold text-goTextPrimaryLight dark:text-goTextPrimaryDark mb-2">
                  Your Stops
                </Text>
                {stops.length > 0 ? (
                  <>
                    {stops.map((stop, index) => (
                      <View key={index} className="mb-2">
                        <View className="flex-row items-center px-[12px] py-[8px] bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[8px]">
                          <Text className="flex-1 text-[14px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark">
                            {stop}
                          </Text>
                          <TouchableOpacity className="p-[6px]" onPress={() => removeStop(index)}>
                            <Text className="text-[16px] text-goTextSecondaryLight dark:text-goTextSecondaryDark">✕</Text>
                          </TouchableOpacity>
                        </View>
                      </View>
                    ))}
                    <View className="mt-2">
                      <TouchableOpacity
                        className="w-full bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[8px] px-[12px] py-[8px]"
                        onPress={addStop}
                      >
                        <Text className="text-[14px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark">+ Add another stop</Text>
                      </TouchableOpacity>
                    </View>
                  </>
                ) : (
                  <Text className="text-[14px] font-Jakarta text-goTextSecondaryLight dark:text-goTextSecondaryDark text-center py-[16px]">
                    No stops added yet
                  </Text>
                )}
                <View className="mt-4">
                  <TextInput
                    className="bg-goSurfaceLight dark:bg-goSurfaceElevatedDark border border-goBorderLight dark:border-goBorderDark rounded-[10px] px-[16px] py-[14px] text-[15px] font-Jakarta text-goTextPrimaryLight dark:text-goTextPrimaryDark"
                    placeholder="Enter stop location"
                    placeholderTextColor="#9CA3AF"
                    value={newStop}
                    onChangeText={setNewStop}
                  />
                </View>
              </View>
              <View className="mt-6">
                <TouchableOpacity
                  className="bg-goPrimary rounded-full w-full py-[16px] items-center"
                  onPress={continueToFares}
                  disabled={stops.length === 0}
                >
                  <Text className="text-[18px] font-JakartaBold text-goWhite">Continue to Fares</Text>
                </TouchableOpacity>
              </View>
            </ScrollView>
          </SafeAreaView>
        );
      }
    verification:
      - { type: file_exists, path: "app/(main)/(customer)/add-stop/index.tsx" }
      - { type: command, run: "npx tsc --noEmit", expect: 0 }

